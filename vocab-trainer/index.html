orsement of a proposal","zh":"对某项提案的支持／认可","ex":"The endorsement of a proposal does not ensure its success.","cn":"支持一项提案并不能保证它成功。"},{"en":"refusal does not amount to opposition","zh":"拒绝并不等同于反对","ex":"Refusal does not amount to opposition to all future reforms.","cn":"拒绝并不等于反对今后的所有改革。"},{"en":"rejection does not imply hostility","zh":"拒绝不意味着敌意","ex":"Rejection does not imply hostility toward the people involved.","cn":"拒绝并不意味着敌视有关人员。"},{"en":"criticism does not amount to rejection","zh":"批评并不等同于否定","ex":"Criticism does not amount to rejection of the entire project.","cn":"批评并不等于否定整个项目。"},{"en":"an attempt to justify the decision","zh":"试图证明该决定合理","ex":"The article examines an attempt to justify the decision.","cn":"文章探讨了试图证明这一决定合理的做法。"},{"en":"an attempt to challenge the decision","zh":"试图质疑该决定","ex":"The article examines an attempt to challenge the decision.","cn":"文章探讨了试图质疑这一决定的做法。"},{"en":"an argument for government intervention","zh":"支持政府干预的论点","ex":"The discussion focused on an argument for government intervention.","cn":"讨论重点是支持政府干预的论点。"},{"en":"an argument against government intervention","zh":"反对政府干预的论点","ex":"The discussion focused on an argument against government intervention.","cn":"讨论重点是反对政府干预的论点。"},{"en":"a justification for the policy","zh":"支持该政策合理性的理由","ex":"The article examines a justification for the policy.","cn":"文章探讨了支持该政策合理性的理由。"},{"en":"a criticism of the policy","zh":"对该政策的批评","ex":"The article examines a criticism of the policy.","cn":"文章探讨了对该政策的批评。"},{"en":"an alternative to the current policy","zh":"当前政策的替代方案","ex":"The article examines an alternative to the current policy.","cn":"文章探讨了现行政策的替代方案。"},{"en":"an alternative interpretation of the evidence","zh":"对证据的另一种解释","ex":"The article examines an alternative interpretation of the evidence.","cn":"文章探讨了对证据的另一种解释。"},{"en":"the interpretation offered by the author","zh":"作者提出的解释","ex":"The article examines the interpretation offered by the author.","cn":"文章探讨了作者提出的解释。"},{"en":"the interpretation rejected by the author","zh":"作者否定的解释","ex":"The article examines the interpretation rejected by the author.","cn":"文章探讨了作者拒绝接受的解释。"},{"en":"the view expressed by the critics","zh":"批评者表达的观点","ex":"The article examines the view expressed by the critics.","cn":"文章探讨了批评者表达的观点。"},{"en":"the view criticized by the author","zh":"受到作者批评的观点","ex":"The article examines the view criticized by the author.","cn":"文章探讨了作者批评的观点。"},{"en":"the belief shared by the public","zh":"公众普遍持有的信念","ex":"The article examines the belief shared by the public.","cn":"文章探讨了公众普遍持有的信念。"},{"en":"the belief attributed to the public","zh":"被归于公众的信念（未必属实）","ex":"The article examines the belief attributed to the public.","cn":"文章探讨了被归于公众的信念。"},{"en":"the position taken by the government","zh":"政府采取的立场","ex":"The article examines the position taken by the government.","cn":"文章探讨了政府采取的立场。"},{"en":"the policy advocated by the government","zh":"政府倡导的政策","ex":"The article examines the policy advocated by the government.","cn":"文章探讨了政府倡导的政策。"},{"en":"the position the government opposes","zh":"政府反对的立场","ex":"The article examines the position the government opposes.","cn":"文章探讨了政府反对的立场。"},{"en":"the policy the government opposes","zh":"政府反对的政策","ex":"The article examines the policy the government opposes.","cn":"文章探讨了政府反对的政策。"},{"en":"a demand for stricter rules","zh":"要求更严格规则的诉求","ex":"The discussion focused on a demand for stricter rules.","cn":"讨论重点是要求制定更严格规定的诉求。"},{"en":"a rule that demands compliance","zh":"要求遵守的规则；必须遵守的规定","ex":"The discussion focused on a rule that demands compliance.","cn":"讨论重点是要求人们遵守的规则。"},{"en":"France demands a role in ...","zh":"法国要求在……中拥有一定作用／地位","ex":"France demands a role in shaping international digital tax rules.","cn":"法国要求在制定国际数字税规则方面发挥一定作用。"},{"en":"France demands a rule for ...","zh":"法国要求针对……制定一项规则","ex":"France demands a rule for taxing cross-border digital services.","cn":"法国要求为跨境数字服务征税制定规则。"},{"en":"the company demands compensation","zh":"公司要求赔偿","ex":"The company demands compensation for the lost revenue.","cn":"公司要求赔偿收入损失。"},{"en":"the task demands careful attention","zh":"这项任务需要细致关注","ex":"The task demands careful attention to detail.","cn":"这项任务需要认真关注细节。"},{"en":"the public demands an explanation","zh":"公众要求作出解释","ex":"The public demands an explanation for the sudden price increase.","cn":"公众要求解释突然涨价的原因。"},{"en":"the situation demands immediate action","zh":"形势需要立即采取行动","ex":"The situation demands immediate action from the regulator.","cn":"形势要求监管机构立即采取行动。"},{"en":"a role in the digital economy","zh":"在数字经济中的作用／地位","ex":"Small firms want a role in the digital economy.","cn":"小企业希望在数字经济中占有一席之地。"},{"en":"a rule governing the digital economy","zh":"规范数字经济的规则","ex":"Legislators proposed a rule governing the digital economy.","cn":"立法者提出了一项规范数字经济的规则。"},{"en":"a policy requiring public support","zh":"需要公众支持的政策","ex":"The discussion focused on a policy requiring public support.","cn":"讨论重点是需要公众支持的政策。"},{"en":"public support required by the policy","zh":"该政策所需要的公众支持","ex":"The article examines public support required by the policy.","cn":"文章探讨了这项政策所需要的公众支持。"},{"en":"a study designed to test a theory","zh":"旨在检验某理论的研究","ex":"The discussion focused on a study designed to test a theory.","cn":"讨论重点是旨在检验某项理论的研究。"},{"en":"a theory designed to explain the findings","zh":"为解释研究发现而提出的理论","ex":"The article examines a theory designed to explain the findings.","cn":"文章探讨了为解释研究发现而设计的理论。"},{"en":"a proposal intended to reduce inequality","zh":"旨在减少不平等的提案","ex":"The discussion focused on a proposal intended to reduce inequality.","cn":"讨论重点是旨在减少不平等的提案。"},{"en":"an unintended consequence of reform","zh":"改革的意外后果","ex":"The discussion focused on an unintended consequence of reform.","cn":"讨论重点是改革带来的意外后果。"},{"en":"the implied criticism of the policy","zh":"对该政策隐含的批评","ex":"The article examines the implied criticism of the policy.","cn":"文章探讨了对该政策隐含的批评。"},{"en":"the supposed benefits of the policy","zh":"该政策所谓的益处","ex":"The article examines the supposed benefits of the policy.","cn":"文章探讨了这项政策所谓的益处。"},{"en":"the alleged misconduct of the company","zh":"该公司被指称的不当行为（尚未经证实）","ex":"The article examines the alleged misconduct of the company.","cn":"文章探讨了该公司被指称的不当行为。"},{"en":"the actual outcome of the policy","zh":"该政策的实际结果","ex":"The article examines the actual outcome of the policy.","cn":"文章探讨了该政策的实际结果。"},{"en":"dismiss A as B","zh":"以 B 为由否定或不理会 A；认为 A 不过是 B","ex":"The minister dismissed the criticism as politically motivated.","cn":"部长认为这些批评出于政治动机，因此不予理会。"},{"en":"qualify as ...","zh":"符合……的资格或定义；算作……","ex":"Under the law, the firm does not qualify as a small business.","cn":"依照法律，这家公司不符合小企业的认定标准。"},{"en":"qualify for ...","zh":"有资格获得……；符合申请……的条件","ex":"Students from low-income families may qualify for financial aid.","cn":"低收入家庭的学生可能有资格获得经济资助。"},{"en":"qualify to do ...","zh":"有资格或符合条件去做……","ex":"Only certified inspectors qualify to conduct these tests.","cn":"只有获得认证的检查员才有资格开展这些测试。"},{"en":"qualify a statement","zh":"给说法加限制条件；使表述不那么绝对","ex":"The economist qualified her statement by noting several exceptions.","cn":"经济学家指出几个例外，对自己的说法作出限定。"},{"en":"dismiss a concern as unfounded","zh":"以缺乏依据为由不理会某项担忧","ex":"Officials dismissed the public concern as unfounded without examining the evidence.","cn":"官员没有审查证据，就以没有根据为由忽视了公众的担忧。"},{"en":"dismiss a proposal as unrealistic","zh":"认为提案不切实际而否定它","ex":"The committee dismissed the proposal as unrealistic.","cn":"委员会认为这项提案不切实际，因而予以否定。"},{"en":"dismiss an objection","zh":"驳回异议；不予理会反对意见","ex":"The judge dismissed the objection after reviewing the documents.","cn":"法官审查文件后驳回了异议。"},{"en":"dismiss an employee","zh":"解雇员工","ex":"The company dismissed an employee for repeated misconduct.","cn":"公司因一名员工屡次行为不当而将其解雇。"},{"en":"dismiss a case","zh":"驳回案件；法院不予受理／继续审理","ex":"The court dismissed the case for lack of evidence.","cn":"法院以缺乏证据为由驳回了此案。"},{"en":"dismiss the possibility of ...","zh":"排除或不予考虑……的可能性","ex":"We cannot dismiss the possibility of further delays.","cn":"我们不能排除进一步延误的可能性。"},{"en":"challenge an interpretation","zh":"质疑一种解释","ex":"The historian challenged the usual interpretation of the records.","cn":"历史学家质疑对这些记录的通常解释。"},{"en":"challenge the evidence","zh":"对证据的可靠性提出质疑","ex":"The lawyer challenged the evidence presented by the prosecution.","cn":"律师质疑检方提交的证据。"},{"en":"challenge the authority of ...","zh":"质疑……的权威或权限","ex":"The decision challenged the authority of the regulator.","cn":"这一决定挑战了监管机构的权威。"},{"en":"a challenge to the established view","zh":"对既有观点的挑战或质疑","ex":"The findings represent a challenge to the established view.","cn":"这些发现对既有观点构成了挑战。"},{"en":"direct A at B","zh":"把 A 指向／针对 B","ex":"The campaign directed its criticism at government officials.","cn":"这场活动将批评矛头指向政府官员。"},{"en":"direct resources toward ...","zh":"把资源投入……领域","ex":"The agency directed resources toward rural schools.","cn":"该机构将资源投入农村学校。"},{"en":"direct a question to somebody","zh":"向某人提出问题","ex":"The reporter directed a question to the minister.","cn":"记者向部长提出了一个问题。"},{"en":"direct somebody to ...","zh":"指示某人前往……；引导其去……","ex":"The website directs users to the official guidance.","cn":"该网站引导用户查阅官方指南。"},{"en":"direct one's attention to ...","zh":"把注意力转向……","ex":"The author directs the reader's attention to an overlooked detail.","cn":"作者引导读者注意一个被忽视的细节。"},{"en":"a targeted approach","zh":"有针对性的方法","ex":"The study recommends a targeted approach to reducing poverty.","cn":"研究建议采用有针对性的方法减少贫困。"},{"en":"advance (a proposal)","zh":"正式提出某项提议","ex":"The committee advanced a proposal to improve public transport.","cn":"委员会提出了改善公共交通的提案。"},{"en":"advance (a theory)","zh":"提出某种理论","ex":"The researcher advanced a theory to explain the unusual pattern.","cn":"研究人员提出一种理论来解释异常模式。"},{"en":"advance (a cause)","zh":"推进某项事业／主张","ex":"Public donations helped advance the cause of education.","cn":"公众捐款有助于推动教育事业。"},{"en":"advance (a career)","zh":"推动事业发展；获得职业晋升","ex":"Further training may help her advance her career.","cn":"进一步培训可能有助于她的职业发展。"},{"en":"appreciate the implications","zh":"理解其深层含义或后果","ex":"Policymakers must appreciate the implications of the findings.","cn":"政策制定者必须理解这些发现的深层影响。"},{"en":"appreciate in value","zh":"升值","ex":"The property appreciated in value over the decade.","cn":"这处房产在这十年里升值了。"},{"en":"appreciate the difficulty","zh":"认识到困难之所在","ex":"The panel appreciated the difficulty of enforcing the rule.","cn":"专家组认识到执行这项规定的困难。"},{"en":"assume office","zh":"就职；上任","ex":"The new minister will assume office next month.","cn":"新部长将于下个月就职。"},{"en":"assume control of ...","zh":"接管……的控制权","ex":"The state assumed control of the railway network.","cn":"国家接管了铁路网络的控制权。"},{"en":"assume a role","zh":"承担某个角色／职责","ex":"Volunteers assumed a larger role in running the library.","cn":"志愿者在图书馆运营中承担了更重要的角色。"},{"en":"assume a causal link","zh":"假定存在因果联系","ex":"The report wrongly assumes a causal link between the two trends.","cn":"报告错误地假定这两种趋势之间存在因果联系。"},{"en":"bear out an argument","zh":"证实某项论点","ex":"The latest data bear out the author's argument.","cn":"最新数据证实了作者的论点。"},{"en":"break down a problem","zh":"将问题分解","ex":"The teacher broke down the problem into simpler parts.","cn":"老师将问题分解为更简单的部分。"},{"en":"break down barriers","zh":"消除障碍","ex":"Online education can break down barriers to learning.","cn":"在线教育可以消除学习障碍。"},{"en":"bring about a change","zh":"引起／促成变化","ex":"The campaign brought about a change in public attitudes.","cn":"这场活动促使公众态度发生变化。"},{"en":"bring forward an objection","zh":"提出异议","ex":"Several members brought forward an objection to the plan.","cn":"几名成员对该计划提出了异议。"},{"en":"bring somebody to account","zh":"追究某人的责任","ex":"The investigation brought the officials to account for their actions.","cn":"调查追究了官员行为的责任。"},{"en":"call for reform","zh":"要求／呼吁改革","ex":"The new report calls for reform of the tax system.","cn":"新报告呼吁改革税收制度。"},{"en":"call for caution","zh":"需要谨慎处理","ex":"The preliminary results call for caution.","cn":"初步结果表明需要谨慎对待。"},{"en":"carry weight","zh":"有分量；具有说服力","ex":"Her opinion carries weight because of her expertise.","cn":"由于她具备专业知识，她的意见很有分量。"},{"en":"carry implications for ...","zh":"对……具有影响或意义","ex":"The ruling carries implications for small businesses.","cn":"这一裁决对小企业具有影响。"},{"en":"cast doubt on the findings","zh":"使研究发现受到质疑","ex":"The error casts doubt on the findings.","cn":"这一错误使研究结果受到质疑。"},{"en":"cast light on the issue","zh":"揭示问题；帮助理解问题","ex":"The records cast light on the issue of ownership.","cn":"这些记录有助于阐明所有权问题。"},{"en":"claim credit for ...","zh":"声称……是自己的功劳","ex":"Both parties claimed credit for the improvement.","cn":"双方都声称改善局面是自己的功劳。"},{"en":"claim a benefit","zh":"申请领取福利或补助","ex":"Eligible workers may claim a benefit from the government.","cn":"符合条件的工人可以向政府申领福利。"},{"en":"clear a hurdle","zh":"克服障碍","ex":"The firm cleared the final regulatory hurdle.","cn":"公司克服了最后一道监管障碍。"},{"en":"clear the way for ...","zh":"为……扫清障碍","ex":"The court's ruling cleared the way for reform.","cn":"法院的裁决为改革扫清了道路。"},{"en":"compromise (a principle)","zh":"损害／牺牲某项原则","ex":"The committee refused to compromise a basic principle.","cn":"委员会拒绝牺牲一项基本原则。"},{"en":"compromise (security)","zh":"危及安全","ex":"Sharing the password could compromise security.","cn":"共享密码可能危及安全。"},{"en":"compromise on a solution","zh":"在解决方案上妥协","ex":"The two sides compromised on a workable solution.","cn":"双方就一个可行的解决方案达成了妥协。"},{"en":"concern (v.) a community","zh":"涉及／关系到某个群体","ex":"The decision concerns the entire local community.","cn":"这一决定涉及整个当地社区。"},{"en":"concede defeat","zh":"认输","ex":"The party leader conceded defeat after the vote.","cn":"党派领导人在投票后承认失败。"},{"en":"conduct a review","zh":"开展审查／评估","ex":"The agency conducted a review of safety practices.","cn":"该机构开展了一项安全做法审查。"},{"en":"conduct oneself","zh":"举止表现","ex":"Officials are expected to conduct themselves professionally.","cn":"官员应当表现得专业得体。"},{"en":"confine an analysis to ...","zh":"把分析限定在……范围内","ex":"The study confines its analysis to urban schools.","cn":"这项研究将分析范围限定在城市学校。"},{"en":"constitute a threat","zh":"构成威胁","ex":"Rising costs could constitute a threat to the hospital.","cn":"成本上涨可能对医院构成威胁。"},{"en":"count as evidence","zh":"算作证据","ex":"The survey results do not count as evidence of causation.","cn":"调查结果不能算作因果关系的证据。"},{"en":"count against a proposal","zh":"成为反对提案的理由","ex":"The high cost counts against the proposal.","cn":"高成本是反对该提案的一个理由。"},{"en":"counter a trend","zh":"抵消或扭转某种趋势","ex":"The policy aims to counter a trend of falling employment.","cn":"该政策旨在扭转就业人数下降的趋势。"},{"en":"credit A with B","zh":"认为 A 有 B 这一贡献；把 B 归功于 A","ex":"The report credits the volunteers with keeping the library open.","cn":"报告认为志愿者帮助图书馆继续开放功不可没。"},{"en":"credit the increase to ...","zh":"将增长归因于……","ex":"The analyst credited the increase to higher demand.","cn":"分析师将增长归因于需求增加。"},{"en":"declare an interest","zh":"声明自己有相关利益关系","ex":"Members must declare an interest before discussing contracts.","cn":"成员在讨论合同前必须申报相关利益关系。"},{"en":"deliver on a promise","zh":"履行承诺","ex":"The government failed to deliver on its promise.","cn":"政府未能履行其承诺。"},{"en":"deliver results","zh":"取得成果","ex":"The intervention must deliver results to justify its cost.","cn":"这项干预必须取得成果，才能证明其成本合理。"},{"en":"discourage investment","zh":"抑制投资意愿","ex":"Uncertain rules may discourage investment.","cn":"不确定的规定可能抑制投资意愿。"},{"en":"discourage A from doing B","zh":"劝阻／阻止 A 做 B","ex":"The fines discourage firms from concealing information.","cn":"罚款能阻止企业隐瞒信息。"},{"en":"dispose of an argument","zh":"反驳或处理完某项论点","ex":"The judge disposed of the argument in a few sentences.","cn":"法官用几句话就驳倒了这一论点。"},{"en":"dispose of waste","zh":"处理废物","ex":"Factories must dispose of waste safely.","cn":"工厂必须安全处理废弃物。"},{"en":"draw on evidence","zh":"利用证据","ex":"The report draws on evidence from several studies.","cn":"报告利用了多项研究的证据。"},{"en":"draw criticism","zh":"招致批评","ex":"The announcement drew criticism from consumer groups.","cn":"这一公告招致消费者团体的批评。"},{"en":"embrace a policy","zh":"接受／积极支持某项政策","ex":"The council embraced a policy of open data.","cn":"委员会接受了一项开放数据政策。"},{"en":"engage with an argument","zh":"认真回应／讨论某个论点","ex":"The article fails to engage with the strongest opposing argument.","cn":"这篇文章未能认真回应最有力的反对论点。"},{"en":"engage in a practice","zh":"从事某种行为或做法","ex":"The company denied engaging in an unfair practice.","cn":"公司否认从事不公平行为。"},{"en":"entertain a possibility","zh":"考虑某种可能性","ex":"The panel entertained the possibility of a measurement error.","cn":"专家组考虑了测量出错的可能性。"},{"en":"exercise discretion","zh":"行使自由裁量权","ex":"Officials may exercise discretion in unusual cases.","cn":"官员可以在特殊情况下行使自由裁量权。"},{"en":"exercise authority","zh":"行使权力","ex":"The agency exercised its authority to impose penalties.","cn":"该机构行使职权实施处罚。"},{"en":"exhaust available options","zh":"穷尽可用的选择","ex":"The team exhausted all available options before closing the project.","cn":"团队在关闭项目前穷尽了所有可用选择。"},{"en":"expose a weakness","zh":"暴露弱点","ex":"The trial exposed a weakness in the original design.","cn":"试验暴露了原始设计的一个弱点。"},{"en":"expose somebody to risk","zh":"使某人面临风险","ex":"Weak safeguards expose users to risk.","cn":"薄弱的保障措施使用户面临风险。"},{"en":"face a backlash","zh":"面临强烈反对","ex":"The company faced a backlash after increasing prices.","cn":"公司在涨价后遭遇强烈反对。"},{"en":"feature in the debate","zh":"在争论中占有重要位置／被提及","ex":"Funding problems featured prominently in the debate.","cn":"资金问题在辩论中占据突出位置。"},{"en":"figure in the calculation","zh":"被纳入计算或考虑","ex":"Maintenance costs must figure in the calculation.","cn":"维护成本必须计入计算。"},{"en":"file a complaint","zh":"提出／提交投诉","ex":"Residents filed a complaint about the noise.","cn":"居民就噪声问题提出了投诉。"},{"en":"file a lawsuit","zh":"提起诉讼","ex":"The association filed a lawsuit against the operator.","cn":"该协会对运营商提起了诉讼。"},{"en":"frame a question","zh":"设计或表述一个问题","ex":"The author framed the question in terms of fairness.","cn":"作者从公平的角度提出了这个问题。"},{"en":"frame a debate in terms of ...","zh":"从……角度界定争论","ex":"The minister framed the debate in terms of national security.","cn":"部长从国家安全角度界定了这场辩论。"},{"en":"give rise to concern","zh":"引发担忧","ex":"The change gave rise to concern about privacy.","cn":"这种变化引发了对隐私的担忧。"},{"en":"go some way toward ...","zh":"在一定程度上有助于……","ex":"The reform goes some way toward reducing inequality.","cn":"改革在一定程度上有助于减少不平等。"},{"en":"hold office","zh":"担任公职","ex":"She held office for four years.","cn":"她担任公职四年。"},{"en":"hold somebody accountable","zh":"追究某人的责任","ex":"The court held the director accountable for the losses.","cn":"法院追究了董事对损失的责任。"},{"en":"impose a burden on ...","zh":"给……造成负担","ex":"The tax could impose a burden on small firms.","cn":"这项税收可能给小企业造成负担。"},{"en":"impose limits on ...","zh":"对……施加限制","ex":"Regulators imposed limits on data collection.","cn":"监管机构对数据收集施加了限制。"},{"en":"inform a decision","zh":"为决策提供依据","ex":"Reliable evidence should inform the final decision.","cn":"可靠证据应当为最终决定提供参考。"},{"en":"inform the public","zh":"向公众告知情况","ex":"The agency must inform the public about the risks.","cn":"该机构必须告知公众相关风险。"},{"en":"insist that ...","zh":"坚持认为／坚持要求……（结合语境）","ex":"The union insisted that management improve safety conditions.","cn":"工会坚持要求管理层改善安全条件。"},{"en":"justify a decision","zh":"证明决定有正当理由","ex":"Officials must justify the decision with evidence.","cn":"官员必须用证据证明这一决定合理。"},{"en":"justify concern","zh":"使担忧有根据","ex":"The warning signs justify concern about future costs.","cn":"这些警示信号使人有理由担忧未来成本。"},{"en":"launch an inquiry","zh":"启动调查","ex":"Parliament launched an inquiry into the scandal.","cn":"议会就这起丑闻启动了一项调查。"},{"en":"leverage existing resources","zh":"利用现有资源发挥杠杆效应","ex":"The project leveraged existing resources to reduce costs.","cn":"该项目利用现有资源降低成本。"},{"en":"maintain that ...","zh":"坚持主张……","ex":"The firm maintains that it complied with the rules.","cn":"公司坚持认为自己遵守了规定。"},{"en":"meet a standard","zh":"达到标准","ex":"The product failed to meet the required standard.","cn":"该产品未能达到要求的标准。"},{"en":"meet a deadline","zh":"赶上截止期限","ex":"The team worked overtime to meet the deadline.","cn":"团队加班以赶上最后期限。"},{"en":"measure up to ...","zh":"达到……要求或标准","ex":"The new system does not measure up to expectations.","cn":"新系统没有达到预期。"},{"en":"mount an objection","zh":"提出反对意见","ex":"Several lawmakers mounted an objection to the rule.","cn":"几名议员对规定提出了反对意见。"},{"en":"mounting pressure","zh":"日益增加的压力","ex":"The agency faced mounting pressure to act.","cn":"该机构面临越来越大的行动压力。"},{"en":"note (v.) that ...","zh":"指出／注意到……","ex":"The author notes that the sample is relatively small.","cn":"作者指出样本量相对较小。"},{"en":"observe (v.) that ...","zh":"评论／指出……","ex":"The researchers observed that prices rose more slowly.","cn":"研究人员注意到价格上涨速度放缓。"},{"en":"observe a rule","zh":"遵守规则","ex":"Every firm must observe the same safety rule.","cn":"每家企业都必须遵守相同的安全规定。"},{"en":"observe a trend","zh":"观察到一种趋势","ex":"Analysts observed a trend toward online shopping.","cn":"分析师观察到转向网上购物的趋势。"},{"en":"open up opportunities","zh":"创造机会","ex":"The new program opened up opportunities for graduates.","cn":"新项目为毕业生创造了就业机会。"},{"en":"override objections","zh":"不顾反对意见而推行","ex":"The court overrode objections to the proposed change.","cn":"法院不顾反对意见，批准了拟议中的变化。"},{"en":"overlook an implication","zh":"忽略一个潜在影响","ex":"The article overlooks an implication of the ruling.","cn":"文章忽略了这一裁决的一项潜在影响。"},{"en":"pay off (a debt)","zh":"还清债务","ex":"The household paid off its debt ahead of schedule.","cn":"这个家庭提前还清了债务。"},{"en":"pay off (a strategy)","zh":"策略取得成功；获得回报","ex":"The strategy of early investment eventually paid off.","cn":"早期投资的策略最终得到了回报。"},{"en":"pose a risk to ...","zh":"对……造成风险","ex":"The faulty equipment poses a risk to workers.","cn":"故障设备对工人构成风险。"},{"en":"present a challenge","zh":"带来难题／构成挑战","ex":"Rapid growth presents a challenge for local services.","cn":"快速增长给当地公共服务带来了挑战。"},{"en":"press for change","zh":"敦促／强烈要求改革","ex":"Campaigners pressed for change in the law.","cn":"活动人士强烈要求修改法律。"},{"en":"press a claim","zh":"坚持主张；提出权利要求","ex":"The firm pressed its claim for compensation.","cn":"该公司坚持其赔偿请求。"},{"en":"prevail over ...","zh":"战胜……；占上风","ex":"Public interest should prevail over private convenience.","cn":"公共利益应当优先于私人便利。"},{"en":"proceed from an assumption","zh":"以某一假设为出发点","ex":"The argument proceeds from an untested assumption.","cn":"这个论点从一个未经检验的假设出发。"},{"en":"project (v.) growth","zh":"预测增长","ex":"The bank projects growth of two percent.","cn":"银行预计增长2%。"},{"en":"project an image","zh":"塑造一种形象","ex":"The campaign projects an image of confidence.","cn":"这场活动塑造了一种充满信心的形象。"},{"en":"promote a view","zh":"推广／倡导某种观点","ex":"The article promotes a view of technology as neutral.","cn":"文章宣扬技术是中立的这一观点。"},{"en":"pursue an argument","zh":"继续阐述或追究某一论点","ex":"The author pursues this argument in the next section.","cn":"作者在下一节继续展开这一论点。"},{"en":"raise a concern","zh":"提出担忧","ex":"The inquiry raised a concern about the data.","cn":"这项调查提出了对数据的担忧。"},{"en":"raise an objection","zh":"提出异议","ex":"The lawyer raised an objection during the hearing.","cn":"律师在听证会上提出异议。"},{"en":"reach an agreement","zh":"达成协议","ex":"The two sides reached an agreement on wages.","cn":"双方就工资问题达成协议。"},{"en":"reason (v.) that ...","zh":"推理认为……","ex":"The judges reasoned that the law did not apply.","cn":"法官们推断这项法律不适用。"},{"en":"reflect on an issue","zh":"认真思考某个问题","ex":"The author reflects on the issue of public trust.","cn":"作者反思了公众信任的问题。"},{"en":"reflect a change","zh":"反映某种变化","ex":"The figures reflect a change in consumer behavior.","cn":"这些数字反映了消费者行为的变化。"},{"en":"register concern","zh":"正式表达担忧","ex":"The teachers registered concern about the new system.","cn":"教师们表达了对新系统的担忧。"},{"en":"render a policy ineffective","zh":"使政策失效","ex":"Weak enforcement rendered the policy ineffective.","cn":"执法不力使这项政策失去效力。"},{"en":"render a decision","zh":"作出裁决","ex":"The court rendered its decision on Friday.","cn":"法院于星期五作出了裁决。"},{"en":"resort to ...","zh":"诉诸……（常含无奈意味）","ex":"The company resorted to layoffs to cut costs.","cn":"公司为削减成本而采取裁员措施。"},{"en":"retain control","zh":"保留控制权","ex":"The government retained control of the infrastructure.","cn":"政府保留了对基础设施的控制权。"},{"en":"reverse a decision","zh":"撤销／推翻某项决定","ex":"The committee reversed its earlier decision.","cn":"委员会推翻了先前的决定。"},{"en":"reverse a trend","zh":"扭转趋势","ex":"The new investment helped reverse the trend of falling employment.","cn":"新投资有助于扭转就业下降趋势。"},{"en":"rule (v.) that ...","zh":"（法院等）裁定……","ex":"The court ruled that the company had broken the law.","cn":"法院裁定该公司违反了法律。"},{"en":"rule in favor of ...","zh":"作出有利于……的裁决","ex":"The judge ruled in favor of the workers.","cn":"法官作出了有利于工人的裁决。"},{"en":"secure approval","zh":"获得批准","ex":"The developers secured approval for the project.","cn":"开发商取得了项目批准。"},{"en":"secure a position","zh":"获得职位","ex":"She secured a position at the research institute.","cn":"她在研究所获得了一个职位。"},{"en":"serve as evidence","zh":"可作为证据","ex":"The records serve as evidence of earlier ownership.","cn":"这些记录可以证明早期的所有权归属。"},{"en":"settle a dispute","zh":"解决争端","ex":"The parties settled the dispute outside court.","cn":"双方在庭外解决了争端。"},{"en":"settle for less","zh":"退而接受较差条件","ex":"Consumers should not have to settle for less.","cn":"消费者不应该被迫接受较差的选择。"},{"en":"share a concern","zh":"有同样的担忧","ex":"Both groups share a concern about rising costs.","cn":"两个群体都对成本上升表示担忧。"},{"en":"shelter a business from competition","zh":"使企业免受竞争压力","ex":"Subsidies may shelter a business from competition.","cn":"补贴可能使企业免受竞争压力。"},{"en":"signify a shift","zh":"标志着转变","ex":"The ruling signifies a shift in regulatory policy.","cn":"这一裁决意味着监管政策发生了转变。"},{"en":"speak to an issue","zh":"说明／涉及某个问题","ex":"The data speak to the issue of unequal access.","cn":"这些数据与机会获取不平等的问题有关。"},{"en":"speak for a group","zh":"代表某群体发言","ex":"The union representative spoke for the workers.","cn":"工会代表为工人发声。"},{"en":"stand by a claim","zh":"坚持某项主张","ex":"The author continued to stand by her claim.","cn":"作者继续坚持自己的主张。"},{"en":"stand for a principle","zh":"代表／支持某种原则","ex":"The association stands for the principle of equal access.","cn":"该协会拥护平等获取机会的原则。"},{"en":"submit that ...","zh":"（正式）主张／认为……","ex":"Counsel submitted that the evidence was insufficient.","cn":"律师主张证据不足。"},{"en":"sustain an objection","zh":"（法官）支持某项异议","ex":"The judge sustained the objection to the testimony.","cn":"法官支持了对证词提出的异议。"},{"en":"sustain economic growth","zh":"维持经济增长","ex":"The government hopes to sustain economic growth.","cn":"政府希望维持经济增长。"},{"en":"target a policy at ...","zh":"将政策针对……群体","ex":"The ministry targeted the policy at low-income families.","cn":"该部将政策面向低收入家庭。"},{"en":"test an assumption","zh":"检验某项假设","ex":"The researchers designed an experiment to test the assumption.","cn":"研究人员设计了一个实验来检验假设。"},{"en":"track changes","zh":"跟踪变化","ex":"The study tracks changes in public opinion over time.","cn":"这项研究追踪公众舆论随时间的变化。"},{"en":"trigger a debate","zh":"引发争论","ex":"The ruling triggered a debate about privacy.","cn":"这一裁决引发了有关隐私的辩论。"},{"en":"turn on a distinction","zh":"取决于某一区别","ex":"The legal argument turns on a distinction between ownership and control.","cn":"这一法律论点的关键在于所有权与控制权的区别。"},{"en":"uphold a decision","zh":"维持原判／支持某项裁决","ex":"The appeals court upheld the original decision.","cn":"上诉法院维持了原判。"},{"en":"validate a claim","zh":"证实某一说法成立","ex":"The second trial helped validate the claim.","cn":"第二次试验有助于验证这一说法。"},{"en":"venture an opinion","zh":"大胆提出看法","ex":"The scientist hesitated to venture an opinion without more data.","cn":"没有更多数据，科学家不愿贸然发表看法。"},{"en":"weigh evidence","zh":"权衡证据","ex":"The court weighed the evidence carefully.","cn":"法院仔细权衡了证据。"},{"en":"weigh against a proposal","zh":"构成不利于提案的因素","ex":"High costs weigh against the proposal.","cn":"高成本是反对该提案的因素。"},{"en":"yield a result","zh":"产生结果","ex":"The trial yielded a surprising result.","cn":"试验得出了令人意外的结果。"},{"en":"be accused of doing ...","zh":"被指控／指责做了……","ex":"The company was accused of hiding safety information.","cn":"该公司被指控隐瞒安全信息。"},{"en":"be acquitted of ...","zh":"被宣告……罪名不成立","ex":"The former manager was acquitted of all charges.","cn":"前经理被宣判所有指控均不成立。"},{"en":"be at odds with ...","zh":"与……不一致／相冲突","ex":"The findings are at odds with the earlier theory.","cn":"这些发现与早期理论不符。"},{"en":"be compatible with ...","zh":"与……兼容／相容","ex":"The new system is compatible with existing software.","cn":"新系统与现有软件兼容。"},{"en":"be inconsistent with ...","zh":"与……不一致","ex":"The claim is inconsistent with the data.","cn":"这种说法与数据不一致。"},{"en":"be conducive to ...","zh":"有利于……","ex":"A stable legal system is conducive to investment.","cn":"稳定的法律制度有利于投资。"},{"en":"be confined to ...","zh":"仅限于……","ex":"The study is confined to urban schools.","cn":"这项研究仅限于城市学校。"},{"en":"be constrained by ...","zh":"受……限制","ex":"Small firms are constrained by limited access to credit.","cn":"小企业受限于信贷渠道不足。"},{"en":"be critical of ...","zh":"对……持批评态度","ex":"The author is critical of the government's approach.","cn":"作者批评政府的方法。"},{"en":"be detrimental to ...","zh":"对……有害","ex":"Excessive regulation may be detrimental to innovation.","cn":"过度监管可能不利于创新。"},{"en":"be distinct from ...","zh":"与……不同","ex":"Financial support is distinct from political endorsement.","cn":"经济支持与政治上的认可是不同的。"},{"en":"be equivalent to ...","zh":"等同于……","ex":"Silence is not equivalent to consent.","cn":"沉默不等于同意。"},{"en":"be exempt from ...","zh":"免于……；不受……约束","ex":"The smallest businesses are exempt from the fee.","cn":"规模最小的企业免交这笔费用。"},{"en":"be exposed to ...","zh":"暴露于……；面临……","ex":"Residents may be exposed to harmful pollutants.","cn":"居民可能接触到有害污染物。"},{"en":"be geared toward ...","zh":"旨在满足……；面向……","ex":"The course is geared toward first-year students.","cn":"这门课程面向一年级学生。"},{"en":"be immune to ...","zh":"不受……影响／侵害","ex":"No economy is immune to sudden shocks.","cn":"没有任何经济体能免受突然冲击。"},{"en":"be implicated in ...","zh":"涉及……；被牵连进……","ex":"Several officials were implicated in the scandal.","cn":"几名官员被牵连进这起丑闻。"},{"en":"be instrumental in ...","zh":"在……中起关键作用","ex":"Local volunteers were instrumental in keeping the clinic open.","cn":"当地志愿者在维持诊所运营方面发挥了关键作用。"},{"en":"be liable for ...","zh":"对……负法律责任","ex":"The operator may be liable for the damage.","cn":"运营商可能需要对损害负责。"},{"en":"be linked to ...","zh":"与……有关联","ex":"The decline has been linked to rising energy costs.","cn":"这种下降与能源成本上涨有关。"},{"en":"be motivated by ...","zh":"受……驱动","ex":"The reform was motivated by public concern.","cn":"改革是由公众担忧推动的。"},{"en":"be obliged to do ...","zh":"有义务／不得不做……","ex":"The firm is obliged to report any serious incident.","cn":"该公司有义务报告任何严重事故。"},{"en":"be qualified for ...","zh":"符合……的任职／申请资格","ex":"She is qualified for the position.","cn":"她具备担任该职位的资格。"},{"en":"be qualified as ...","zh":"被认定为……（依具体语境）","ex":"The expert was qualified as a witness in the trial.","cn":"这位专家被认定有资格在审判中作证。"},{"en":"be skeptical about ...","zh":"对……持怀疑态度","ex":"The economist is skeptical about the proposed savings.","cn":"经济学家对拟议中的节省金额持怀疑态度。"},{"en":"be susceptible to ...","zh":"易受……影响","ex":"The system is susceptible to outside interference.","cn":"该系统容易受到外部干扰。"},{"en":"be sympathetic to ...","zh":"对……表示理解／支持","ex":"The judge was sympathetic to the workers' concerns.","cn":"法官对工人的担忧表示理解。"},{"en":"be wary of ...","zh":"警惕……","ex":"Investors are wary of uncertain regulations.","cn":"投资者对不确定的监管规定保持警惕。"},{"en":"be willing to concede ...","zh":"愿意承认或让步……","ex":"The author is willing to concede that the sample is small.","cn":"作者愿意承认样本量较小。"},{"en":"border on ...","zh":"近乎……；接近于……","ex":"His repeated warnings bordered on panic.","cn":"他反复发出的警告近乎恐慌。"},{"en":"build on an earlier finding","zh":"以先前发现为基础继续推进","ex":"The new study builds on an earlier finding about income inequality.","cn":"新研究建立在早先关于收入不平等的发现之上。"},{"en":"call A into question","zh":"使 A 的可靠性受到质疑","ex":"The new data call the original conclusion into question.","cn":"新数据使最初的结论受到质疑。"},{"en":"call somebody to account","zh":"要求某人作出解释并承担责任","ex":"Parliament called the minister to account for the delay.","cn":"议会要求部长就延误作出交代。"},{"en":"cast A as B","zh":"将 A 描绘／塑造成 B","ex":"The report casts the reform as a major success.","cn":"报告将这次改革描述为重大成功。"},{"en":"characterize A as B","zh":"将 A 描述／界定为 B","ex":"Opponents characterized the decision as unfair.","cn":"反对者认为这一决定不公平。"},{"en":"cite A as evidence of B","zh":"引用 A 作为 B 的证据","ex":"The company cited rising demand as evidence of success.","cn":"公司引用需求增加作为成功的证据。"},{"en":"cite A in support of B","zh":"援引 A 支持 B","ex":"The author cited recent surveys in support of the claim.","cn":"作者援引近期调查来支持这一说法。"},{"en":"come at the cost of ...","zh":"以牺牲……为代价","ex":"Faster growth may come at the cost of environmental damage.","cn":"更快的增长可能以损害环境为代价。"},{"en":"compete with A for B","zh":"与 A 竞争 B","ex":"Small firms compete with large companies for skilled workers.","cn":"小企业与大公司争夺熟练工人。"},{"en":"comply with regulations","zh":"遵守规章","ex":"All operators must comply with regulations.","cn":"所有运营商都必须遵守法规。"},{"en":"conflate A with B","zh":"混淆 A 和 B","ex":"The report conflates popularity with effectiveness.","cn":"报告混淆了受欢迎程度和有效性。"},{"en":"conform to a standard","zh":"符合标准","ex":"Every product must conform to the safety standard.","cn":"每件产品都必须符合安全标准。"},{"en":"contribute to a debate","zh":"为讨论作出贡献","ex":"The paper makes an important contribution to the debate over regulation.","cn":"这篇论文对有关监管的辩论作出了重要贡献。"},{"en":"correlate with ...","zh":"与……相关（不等于导致）","ex":"Higher income tends to correlate with better health outcomes.","cn":"较高收入往往与更好的健康状况相关。"},{"en":"credit A to B","zh":"把 A 归功于 B","ex":"The researchers credited the improvement to better training.","cn":"研究人员将情况改善归因于更好的培训。"},{"en":"derive support from ...","zh":"从……获得支持依据","ex":"The theory derives support from several independent studies.","cn":"这一理论得到了多项独立研究的支持。"},{"en":"detract from ...","zh":"削弱……的价值；有损于……","ex":"These minor errors do not detract from the paper's main contribution.","cn":"这些小错误无损于论文的主要贡献。"},{"en":"differentiate A from B","zh":"区分 A 和 B","ex":"Scientists must differentiate coincidence from causation.","cn":"科学家必须区分巧合与因果关系。"},{"en":"draw criticism for ...","zh":"因……招致批评","ex":"The regulator drew criticism for delaying its response.","cn":"监管机构因推迟回应而招致批评。"},{"en":"end up doing ...","zh":"最终做了……","ex":"The city ended up spending more than planned.","cn":"该市最终花的钱比计划的更多。"},{"en":"entitle somebody to ...","zh":"使某人有权获得……","ex":"The law entitles employees to paid leave.","cn":"法律赋予员工带薪休假的权利。"},{"en":"factor A into B","zh":"把 A 考虑进 B 中","ex":"The committee factored maintenance costs into its estimate.","cn":"委员会将维护成本计入估算。"},{"en":"fall back on ...","zh":"转而依靠……；退而求其次使用……","ex":"When the data were incomplete, the authors fell back on earlier estimates.","cn":"数据不完整时，作者们转而采用早期估计值。"},{"en":"fall foul of ...","zh":"违反……；触犯……","ex":"The company fell foul of competition law.","cn":"该公司违反了竞争法。"},{"en":"fall within the scope of ...","zh":"属于……范围之内","ex":"These activities fall within the scope of the new rule.","cn":"这些活动属于新规定的适用范围。"},{"en":"find fault with ...","zh":"挑……的毛病；批评……","ex":"The reviewers found fault with the sampling method.","cn":"审查人员指出抽样方法有问题。"},{"en":"focus on ... at the expense of ...","zh":"重视……却损害／忽视了……","ex":"The policy focuses on short-term savings at the expense of long-term stability.","cn":"该政策以牺牲长期稳定为代价追求短期节约。"},{"en":"get around a restriction","zh":"绕过限制","ex":"The operator tried to get around the restriction by changing its contracts.","cn":"运营商试图通过修改合同绕开限制。"},{"en":"go beyond the evidence","zh":"超出证据所能支持的范围","ex":"The conclusion goes beyond the evidence presented.","cn":"这一结论超出了所提供证据的支持范围。"},{"en":"ground a decision in evidence","zh":"以证据作为决策依据","ex":"Judges should ground their decisions in evidence.","cn":"法官应以证据为依据作出决定。"},{"en":"have no bearing on ...","zh":"与……无关；对……没有影响","ex":"The minister's personal views have no bearing on the legal question.","cn":"部长的个人观点与法律问题无关。"},{"en":"have a stake in ...","zh":"与……有利害关系","ex":"Local residents have a stake in the railway's future.","cn":"当地居民与铁路的未来有切身利益关系。"},{"en":"have little to do with ...","zh":"与……关系不大","ex":"The decline has little to do with the new advertising campaign.","cn":"这次下降与新广告活动关系不大。"},{"en":"hold A responsible for B","zh":"认为 A 应对 B 负责","ex":"The inquiry held management responsible for the failure.","cn":"调查认定管理层应对失败负责。"},{"en":"hold A to account for B","zh":"就 B 追究 A 的责任","ex":"The court held the company to account for the damage.","cn":"法院追究了公司对损害的责任。"},{"en":"impute A to B","zh":"将 A 归因／归咎于 B","ex":"The report imputes the loss to poor management.","cn":"报告将损失归咎于管理不善。"},{"en":"lay emphasis on ...","zh":"强调……","ex":"The course lays emphasis on careful reading.","cn":"这门课程强调认真阅读。"},{"en":"lay the blame for A on B","zh":"将 A 的责任归咎于 B","ex":"Officials laid the blame for the delay on suppliers.","cn":"官员将延误归咎于供应商。"},{"en":"lend credibility to ...","zh":"增强……的可信度","ex":"Independent data lend credibility to the claim.","cn":"独立数据提高了这一说法的可信度。"},{"en":"lend support to ...","zh":"为……提供支持","ex":"The results lend support to the original theory.","cn":"这些结果支持最初的理论。"},{"en":"lose sight of ...","zh":"忽视／忘记……","ex":"Policymakers must not lose sight of the needs of workers.","cn":"政策制定者不能忽视工人的需求。"},{"en":"make a case against ...","zh":"提出反对……的理由","ex":"The report makes a case against unnecessary restrictions.","cn":"报告提出了反对不必要限制的理由。"},{"en":"make allowance for ...","zh":"考虑到……；顾及……","ex":"The analysis makes allowance for regional differences.","cn":"这项分析考虑到了地区差异。"},{"en":"map A onto B","zh":"将 A 对应／映射到 B","ex":"The team mapped survey responses onto the existing categories.","cn":"团队将调查回答对应到现有类别。"},{"en":"misread A as B","zh":"将 A 误读为 B","ex":"She misread the word 'role' as 'rule'.","cn":"她把单词“role”误看成了“rule”。"},{"en":"misrepresent A as B","zh":"把 A 歪曲／错误呈现为 B","ex":"The article misrepresented a tentative finding as a proven fact.","cn":"文章把一项暂时性的发现歪曲成了已证实的事实。"},{"en":"obscure the distinction between A and B","zh":"模糊 A 与 B 的区别","ex":"The wording obscures the distinction between ownership and control.","cn":"这种措辞模糊了所有权与控制权的区别。"},{"en":"on the assumption that ...","zh":"假设……","ex":"The budget was prepared on the assumption that prices would remain stable.","cn":"预算是按照价格将保持稳定的假设编制的。"},{"en":"on the basis of ...","zh":"基于……","ex":"The decision was made on the basis of new evidence.","cn":"这一决定是依据新证据作出的。"},{"en":"open the door to ...","zh":"为……创造可能；开启……的机会","ex":"The ruling opened the door to further lawsuits.","cn":"这一裁决为进一步诉讼打开了大门。"},{"en":"outweigh the benefits","zh":"超过好处；弊大于利（需结合主语）","ex":"The costs may outweigh the benefits of the reform.","cn":"成本可能超过改革的收益。"},{"en":"pass A off as B","zh":"把 A 冒充为 B","ex":"The company tried to pass advertising material off as independent research.","cn":"公司试图将广告材料冒充独立研究。"},{"en":"place a premium on ...","zh":"特别重视……；赋予高价值","ex":"Employers place a premium on practical experience.","cn":"雇主高度重视实践经验。"},{"en":"place the burden on ...","zh":"把责任／负担加在……身上","ex":"The regulation places the burden on small firms.","cn":"这项法规将负担加在小企业身上。"},{"en":"point to evidence of ...","zh":"指向……的证据；表明……","ex":"The report points to evidence of systemic failure.","cn":"报告指出了制度性失败的证据。"},{"en":"pose as ...","zh":"假扮……；冒充……","ex":"The advertiser posed as an independent reviewer.","cn":"广告商冒充独立评审人员。"},{"en":"prevent A from doing B","zh":"阻止 A 做 B","ex":"The law prevents firms from selling children's data.","cn":"法律禁止企业出售儿童数据。"},{"en":"prioritize A over B","zh":"优先考虑 A 而非 B","ex":"The agency prioritized safety over cost savings.","cn":"该机构把安全置于节约成本之上。"},{"en":"proceed on the premise that ...","zh":"以……为前提继续推进","ex":"The model proceeds on the premise that demand is stable.","cn":"这一模型以需求稳定为前提。"},{"en":"provide a rationale for ...","zh":"为……提供理由","ex":"The evidence provides a rationale for further testing.","cn":"证据为进一步测试提供了依据。"},{"en":"provide an incentive to do ...","zh":"提供做……的激励","ex":"Lower taxes provide an incentive to invest.","cn":"减税为投资提供了激励。"},{"en":"put A down to B","zh":"将 A 归因于 B","ex":"Analysts put the decline in sales down to higher prices.","cn":"分析师将销售下降归因于价格上涨。"},{"en":"put forward an explanation","zh":"提出一种解释","ex":"The author put forward an explanation for the unusual pattern.","cn":"作者提出了对异常模式的一种解释。"},{"en":"question the premise of ...","zh":"质疑……所依据的前提","ex":"The critic questions the premise of the government's argument.","cn":"评论者质疑政府论证的前提。"},{"en":"read A as B","zh":"将 A 理解／解读为 B","ex":"The court read the sentence as a promise.","cn":"法院将这句话解释为一项承诺。"},{"en":"recast A as B","zh":"将 A 重新界定／描绘为 B","ex":"The company recast the setback as a learning opportunity.","cn":"公司将挫折重新解释为学习机会。"},{"en":"refrain from doing ...","zh":"克制而不做……；避免做……","ex":"The panel refrained from making a final recommendation.","cn":"专家组没有提出最终建议。"},{"en":"reject A in favor of B","zh":"放弃／否定 A 而选择 B","ex":"The committee rejected the old method in favor of a cheaper alternative.","cn":"委员会放弃旧方法，转而选择成本更低的替代方案。"},{"en":"rely on A to do B","zh":"依靠 A 去做 B","ex":"The service relies on volunteers to help local residents.","cn":"这项服务依靠志愿者帮助当地居民。"},{"en":"rest on an assumption","zh":"以某项假设为依据","ex":"The argument rests on an untested assumption.","cn":"这个论点建立在未经检验的假设之上。"},{"en":"run counter to ...","zh":"与……背道而驰","ex":"The proposal runs counter to the stated goal of equality.","cn":"这项提案与其宣称的平等目标相悖。"},{"en":"serve to demonstrate ...","zh":"起到证明……的作用","ex":"The case serves to demonstrate the need for clear rules.","cn":"此案说明了制定明确规则的必要性。"},{"en":"shed light on ...","zh":"阐明……；帮助理解……","ex":"The new data shed light on the causes of the decline.","cn":"新数据有助于阐明下降的原因。"},{"en":"shift the burden to ...","zh":"将负担转移给……","ex":"The policy shifts the burden to taxpayers.","cn":"这项政策将负担转嫁给纳税人。"},{"en":"single out ... for criticism","zh":"特别挑出……加以批评","ex":"The report singled out the operator for criticism.","cn":"报告特别批评了这家运营商。"},{"en":"speak out against ...","zh":"公开反对……","ex":"The researchers spoke out against the proposed cuts.","cn":"研究人员公开反对拟议中的削减措施。"},{"en":"stand in contrast to ...","zh":"与……形成对照","ex":"The latest figures stand in contrast to earlier predictions.","cn":"最新数字与早期预测形成鲜明对比。"},{"en":"stem the decline","zh":"遏制下降趋势","ex":"New investment may help stem the decline in employment.","cn":"新投资可能有助于遏制就业人数下降。"},{"en":"strip A of B","zh":"剥夺 A 的 B","ex":"The decision stripped the agency of its authority.","cn":"这一决定剥夺了该机构的职权。"},{"en":"substitute for ...","zh":"替代……","ex":"Temporary donations cannot substitute for stable funding.","cn":"临时捐款无法替代稳定的资金支持。"},{"en":"succeed in doing ...","zh":"成功做到……","ex":"The trial succeeded in reducing the risk of infection.","cn":"试验成功降低了感染风险。"},{"en":"succeed somebody as ...","zh":"接替某人担任……","ex":"She succeeded the former director as head of the institute.","cn":"她接替前任主任，担任研究所负责人。"},{"en":"take A as evidence of B","zh":"将 A 当作 B 的证据","ex":"Critics took the delay as evidence of poor planning.","cn":"批评者把延误视为规划不善的证据。"},{"en":"take A for granted","zh":"想当然地认为 A 理所当然","ex":"We should not take affordable public services for granted.","cn":"我们不应把价格可负担的公共服务视为理所当然。"},{"en":"take A to mean B","zh":"将 A 理解为 B","ex":"The court took the statement to mean that the contract was binding.","cn":"法院将该声明理解为合同具有约束力。"},{"en":"take steps to ...","zh":"采取措施以……","ex":"The firm took steps to improve safety.","cn":"公司采取措施改善安全。"},{"en":"take stock of ...","zh":"评估／审视……现状","ex":"The committee paused to take stock of its progress.","cn":"委员会暂停工作，评估迄今进展。"},{"en":"trace A back to B","zh":"将 A 追溯到 B","ex":"Researchers traced the problem back to a design error.","cn":"研究人员将问题追溯到一个设计错误。"},{"en":"treat A as B","zh":"把 A 当作 B 对待","ex":"The agency treated the complaint as a warning.","cn":"该机构将这起投诉视为警告。"},{"en":"turn A into B","zh":"将 A 变成 B","ex":"A small disagreement turned the meeting into a dispute.","cn":"小小的分歧使会议变成了一场争执。"},{"en":"underlie a phenomenon","zh":"构成某现象的根本原因／基础","ex":"Economic inequality may underlie the phenomenon.","cn":"经济不平等可能是这一现象的深层原因。"},{"en":"undermine an argument","zh":"削弱某一论点的说服力","ex":"The conflicting evidence undermines the argument.","cn":"相互矛盾的证据削弱了这一论点。"},{"en":"view A as B","zh":"将 A 看作 B","ex":"Many scholars view the reform as necessary.","cn":"许多学者认为改革是必要的。"},{"en":"warrant a conclusion","zh":"为某个结论提供充分依据","ex":"The evidence does not warrant such a strong conclusion.","cn":"这些证据不足以支持如此强烈的结论。"},{"en":"work toward ...","zh":"朝……努力","ex":"Both parties are working toward a compromise.","cn":"双方正努力达成妥协。"},{"en":"write A off as B","zh":"认为 A 不过是 B 而不予重视","ex":"The minister wrote the criticism off as political noise.","cn":"部长把这些批评当作政治噪声，不予理会。"},{"en":"account for a result","zh":"解释某项结果为何出现","ex":"The model cannot fully account for the result.","cn":"这一模型无法充分解释结果。"},{"en":"account for an increase","zh":"解释增长的原因","ex":"Greater demand may account for the increase in prices.","cn":"需求增加可能解释价格上涨。"},{"en":"admit to doing ...","zh":"承认做了……","ex":"The company admitted to sharing the data.","cn":"公司承认曾共享这些数据。"},{"en":"acknowledge a limitation","zh":"承认研究／方法的局限","ex":"The authors acknowledge a limitation of their study.","cn":"作者们承认研究存在一项局限。"},{"en":"act upon a recommendation","zh":"按照建议采取行动","ex":"The board acted upon the recommendation immediately.","cn":"董事会立即依照建议采取行动。"},{"en":"adapt A to B","zh":"使 A 适应 B","ex":"The company adapted its services to changing demand.","cn":"公司调整服务以适应变化中的需求。"},{"en":"address concerns over ...","zh":"回应对……的担忧","ex":"The government promised to address concerns over privacy.","cn":"政府承诺解决对隐私的担忧。"},{"en":"agree to a proposal","zh":"同意一项提案","ex":"The board agreed to the proposal after several revisions.","cn":"经过数次修改，董事会同意了提案。"},{"en":"allude to ...","zh":"暗指／间接提到……","ex":"The writer alludes to a dispute discussed earlier.","cn":"作者暗指前文讨论过的一场争端。"},{"en":"amount to a concession","zh":"实际上相当于作出让步","ex":"The compromise amounts to a significant concession.","cn":"这一妥协相当于作出了重大让步。"},{"en":"appeal against a ruling","zh":"对裁决提出上诉","ex":"The company appealed against the court's ruling.","cn":"公司对法院的裁决提起上诉。"},{"en":"appeal to authority","zh":"诉诸权威（论证方式）","ex":"The speaker appealed to authority instead of offering evidence.","cn":"演讲者诉诸权威，而没有提供证据。"},{"en":"appeal to evidence","zh":"援引证据作为依据","ex":"The argument appeals to evidence rather than tradition.","cn":"这一论证诉诸证据而非传统。"},{"en":"apply a rule to a case","zh":"把规则应用于具体情况","ex":"The judge applied the rule to the case.","cn":"法官将规定适用于此案。"},{"en":"attest to ...","zh":"证明……；证实……","ex":"The records attest to the industry's rapid growth.","cn":"这些记录证明了该行业的快速增长。"},{"en":"back a proposal","zh":"支持某项提议","ex":"Several experts backed the proposal.","cn":"几位专家支持这项提案。"},{"en":"back down from a claim","zh":"不再坚持某项主张","ex":"The company backed down from its original claim.","cn":"公司放弃了最初的主张。"},{"en":"back up an assertion","zh":"提供证据支持断言","ex":"The report failed to back up the assertion with data.","cn":"报告未能用数据支持这一断言。"},{"en":"bank on ...","zh":"寄希望于／指望……","ex":"The firm banked on rising demand but misjudged the market.","cn":"公司寄希望于需求上涨，却错误判断了市场。"},{"en":"base A on B","zh":"以 B 为基础建立 A","ex":"The report bases its conclusions on survey data.","cn":"报告根据调查数据得出结论。"},{"en":"be answerable to ...","zh":"向……负责","ex":"The board is answerable to its shareholders.","cn":"董事会对其股东负责。"},{"en":"be at stake","zh":"处于风险之中；事关重大","ex":"Public safety may be at stake.","cn":"公众安全可能面临危险。"},{"en":"be conditioned on ...","zh":"取决于……；以……为条件","ex":"Approval is conditioned on further testing.","cn":"批准以进一步测试为条件。"},{"en":"be disproportionate to ...","zh":"与……不成比例","ex":"The penalty is disproportionate to the offense.","cn":"这一处罚与违法行为的严重程度不成比例。"},{"en":"be hostile to ...","zh":"敌视／反对……","ex":"Some companies are hostile to tighter regulation.","cn":"有些公司敌视更严格的监管。"},{"en":"be integral to ...","zh":"是……不可或缺的一部分","ex":"Reliable evidence is integral to sound policy.","cn":"可靠证据是合理政策不可缺少的部分。"},{"en":"be predicated on ...","zh":"以……为前提或依据","ex":"The proposal is predicated on an assumption of steady growth.","cn":"这项提议建立在稳定增长的假设之上。"},{"en":"be resistant to change","zh":"抵制变革","ex":"The organization has been resistant to change.","cn":"该组织一直抵制变革。"},{"en":"be self-defeating","zh":"适得其反；自我挫败","ex":"Raising prices too sharply could be self-defeating.","cn":"价格涨得太猛可能适得其反。"},{"en":"be strikingly similar to ...","zh":"与……惊人地相似","ex":"The two accounts are strikingly similar to each other.","cn":"两份叙述惊人地相似。"},{"en":"boil down to ...","zh":"归根到底是……","ex":"The disagreement boils down to a question of fairness.","cn":"分歧归根结底是一个公平问题。"},{"en":"cast ... in a new light","zh":"从新角度审视……","ex":"The discovery cast the earlier findings in a new light.","cn":"这一发现让人以新的眼光看待早期结果。"},{"en":"characterize a policy as unfair","zh":"将某项政策描述为不公平","ex":"Critics characterized the policy as unfair.","cn":"批评者认为该政策不公平。"},{"en":"come under fire for ...","zh":"因……遭到批评","ex":"The agency came under fire for ignoring complaints.","cn":"该机构因无视投诉而遭到猛烈批评。"},{"en":"conflict with an earlier conclusion","zh":"与先前结论相冲突","ex":"The results conflict with an earlier conclusion.","cn":"这些结果与早先的结论相冲突。"},{"en":"constrain one's choices","zh":"限制某人的选择","ex":"Higher costs constrain consumers' choices.","cn":"高成本限制了消费者的选择。"},{"en":"contend that ...","zh":"主张／声称……（常有争议）","ex":"The economist contends that the reform may reduce inequality.","cn":"经济学家主张改革可能减少不平等。"},{"en":"convey an impression","zh":"传达一种印象","ex":"The advertisement conveys an impression of certainty.","cn":"广告给人一种确定无疑的印象。"},{"en":"cut across traditional divisions","zh":"跨越传统分界","ex":"The debate cuts across traditional political divisions.","cn":"这场辩论跨越了传统的政治分界线。"},{"en":"decline to comment","zh":"拒绝／婉拒发表评论","ex":"The company declined to comment on the investigation.","cn":"公司拒绝就调查发表评论。"},{"en":"defer a decision","zh":"推迟决定","ex":"The court deferred a decision until more evidence was available.","cn":"法院推迟决定，直到获得更多证据。"},{"en":"defer to expert judgment","zh":"尊重／听从专家判断","ex":"Officials should defer to expert judgment on technical matters.","cn":"对于技术问题，官员应尊重专家判断。"},{"en":"deliver a blow to ...","zh":"对……造成打击","ex":"The ruling delivered a blow to the company's plans.","cn":"这一裁决沉重打击了公司的计划。"},{"en":"demand an explanation","zh":"要求作出解释","ex":"Residents demanded an explanation for the increase.","cn":"居民要求解释涨价的原因。"},{"en":"demand patience","zh":"需要耐心（事物作主语）","ex":"The process demands patience and careful planning.","cn":"这一过程需要耐心和周密规划。"},{"en":"depart from established practice","zh":"偏离既定做法","ex":"The new procedure departs from established practice.","cn":"新程序偏离了既定做法。"},{"en":"depend upon a premise","zh":"依赖某个前提","ex":"The conclusion depends upon a questionable premise.","cn":"这一结论取决于一个值得怀疑的前提。"},{"en":"deprive A of B","zh":"剥夺 A 的 B","ex":"The restrictions deprived residents of access to the service.","cn":"这些限制使居民无法使用这项服务。"},{"en":"distort the findings","zh":"歪曲研究结果","ex":"Misleading headlines distorted the findings.","cn":"误导性的标题歪曲了研究发现。"},{"en":"draw attention away from ...","zh":"转移对……的注意","ex":"The controversy drew attention away from the main problem.","cn":"争议转移了人们对主要问题的注意力。"},{"en":"draw upon earlier research","zh":"借鉴早期研究","ex":"The paper draws upon earlier research on inequality.","cn":"这篇论文借鉴了早期关于不平等的研究。"},{"en":"enable A to do B","zh":"使 A 能够做 B","ex":"The grant enabled students to complete their studies.","cn":"这笔补助金使学生能够完成学业。"},{"en":"encounter resistance","zh":"遇到阻力","ex":"The reform encountered resistance from industry groups.","cn":"改革遭到了行业团体的抵制。"},{"en":"entail substantial costs","zh":"意味着／必然带来可观成本","ex":"The proposal could entail substantial costs.","cn":"这项提案可能涉及相当高的成本。"},{"en":"entertain doubts about ...","zh":"对……抱有疑虑","ex":"The committee entertained doubts about the figures.","cn":"委员会对这些数字心存疑虑。"},{"en":"exert influence on ...","zh":"对……施加影响","ex":"Large firms can exert influence on public policy.","cn":"大企业能够影响公共政策。"},{"en":"extend beyond ...","zh":"超出……范围","ex":"The implications extend beyond the transport industry.","cn":"这些影响超出了交通运输行业。"},{"en":"fail to distinguish A from B","zh":"未能区分 A 与 B","ex":"The article fails to distinguish criticism from outright rejection.","cn":"这篇文章未能区分批评与彻底否定。"},{"en":"figure prominently in ...","zh":"在……中占重要地位","ex":"Privacy concerns figure prominently in the debate.","cn":"隐私担忧在辩论中占据突出位置。"},{"en":"follow from the evidence","zh":"由证据推导出来","ex":"The conclusion does not follow from the evidence.","cn":"这一结论不能从证据中推导出来。"},{"en":"forgo a benefit","zh":"放弃某项利益","ex":"Some eligible households chose to forgo the benefit.","cn":"一些符合条件的家庭选择放弃这项福利。"},{"en":"furnish evidence of ...","zh":"提供……的证据","ex":"The records furnish evidence of earlier ownership.","cn":"这些记录提供了早期所有权的证据。"},{"en":"hold true for ...","zh":"对……成立或适用","ex":"The finding may not hold true for younger participants.","cn":"这一发现对年轻参与者可能并不成立。"},{"en":"invoke a principle","zh":"援引某项原则","ex":"The judge invoked a principle of equal treatment.","cn":"法官援引了平等对待原则。"},{"en":"invoke an exception","zh":"援引例外条款","ex":"The firm invoked an exception to the rule.","cn":"该公司援引了规定中的一项例外。"},{"en":"lay bare a contradiction","zh":"揭示矛盾","ex":"The results lay bare a contradiction in the official account.","cn":"这些结果揭示了官方叙述中的一处矛盾。"},{"en":"lend itself to ...","zh":"适合用于……；容易产生……","ex":"The method lends itself to large-scale studies.","cn":"这种方法适用于大规模研究。"},{"en":"make a distinction between A and B","zh":"区分 A 和 B","ex":"The law makes a distinction between ownership and control.","cn":"法律区分了所有权与控制权。"},{"en":"make provision for ...","zh":"为……作出安排或准备","ex":"The budget makes provision for unexpected repairs.","cn":"预算为意外维修预留了资金。"},{"en":"mislead A into believing B","zh":"误导 A 相信 B","ex":"The advertisement misled consumers into believing the product was risk-free.","cn":"这则广告误导消费者，使他们以为产品没有风险。"},{"en":"object to the proposal","zh":"反对这一提案","ex":"Several members objected to the proposal.","cn":"几位成员反对这项提案。"},{"en":"overstate the benefits","zh":"夸大好处","ex":"The report may overstate the benefits of the intervention.","cn":"报告可能夸大了干预措施的益处。"},{"en":"play down the risks","zh":"淡化风险","ex":"Officials tried to play down the risks.","cn":"官员试图淡化风险。"},{"en":"preclude the possibility of ...","zh":"排除……的可能性","ex":"The result does not preclude the possibility of other causes.","cn":"这一结果并未排除其他原因的可能性。"},{"en":"provide grounds for ...","zh":"为……提供依据","ex":"The evidence provides grounds for further investigation.","cn":"证据为进一步调查提供了理由。"},{"en":"put a strain on ...","zh":"给……造成压力","ex":"Rising costs put a strain on family budgets.","cn":"成本上涨给家庭预算造成了压力。"},{"en":"reconcile A with B","zh":"调和 A 与 B 之间的矛盾","ex":"The researcher tried to reconcile the findings with the original theory.","cn":"研究人员试图使这些发现与原先的理论相一致。"},{"en":"reconsider an assumption","zh":"重新考虑某个假设","ex":"The team reconsidered an assumption after the trial.","cn":"团队在试验后重新审视了一个假设。"},{"en":"redefine a concept","zh":"重新界定概念","ex":"The paper seeks to redefine the concept of fairness.","cn":"论文试图重新定义公平这一概念。"},{"en":"refer A to B","zh":"将 A 交由 B 处理／转介","ex":"The regulator referred the case to the court.","cn":"监管机构将案件移交法院。"},{"en":"refer to the findings","zh":"提及／引用研究结果","ex":"The author referred to the findings in her conclusion.","cn":"作者在结论中提到了这些发现。"},{"en":"reinforce a stereotype","zh":"强化刻板印象","ex":"The portrayal reinforced a stereotype about older workers.","cn":"这种描述强化了对年长工人的刻板印象。"},{"en":"relieve A of B","zh":"减轻／免除 A 的 B（责任、负担）","ex":"The board relieved the manager of her duties.","cn":"董事会解除了经理的职务。"},{"en":"resist the temptation to ...","zh":"克制……的冲动","ex":"Analysts should resist the temptation to overinterpret the data.","cn":"分析师应该抵制过度解读数据的诱惑。"},{"en":"resolve an ambiguity","zh":"消除歧义","ex":"The court clarified the wording to resolve an ambiguity.","cn":"法院澄清了措辞，以消除歧义。"},{"en":"retain its significance","zh":"仍然具有重要意义","ex":"The early discovery retains its significance today.","cn":"这一早期发现至今仍有重要意义。"},{"en":"reverse the burden of proof","zh":"颠倒举证责任","ex":"The law may reverse the burden of proof in specific cases.","cn":"法律可能在特定案件中倒置举证责任。"},{"en":"screen out applicants","zh":"筛除申请者","ex":"The process screens out applicants who lack the required skills.","cn":"这一程序筛除了不具备所需技能的申请者。"},{"en":"set a precedent","zh":"开创先例","ex":"The ruling set a precedent for later disputes.","cn":"这一裁决为后来的争议树立了先例。"},{"en":"side with ...","zh":"支持……一方","ex":"The judge sided with the workers.","cn":"法官支持工人一方。"},{"en":"single out a factor","zh":"单独挑出某个因素","ex":"The report singled out poor planning as a factor.","cn":"报告特别指出规划不善是一个因素。"},{"en":"spell out the consequences","zh":"明确说明后果","ex":"The statement spells out the consequences of noncompliance.","cn":"声明明确阐述了不遵守规定的后果。"},{"en":"sponsor a study","zh":"资助一项研究","ex":"The foundation sponsored a study on public health.","cn":"该基金会资助了一项公共卫生研究。"},{"en":"strike a balance between A and B","zh":"在 A 与 B 之间求得平衡","ex":"The law seeks to strike a balance between privacy and innovation.","cn":"法律力求在隐私与创新之间取得平衡。"},{"en":"take exception to the wording","zh":"对措辞提出异议","ex":"The editor took exception to the wording of the claim.","cn":"编辑对这一说法的措辞提出异议。"},{"en":"take note of ...","zh":"注意到……","ex":"The committee took note of the new evidence.","cn":"委员会注意到了新证据。"},{"en":"temper expectations","zh":"调低预期；使期望更审慎","ex":"The early results should temper expectations.","cn":"初步结果应当让人们保持适度的预期。"},{"en":"throw doubt on ...","zh":"使……受到怀疑","ex":"The discrepancy throws doubt on the accuracy of the estimate.","cn":"这一差异使估计值的准确性受到怀疑。"},{"en":"translate into higher costs","zh":"转化为更高成本","ex":"Delays can translate into higher costs for consumers.","cn":"延误可能转化为消费者需要承担的更高成本。"},{"en":"treat the claim with caution","zh":"谨慎对待该说法","ex":"The findings suggest we should treat the claim with caution.","cn":"这些发现表明，我们应谨慎看待这一说法。"},{"en":"underscore a distinction","zh":"强调某一区别","ex":"The example underscores a distinction between access and ownership.","cn":"这个例子突出了使用权与所有权的区别。"},{"en":"understate the problem","zh":"低估问题严重性","ex":"The official figures may understate the problem.","cn":"官方数字可能低估了问题的严重程度。"},{"en":"withstand scrutiny","zh":"经得起审查","ex":"The explanation failed to withstand scrutiny.","cn":"这一解释经不起严格审查。"},{"en":"not everyone ...","zh":"并非每个人都……","ex":"Not everyone agrees that the policy will work.","cn":"并非所有人都同意这项政策会奏效。"},{"en":"not every ...","zh":"并非每一个……都……","ex":"Not every household benefited from the change.","cn":"并非每个家庭都从这种变化中受益。"},{"en":"not all A are B","zh":"并非所有 A 都是 B","ex":"Not all workers are opposed to the reform.","cn":"并非所有工人都反对改革。"},{"en":"not a single ...","zh":"一个……也没有","ex":"Not a single participant reported a serious side effect.","cn":"没有一名参与者报告严重副作用。"},{"en":"not without reason","zh":"并非毫无理由","ex":"Critics question the policy, and not without reason.","cn":"批评者质疑这项政策，而且并非没有理由。"},{"en":"not without difficulty","zh":"并非没有困难","ex":"The team completed the task, but not without difficulty.","cn":"团队完成了任务，但过程并不轻松。"},{"en":"not much of a ...","zh":"算不上多么……的……","ex":"The report offered not much of an explanation.","cn":"报告几乎没有给出解释。"},{"en":"no better than ...","zh":"与……一样糟；无异于……","ex":"The new method was no better than the old one.","cn":"新方法并不比旧方法更好。"},{"en":"no different from ...","zh":"与……没有区别","ex":"The new proposal is no different from the previous version.","cn":"新提案与上一版本没有区别。"},{"en":"nothing less than ...","zh":"简直是……；不亚于……","ex":"The announcement was nothing less than a political reversal.","cn":"这一公告无异于一次政治立场的大转变。"},{"en":"nothing more than ...","zh":"不过是……；仅仅……","ex":"The plan is nothing more than a temporary measure.","cn":"这项计划不过是一项临时措施。"},{"en":"but for ...","zh":"要不是……；如果没有……","ex":"But for the volunteers, the library would have closed.","cn":"如果没有志愿者，图书馆就会关闭。"},{"en":"only to discover that ...","zh":"结果却发现……（常出乎预料）","ex":"Researchers repeated the experiment, only to discover that the effect had vanished.","cn":"研究人员重复实验，却发现原来的效果已经消失。"},{"en":"only then did ...","zh":"直到那时才……（倒装）","ex":"Only then did the committee recognize the error.","cn":"直到那时，委员会才认识到错误。"},{"en":"assuming that ...","zh":"假设……；如果……","ex":"Assuming that demand remains steady, costs will decline.","cn":"假设需求保持稳定，成本就会下降。"},{"en":"supposing that ...","zh":"假使……；如果……","ex":"Supposing that the figures are accurate, the conclusion seems reasonable.","cn":"假设这些数字准确，那么结论似乎合理。"},{"en":"unless otherwise stated","zh":"除非另有说明","ex":"Unless otherwise stated, all figures refer to the same year.","cn":"除非另有说明，所有数字均指同一年。"},{"en":"otherwise ...","zh":"否则……；在其他情况下……","ex":"The contract must be signed today; otherwise the offer expires.","cn":"合同必须今天签署，否则报价就会失效。"},{"en":"in the event of ...","zh":"如果发生……","ex":"In the event of an emergency, the building will be evacuated.","cn":"如遇紧急情况，大楼内人员将被疏散。"},{"en":"to the extent possible","zh":"尽可能地","ex":"The data will be anonymized to the extent possible.","cn":"数据会在可能的范围内尽量匿名化。"},{"en":"with all due respect","zh":"恕我直言（常用于礼貌反驳）","ex":"With all due respect, the evidence does not support your conclusion.","cn":"恕我直言，证据并不支持你的结论。"},{"en":"rather than do A","zh":"而不是做 A","ex":"The company chose to cut waste rather than raise prices.","cn":"公司选择减少浪费，而不是提高价格。"},{"en":"instead of doing A","zh":"不做 A 而做别的；代替做 A","ex":"Instead of raising prices, the company improved efficiency.","cn":"公司没有涨价，而是提高了效率。"},{"en":"as opposed to ...","zh":"与……相对；而不是……","ex":"The study examines actual behavior as opposed to stated intentions.","cn":"这项研究考察实际行为，而不是人们口头表达的意愿。"},{"en":"as distinct from ...","zh":"与……不同；区别于……","ex":"The measure concerns ownership as distinct from management.","cn":"这一措施涉及的是所有权，而不是管理权。"},{"en":"in contrast with ...","zh":"与……相比形成对照","ex":"In contrast with the earlier findings, these results show growth.","cn":"与早先的发现相反，这些结果显示增长。"},{"en":"conversely ...","zh":"反过来说……","ex":"Greater trust may boost cooperation; conversely, distrust may undermine it.","cn":"信任增强可能促进合作；反之，不信任可能破坏合作。"},{"en":"nevertheless ...","zh":"尽管如此；然而……","ex":"The evidence is limited; nevertheless, further study is worthwhile.","cn":"证据有限；不过，进一步研究仍有价值。"},{"en":"nonetheless ...","zh":"尽管如此……","ex":"The project was expensive; nonetheless, it was completed.","cn":"该项目成本高昂，但最终还是完成了。"},{"en":"while it is true that ...","zh":"虽然……确实如此","ex":"While it is true that costs fell, the policy may not be the cause.","cn":"成本确实下降了，但原因未必是这项政策。"},{"en":"admittedly ...","zh":"诚然……；不可否认……","ex":"Admittedly, the sample was small, but the results are consistent.","cn":"诚然，样本量较小，但结果具有一致性。"},{"en":"granted that ...","zh":"即使承认……；鉴于……","ex":"Granted that the rule has drawbacks, it may still be necessary.","cn":"即使承认这项规定有缺陷，它仍可能是必要的。"},{"en":"that said ...","zh":"话虽如此……","ex":"The reform has benefits; that said, its costs are substantial.","cn":"改革确实有好处；话虽如此，其成本也相当高。"},{"en":"be that as it may","zh":"即便如此；尽管如此","ex":"Be that as it may, the committee must make a decision.","cn":"不管怎样，委员会都必须作出决定。"},{"en":"even so ...","zh":"即使这样……","ex":"The evidence is incomplete; even so, action may be justified.","cn":"证据尚不完整；即便如此，采取行动也可能是合理的。"},{"en":"for all that ...","zh":"尽管如此……","ex":"The system has weaknesses; for all that, it still functions.","cn":"该系统有缺陷，但它仍能运行。"},{"en":"regardless of whether ...","zh":"无论是否……","ex":"The rule applies regardless of whether the company makes a profit.","cn":"无论公司是否盈利，这项规定都适用。"},{"en":"at best ...","zh":"充其量……","ex":"At best, the measure offers temporary relief.","cn":"往好处说，这项措施也只能暂时缓解问题。"},{"en":"at worst ...","zh":"最坏情况下……","ex":"At worst, the cut could force schools to close.","cn":"最糟糕的情况下，削减可能迫使学校关闭。"},{"en":"at most ...","zh":"至多……","ex":"At most, the review will take another week.","cn":"这次审查最多还需要一周。"},{"en":"at least ...","zh":"至少……；起码……","ex":"At least two studies support the conclusion.","cn":"至少有两项研究支持这一结论。"},{"en":"in part ...","zh":"部分地；在一定程度上","ex":"The rise in prices was driven in part by energy costs.","cn":"价格上涨部分是由能源成本推动的。"},{"en":"in most cases","zh":"在大多数情况下","ex":"In most cases, patients recovered within a week.","cn":"在大多数情况下，患者一周内便康复了。"},{"en":"in a minority of cases","zh":"在少数情况下","ex":"In a minority of cases, the treatment caused mild discomfort.","cn":"在少数情况下，治疗引起了轻微不适。"},{"en":"not so much because A as because B","zh":"与其说因为 A，不如说因为 B","ex":"The reform failed not so much because it was costly as because it lacked support.","cn":"改革失败与其说是因为成本高，不如说是因为缺乏支持。"},{"en":"less because A than because B","zh":"与其说因为 A，不如说主要因为 B","ex":"Demand fell less because of price increases than because of uncertainty.","cn":"需求下降与其说是因为涨价，不如说是因为不确定性。"},{"en":"be more A than B","zh":"与其说是 B，不如说更像 A","ex":"The disagreement was more political than technical.","cn":"这场分歧与其说是技术问题，不如说是政治问题。"},{"en":"be less A than B","zh":"与其说是 A，不如说更像 B","ex":"The obstacle was less financial than institutional.","cn":"障碍主要是制度性的，而不是财务性的。"},{"en":"more likely to A than to B","zh":"更可能 A，而非 B","ex":"Small firms are more likely to borrow than to issue shares.","cn":"小企业更可能通过借款而不是发行股票融资。"},{"en":"evidence is insufficient to conclude ...","zh":"证据不足以得出……结论","ex":"The evidence is insufficient to conclude that the policy caused the decline.","cn":"证据不足以得出该政策造成下降的结论。"},{"en":"cannot be taken as proof of ...","zh":"不能当作……的证明","ex":"A single survey cannot be taken as proof of widespread support.","cn":"单凭一项调查不能证明存在广泛支持。"},{"en":"does not amount to ...","zh":"并不等同于……；尚不构成……","ex":"Rejecting this proposal does not amount to opposing reform.","cn":"拒绝这个提案并不等于反对改革。"},{"en":"does not necessarily imply ...","zh":"并不必然意味着……","ex":"A rise in costs does not necessarily imply lower productivity.","cn":"成本上升不一定意味着生产率下降。"},{"en":"does not in itself establish ...","zh":"其本身不足以证实……","ex":"An increase in complaints does not in itself establish a decline in quality.","cn":"投诉增加本身并不能证明质量下降。"},{"en":"is not to be confused with ...","zh":"不应与……混淆","ex":"A company's revenue is not to be confused with its profit.","cn":"不应把公司的收入与利润混为一谈。"},{"en":"is not synonymous with ...","zh":"并不等同于……","ex":"Economic growth is not synonymous with greater well-being.","cn":"经济增长并不等于人民福祉提高。"},{"en":"is not tantamount to ...","zh":"并不等同于……","ex":"Failure to object is not tantamount to agreement.","cn":"没有提出异议不等于同意。"},{"en":"is not an endorsement of ...","zh":"并非对……的支持","ex":"The committee's silence is not an endorsement of the plan.","cn":"委员会保持沉默，并不等于认可该计划。"},{"en":"is not an argument against ...","zh":"并非反对……的理由","ex":"A temporary setback is not an argument against further research.","cn":"暂时的挫折并不能成为反对进一步研究的理由。"},{"en":"neither confirms nor denies ...","zh":"既不证实也不否认……","ex":"The report neither confirms nor denies the allegation.","cn":"报告既没有证实也没有否认这一指控。"},{"en":"not until ... did ...","zh":"直到……才……（倒装）","ex":"Not until the results were published did the problem become clear.","cn":"直到结果公布，问题才变得清楚。"},{"en":"hardly ... when ...","zh":"刚……就……；几乎才……便……","ex":"Hardly had the trial begun when new evidence emerged.","cn":"试验刚开始，新证据就出现了。"},{"en":"scarcely ... when ...","zh":"刚……就……","ex":"Scarcely had the meeting started when the vote was postponed.","cn":"会议刚开始，投票就被推迟了。"},{"en":"no sooner ... than ...","zh":"一……就……","ex":"No sooner had the rule taken effect than complaints began.","cn":"规定刚一生效，投诉就开始出现。"},{"en":"had it not been for ...","zh":"要不是……（虚拟条件）","ex":"Had it not been for the volunteers, the library would have closed.","cn":"如果没有志愿者，图书馆就会关闭。"},{"en":"were it not for ...","zh":"如果不是……（虚拟条件）","ex":"Were it not for public funding, the program would fail.","cn":"如果没有公共资金支持，这个项目就会失败。"},{"en":"should ... happen","zh":"万一发生……（虚拟倒装条件）","ex":"Should a problem arise, the team will respond immediately.","cn":"如果出现问题，团队会立即回应。"},{"en":"be it A or B","zh":"无论是 A 还是 B","ex":"Every proposal, be it public or private, needs evidence.","cn":"每项提案，无论来自公共部门还是私人部门，都需要证据支持。"},{"en":"if anything ...","zh":"要说有什么不同的话；反而……","ex":"If anything, the new result strengthens the conclusion.","cn":"如果说有什么影响的话，新结果反而加强了结论。"},{"en":"if at all ...","zh":"即使有也很少；如果有的话","ex":"Prices may fall only slightly, if at all.","cn":"价格即使下降，降幅也可能很小。"},{"en":"if anything, the reverse","zh":"恰恰可能相反","ex":"Some expect an increase; if anything, the reverse may occur.","cn":"有些人预计会增长；但如果真有变化，情况反而可能相反。"},{"en":"not to be overlooked","zh":"不容忽视","ex":"The cost of maintenance is not to be overlooked.","cn":"维护成本不容忽视。"},{"en":"without necessarily ...","zh":"不一定会……","ex":"Costs may fall without necessarily improving service quality.","cn":"成本可能下降，但服务质量未必改善。"},{"en":"not merely A, but B","zh":"不仅仅是 A，更是 B","ex":"This is not merely a financial issue, but a question of fairness.","cn":"这不仅仅是财务问题，也是公平问题。"},{"en":"not until recently","zh":"直到最近才……","ex":"The effect was not recognized until recently.","cn":"这种影响直到最近才被人们认识到。"},{"en":"the public's criticism of the policy","zh":"公众对该政策的批评","ex":"The article examines the public's criticism of the policy.","cn":"文章探讨了公众对该政策的批评。"},{"en":"the policy's impact on the public","zh":"该政策对公众的影响","ex":"The article examines the policy's impact on the public.","cn":"文章探讨了政策对公众的影响。"},{"en":"the regulator's objection to the merger","zh":"监管机构对该合并案的反对","ex":"The article examines the regulator's objection to the merger.","cn":"文章探讨了监管机构对合并的反对。"},{"en":"the company's objection to regulation","zh":"该公司对监管的反对","ex":"The discussion focused on the company's objection to regulation.","cn":"讨论重点是公司对监管的反对。"},{"en":"the author's objection to the claim","zh":"作者对这一说法的异议","ex":"The article examines the author's objection to the claim.","cn":"文章探讨了作者对这一说法的异议。"},{"en":"the claim's implications for consumers","zh":"这一说法对消费者意味着什么","ex":"The report discusses the claim's implications for consumers.","cn":"报告讨论了这种说法对消费者的影响。"},{"en":"the government's concern for consumers","zh":"政府对消费者的关切","ex":"The discussion focused on the government's concern for consumers.","cn":"讨论重点是政府对消费者的关切。"},{"en":"consumers' concerns about the government","zh":"消费者对政府的担忧","ex":"The debate highlighted consumers' concerns about the government.","cn":"辩论凸显了消费者对政府的担忧。"},{"en":"the agency's protection of consumers","zh":"该机构对消费者的保护","ex":"The discussion focused on the agency's protection of consumers.","cn":"讨论重点是该机构对消费者的保护。"},{"en":"consumers' protection from exploitation","zh":"消费者免受剥削的保护","ex":"The debate highlighted consumers' protection from exploitation.","cn":"辩论强调了消费者受到保护、免遭剥削的情况。"},{"en":"the employers' demands on workers","zh":"雇主对劳动者提出的要求","ex":"The discussion focused on the employers' demands on workers.","cn":"讨论重点是雇主对工人的要求。"},{"en":"the workers' demands on employers","zh":"劳动者向雇主提出的要求","ex":"The discussion focused on the workers' demands on employers.","cn":"讨论重点是工人对雇主的要求。"},{"en":"the union's support for the workers","zh":"工会对劳动者的支持","ex":"The article examines the union's support for the workers.","cn":"文章探讨了工会对工人的支持。"},{"en":"the workers' support for the union","zh":"劳动者对工会的支持","ex":"The article examines the workers' support for the union.","cn":"文章探讨了工人对工会的支持。"},{"en":"the researchers' criticism of the media","zh":"研究人员对媒体的批评","ex":"The article examines the researchers' criticism of the media.","cn":"文章探讨了研究人员对媒体的批评。"},{"en":"the media's criticism of the researchers","zh":"媒体对研究人员的批评","ex":"The article examines the media's criticism of the researchers.","cn":"文章探讨了媒体对研究人员的批评。"},{"en":"the experts' doubts about the evidence","zh":"专家对证据的怀疑","ex":"The article examines the experts' doubts about the evidence.","cn":"文章探讨了专家对证据的怀疑。"},{"en":"the public's doubts about the experts","zh":"公众对专家的怀疑","ex":"The article examines the public's doubts about the experts.","cn":"文章探讨了公众对专家的怀疑。"},{"en":"the author's depiction of the debate","zh":"作者对这场争论的描绘","ex":"The article examines the author's depiction of the debate.","cn":"文章探讨了作者对这场辩论的描述。"},{"en":"the debate's influence on the author","zh":"这场争论对作者的影响","ex":"The article examines the debate's influence on the author.","cn":"文章探讨了这场辩论对作者的影响。"},{"en":"the court's rejection of the appeal","zh":"法院驳回上诉","ex":"The article examines the court's rejection of the appeal.","cn":"文章探讨了法院对上诉的驳回。"},{"en":"the appeal against the court's decision","zh":"针对法院裁决提出的上诉","ex":"The article examines the appeal against the court's decision.","cn":"文章探讨了针对法院裁决的上诉。"},{"en":"the company's defense of its decision","zh":"公司为自身决定所作的辩护","ex":"The discussion focused on the company's defense of its decision.","cn":"讨论重点是公司为其决定所作的辩护。"},{"en":"the defense's criticism of the evidence","zh":"辩方对证据提出的质疑","ex":"The article examines the defense's criticism of the evidence.","cn":"文章探讨了辩护方对证据的批评。"},{"en":"the government's response to criticism","zh":"政府对批评的回应","ex":"The discussion focused on the government's response to criticism.","cn":"讨论重点是政府对批评的回应。"},{"en":"criticism triggered by the government's policy","zh":"政府政策引发的批评","ex":"The report discusses criticism triggered by the government's policy.","cn":"报告讨论了政府政策引发的批评。"},{"en":"the report's attribution of blame to officials","zh":"报告将责任归咎于官员","ex":"The discussion focused on the report's attribution of blame to officials.","cn":"讨论重点是报告将责任归于官员的做法。"},{"en":"the officials' attribution of blame to the media","zh":"官员将责任归咎于媒体","ex":"The article examines the officials' attribution of blame to the media.","cn":"文章探讨了官员将责任归于媒体的做法。"},{"en":"criticism directed at regulators","zh":"针对监管机构的批评","ex":"The report discusses criticism directed at regulators.","cn":"报告讨论了针对监管机构的批评。"},{"en":"criticism directed by regulators at firms","zh":"监管机构针对企业提出的批评","ex":"Criticism directed by regulators at firms intensified after the scandal.","cn":"监管机构对企业提出的批评在丑闻后愈发激烈。"},{"en":"proposals submitted to regulators by firms","zh":"企业向监管机构提交的提案","ex":"The discussion focused on proposals submitted to regulators by firms.","cn":"讨论重点是企业提交给监管机构的提案。"},{"en":"regulations imposed on firms by agencies","zh":"机构对企业施加的监管规定","ex":"The discussion focused on regulations imposed on firms by agencies.","cn":"讨论重点是机构对企业施加的监管规定。"},{"en":"decisions influenced by public opinion","zh":"受到公众舆论影响的决定","ex":"The discussion focused on decisions influenced by public opinion.","cn":"讨论重点是受到公众舆论影响的决定。"},{"en":"public opinion influenced by government decisions","zh":"受到政府决定影响的公众舆论","ex":"The discussion focused on public opinion influenced by government decisions.","cn":"讨论重点是受到政府决定影响的公众舆论。"},{"en":"evidence cited by the opponents","zh":"反对者引用的证据","ex":"The report discusses evidence cited by the opponents.","cn":"报告讨论了反对者援引的证据。"},{"en":"evidence against the proposal","zh":"不利于该提案的证据","ex":"The report discusses evidence against the proposal.","cn":"报告讨论了反对这项提案的证据。"},{"en":"evidence for the proposal","zh":"支持该提案的证据","ex":"The report discusses evidence for the proposal.","cn":"报告讨论了支持这项提案的证据。"},{"en":"the committee's doubts about reform","zh":"委员会对改革的疑虑","ex":"The discussion focused on the committee's doubts about reform.","cn":"讨论重点是委员会对改革的疑虑。"},{"en":"the reform committee's doubts","zh":"改革委员会自身的疑虑","ex":"The discussion focused on the refor  if(!state.sessions[k]||!Array.isArray(state.sessions[k].order))state.sessions[k]=newSession(k);
 const s=state.sessions[k];ensureHistory(s);return s;
}
function restoreHistory(s,index){
 const item=s.history[index];if(!item)return false;
 s.historyIndex=index;s.group=[...item.group];s.round=item.round;s.groupNo=item.groupNo;s.completed=item.completed;
 persist();return true;
}
function rememberCurrentGroup(s){
 if(!s.group.length)return;
 // 只有在最新组向前推进时才生成新组；回看组使用历史快照而不是重新抽词。
 s.history.push(groupSnapshot(s));s.historyIndex=s.history.length-1;persist();
}
function syncCollection(k){if(k!=='favorites'&&k!=='easy')return;const s=state.sessions[k];if(!s)return;const ids=buildOrder(k),old=s.order.filter(Number.isInteger);if(ids.length!==old.length||ids.some((id,i)=>id!==old[i]))state.sessions[k]=newSession(k);}
function pullGroup(k,advance=true){let s=session(k);if(!advance&&s.group&&s.group.length)return s.group;
 if(advance&&s.group&&s.group.length)s.completed+=s.group.length;
 s.group=[];
 const valid=()=>s.order.some(id=>eligible(k,id));
 if(!valid()){s.cursor=0;persist();return[];}
 if(s.cursor>=s.order.length){s.round++;s.groupNo=0;s.completed=0;s.order=buildOrder(k);s.cursor=0;}
 while(s.cursor<s.order.length && s.group.length<7){const id=s.order[s.cursor++];if(eligible(k,id))s.group.push(id);}
 if(!s.group.length && valid()){
  s.round++;s.groupNo=0;s.completed=0;s.order=buildOrder(k);s.cursor=0;
  while(s.cursor<s.order.length&&s.group.length<7){const id=s.order[s.cursor++];if(eligible(k,id))s.group.push(id);}
 }
 if(s.group.length)s.groupNo++;

}
