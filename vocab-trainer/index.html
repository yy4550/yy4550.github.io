overseeing the program.","cn":"委员会负责监督这个项目。"},{"en":"be held responsible for ...","zh":"被追究……责任","ex":"The operator was held responsible for the accident.","cn":"运营商被认定应对事故负责。"},{"en":"be subject to change","zh":"可能发生变动","ex":"The policy may be subject to change.","cn":"该政策可能发生变化。"},{"en":"be subject to approval","zh":"须经批准","ex":"The policy may be subject to approval.","cn":"该政策可能需要获得批准。"},{"en":"be expected to do ...","zh":"被期待；预计会……","ex":"The committee is expected to announce a decision tomorrow.","cn":"预计委员会将于明天公布决定。"},{"en":"be required to do ...","zh":"被要求必须做……","ex":"Companies are required to disclose safety risks.","cn":"企业必须披露安全风险。"},{"en":"be permitted to do ...","zh":"被允许做……","ex":"Employees are permitted to work from home.","cn":"员工获准在家办公。"},{"en":"be prohibited from doing ...","zh":"被禁止做……","ex":"Firms are prohibited from selling children's data.","cn":"企业不得出售儿童数据。"},{"en":"be accused of ...","zh":"被指控……","ex":"The company was accused of hiding information.","cn":"该公司被指控隐瞒信息。"},{"en":"be condemned for ...","zh":"因……受到谴责","ex":"Officials were condemned for ignoring safety warnings.","cn":"官员因无视安全警告而受到谴责。"},{"en":"be praised for ...","zh":"因……受到称赞","ex":"Volunteers were praised for helping local families.","cn":"志愿者因帮助当地家庭而受到表扬。"},{"en":"be criticized for ...","zh":"因……受到批评","ex":"The ministry was criticized for delaying the report.","cn":"该部因推迟发布报告而受到批评。"},{"en":"be criticized by ...","zh":"受到……的批评","ex":"The proposal was criticized by several researchers.","cn":"这项提案受到了几名研究人员的批评。"},{"en":"be characterized by ...","zh":"以……为特征","ex":"The period was characterized by rapid technological change.","cn":"这一时期的特点是技术迅速变化。"},{"en":"be defined as ...","zh":"被定义为……","ex":"A small firm is defined as a company below a certain size.","cn":"小企业被定义为规模低于一定标准的公司。"},{"en":"be regarded as ...","zh":"被视为……","ex":"The finding is regarded as an important breakthrough.","cn":"这一发现被认为是一项重要突破。"},{"en":"be taken as ...","zh":"被认为是……","ex":"The reply was taken as a sign of approval.","cn":"这一答复被视为同意的信号。"},{"en":"be interpreted as ...","zh":"被解释为……","ex":"Silence should not be interpreted as agreement.","cn":"沉默不应被解释为同意。"},{"en":"be perceived as ...","zh":"被看作……","ex":"The policy was perceived as unfair by many workers.","cn":"许多工人认为该政策不公平。"},{"en":"be presented as ...","zh":"被呈现为……","ex":"The reform was presented as a solution to high prices.","cn":"改革被描述为解决高物价的方案。"},{"en":"be portrayed as ...","zh":"被描绘成……","ex":"The minister was portrayed as an opponent of change.","cn":"部长被描述成反对变革的人。"},{"en":"be framed as ...","zh":"被表述、界定成……","ex":"The decision was framed as a matter of national security.","cn":"这一决定被界定为国家安全问题。"},{"en":"be classified as ...","zh":"被归类为……","ex":"The firm is classified as a small business under the law.","cn":"按照法律，该公司被归类为小企业。"},{"en":"be treated as ...","zh":"被当作……","ex":"The complaint should be treated as serious evidence.","cn":"应将这起投诉视为重要证据。"},{"en":"be mistaken about ...","zh":"对……存在误解","ex":"The committee was mistaken about the likely costs.","cn":"委员会对可能产生的成本判断错误。"},{"en":"be responsible to ...","zh":"向……负责","ex":"The regulator is responsible to parliament.","cn":"监管机构对议会负责。"},{"en":"give way to ...","zh":"让位于……；被……取代","ex":"Strict rules eventually gave way to a more flexible approach.","cn":"严格的规定最终让位于更加灵活的办法。"},{"en":"make way for ...","zh":"为……让路","ex":"The old buildings were removed to make way for a new hospital.","cn":"旧建筑被拆除，以便为新医院腾出空间。"},{"en":"pave the way for ...","zh":"为……铺平道路","ex":"The agreement paved the way for further cooperation.","cn":"协议为进一步合作铺平了道路。"},{"en":"set the stage for ...","zh":"为……创造条件","ex":"The discovery set the stage for later research.","cn":"这一发现为后续研究创造了条件。"},{"en":"take precedence over ...","zh":"优先于……","ex":"Public safety must take precedence over short-term profits.","cn":"公众安全必须优先于短期利润。"},{"en":"have priority over ...","zh":"比……优先","ex":"Urgent cases have priority over routine requests.","cn":"紧急案件的优先级高于常规请求。"},{"en":"play a part in ...","zh":"在……中发挥作用","ex":"Advertising may play a part in shaping consumer choices.","cn":"广告可能在塑造消费者选择方面发挥作用。"},{"en":"play down a problem","zh":"淡化问题","ex":"Officials tried to play down the problem.","cn":"官员试图淡化问题的严重性。"},{"en":"play up a danger","zh":"夸大、强调危险","ex":"Some commentators played up the danger of the proposal.","cn":"一些评论员夸大了该提案的危险。"},{"en":"bear responsibility for ...","zh":"对……承担责任","ex":"The operator must bear responsibility for the damage.","cn":"运营商必须对损害承担责任。"},{"en":"shoulder the burden of ...","zh":"承担……的负担","ex":"Families should not shoulder the burden of rising costs alone.","cn":"家庭不应独自承担成本上涨的负担。"},{"en":"shoulder the blame","zh":"承担过错责任","ex":"The minister was unwilling to shoulder the blame.","cn":"部长不愿承担责任。"},{"en":"place blame on ...","zh":"将责任归咎于……","ex":"Critics placed blame on the regulator for the failure.","cn":"批评者将失败归咎于监管机构。"},{"en":"hold A accountable for B","zh":"要求 A 为 B 负责","ex":"The court held the firm accountable for the damage.","cn":"法院认定该公司应对损失负责。"},{"en":"hold A to a standard","zh":"要求 A 达到某项标准","ex":"The law holds all operators to a high standard.","cn":"法律要求所有运营商达到高标准。"},{"en":"take responsibility for ...","zh":"对……负责","ex":"The company took responsibility for the mistake.","cn":"公司为这次错误承担了责任。"},{"en":"shift responsibility to ...","zh":"将责任转嫁给……","ex":"The firm tried to shift responsibility to its suppliers.","cn":"公司试图将责任转嫁给供应商。"},{"en":"shift the focus from A to B","zh":"将重点从 A 转向 B","ex":"The report shifts the focus from short-term costs to long-term benefits.","cn":"报告将重点从短期成本转向长期收益。"},{"en":"draw a parallel between A and B","zh":"指出 A 和 B 之间的相似性","ex":"The author draws a parallel between the two reforms.","cn":"作者将两项改革作了类比。"},{"en":"draw a line between A and B","zh":"明确区分 A 与 B","ex":"The law draws a line between private and public information.","cn":"法律划定了私人信息与公共信息的界限。"},{"en":"blur the distinction between A and B","zh":"模糊 A 与 B 的区别","ex":"The definition blurs the distinction between ownership and control.","cn":"这一定义模糊了所有权与控制权的区别。"},{"en":"draw the inference that ...","zh":"作出……的推论","ex":"We cannot draw the inference that the policy caused the decline.","cn":"我们不能推断是该政策造成了这次下降。"},{"en":"reach a consensus on ...","zh":"就……达成共识","ex":"Experts reached a consensus on the need for further research.","cn":"专家们就需要进一步研究达成共识。"},{"en":"arrive at a compromise","zh":"达成妥协","ex":"The negotiators arrived at a compromise.","cn":"谈判代表达成了妥协。"},{"en":"give an account of ...","zh":"描述；解释……","ex":"The witness gave an account of the events.","cn":"证人叙述了事情的经过。"},{"en":"give an explanation for ...","zh":"对……作出解释","ex":"The minister gave an explanation for the delay.","cn":"部长解释了延误的原因。"},{"en":"account for the difference","zh":"解释差异","ex":"Regional incomes may account for the difference in outcomes.","cn":"地区收入可能解释结果上的差异。"},{"en":"account for a proportion","zh":"占据某个比例","ex":"Small firms account for a large proportion of local employment.","cn":"小企业在当地就业中占很大比例。"},{"en":"take account of ...","zh":"考虑到……","ex":"The analysis takes account of differences in age.","cn":"这项分析考虑了年龄差异。"},{"en":"on no account","zh":"绝不；无论如何都不","ex":"On no account should the evidence be altered.","cn":"绝不能篡改证据。"},{"en":"of little account","zh":"不重要","ex":"Their objections were treated as of little account.","cn":"他们的反对意见被认为无足轻重。"},{"en":"make allowances for ...","zh":"考虑到……的特殊情况","ex":"The panel made allowances for the small sample size.","cn":"专家组考虑到了样本量过小的问题。"},{"en":"leave aside ...","zh":"暂且搁置……","ex":"Let us leave aside the question of cost for now.","cn":"我们暂且搁置成本问题。"},{"en":"set aside an objection","zh":"暂时不考虑某项反对意见","ex":"The judge set aside an objection to the evidence.","cn":"法官驳回了对证据提出的异议。"},{"en":"put aside differences","zh":"搁置分歧","ex":"The parties put aside their differences to reach an agreement.","cn":"双方搁置分歧，达成了协议。"},{"en":"stand in the way of ...","zh":"阻碍……","ex":"Legal uncertainty stands in the way of reform.","cn":"法律上的不确定性阻碍改革。"},{"en":"stand up to scrutiny","zh":"经得起审查","ex":"The argument fails to stand up to scrutiny.","cn":"这一论点经不起严格审查。"},{"en":"withstand criticism","zh":"经受住批评","ex":"The original theory withstood years of criticism.","cn":"最初的理论经受住了多年的批评。"},{"en":"stand to gain ...","zh":"有望获益……","ex":"Small firms stand to gain from the change.","cn":"小企业有望从这种变化中受益。"},{"en":"stand to lose ...","zh":"可能损失……","ex":"Local workers stand to lose their jobs.","cn":"当地工人可能会失去工作。"},{"en":"fall victim to ...","zh":"成为……的受害者","ex":"Many consumers fall victim to online scams.","cn":"许多消费者成为网络诈骗的受害者。"},{"en":"fall prey to ...","zh":"受……侵害；落入……陷阱","ex":"Users may fall prey to misleading advertisements.","cn":"用户可能落入误导性广告的圈套。"},{"en":"fall into the trap of ...","zh":"陷入……的陷阱","ex":"Policymakers must avoid falling into the trap of confusing correlation with causation.","cn":"政策制定者必须避免陷入混淆相关与因果的陷阱。"},{"en":"fall under ...","zh":"归属于……范围","ex":"The transactions fall under the new regulations.","cn":"这些交易属于新法规的管辖范围。"},{"en":"come under scrutiny","zh":"受到审查","ex":"The agency's decision came under scrutiny.","cn":"该机构的决定受到审查。"},{"en":"come under pressure","zh":"承受压力","ex":"The operator came under pressure to lower prices.","cn":"运营商受到降价的压力。"},{"en":"come into conflict with ...","zh":"与……发生冲突","ex":"The new rule may come into conflict with existing law.","cn":"新规定可能与现行法律冲突。"},{"en":"come into being","zh":"形成；出现","ex":"The organization came into being after the reform.","cn":"这个组织是在改革后成立的。"},{"en":"come into play","zh":"开始发挥作用","ex":"Other factors come into play when the sample is small.","cn":"样本量较小时，其他因素也会发挥作用。"},{"en":"come to light","zh":"被揭露；为人所知","ex":"Important new evidence came to light during the trial.","cn":"重要的新证据在审判期间浮出水面。"},{"en":"come to the fore","zh":"变得突出；受到重视","ex":"Questions about privacy came to the fore.","cn":"隐私问题成为关注焦点。"},{"en":"come to a halt","zh":"停止","ex":"Construction came to a halt when funding ran out.","cn":"资金耗尽后，施工停了下来。"},{"en":"come up with ...","zh":"想出；提出……","ex":"Researchers came up with a simpler explanation.","cn":"研究人员提出了一个更简单的解释。"},{"en":"come across as ...","zh":"给人以……的印象","ex":"His statement came across as dismissive of public concerns.","cn":"他的表态给人一种轻视公众担忧的感觉。"},{"en":"come to be seen as ...","zh":"逐渐被视为……","ex":"The reform came to be seen as a major turning point.","cn":"这项改革逐渐被视为一个重要转折点。"},{"en":"set off a reaction","zh":"引发反应","ex":"The announcement set off a strong public reaction.","cn":"公告引发了公众的强烈反应。"},{"en":"set back reform","zh":"阻碍改革进展","ex":"The scandal set back reform by several years.","cn":"丑闻使改革进程倒退了好几年。"},{"en":"set a precedent for ...","zh":"为……开创先例","ex":"The ruling set a precedent for future cases.","cn":"这项裁决为今后的案件树立了先例。"},{"en":"set limits on ...","zh":"对……设限","ex":"The law sets limits on data collection.","cn":"法律对数据收集设定了限制。"},{"en":"set the record straight","zh":"澄清事实；纠正错误印象","ex":"The researcher issued a statement to set the record straight.","cn":"研究人员发表声明，以澄清事实。"},{"en":"put something in perspective","zh":"客观看待某事","ex":"Comparing the figures with earlier years puts the decline in perspective.","cn":"把这些数字与往年比较，可以更客观地看待下降幅度。"},{"en":"put into practice","zh":"付诸实践","ex":"The agency put the recommendations into practice.","cn":"该机构将建议付诸实践。"},{"en":"put in place","zh":"建立；落实","ex":"Stronger safeguards were put in place after the incident.","cn":"事件发生后实施了更严格的保障措施。"},{"en":"put at risk","zh":"使……面临风险","ex":"The decision could put thousands of jobs at risk.","cn":"这一决定可能使数千个工作岗位面临风险。"},{"en":"put pressure on ...","zh":"向……施加压力","ex":"Campaigners put pressure on officials to act.","cn":"活动人士向官员施压，要求其采取行动。"},{"en":"put to the test","zh":"使……接受考验","ex":"The theory was put to the test in a large trial.","cn":"这一理论在一项大型试验中得到了检验。"},{"en":"put an end to ...","zh":"终止……","ex":"The agreement put an end to the dispute.","cn":"协议结束了这场争端。"},{"en":"put up with ...","zh":"忍受……","ex":"Residents refused to put up with the noise.","cn":"居民拒绝忍受噪声。"},{"en":"take a toll on ...","zh":"对……造成损害","ex":"Long delays took a toll on public confidence.","cn":"长期延误损害了公众信心。"},{"en":"take advantage of ...","zh":"利用……；有时指占便宜","ex":"Some firms took advantage of weak oversight.","cn":"一些企业利用监管不力谋取利益。"},{"en":"take effect","zh":"生效","ex":"The new law will take effect next month.","cn":"新法律将于下月生效。"},{"en":"take hold","zh":"开始扎根；逐渐产生影响","ex":"The new approach began to take hold in local schools.","cn":"这种新方法开始在当地学校推广开来。"},{"en":"take shape","zh":"逐渐成形","ex":"A revised plan slowly took shape.","cn":"修订后的计划逐渐成形。"},{"en":"take for granted","zh":"想当然地认为；视为理所当然","ex":"We should not take public trust for granted.","cn":"我们不应把公众信任视为理所当然。"},{"en":"take seriously","zh":"认真对待","ex":"The regulator must take these complaints seriously.","cn":"监管机构必须认真对待这些投诉。"},{"en":"take exception to ...","zh":"对……表示反对或不满","ex":"Several experts took exception to the wording of the claim.","cn":"几名专家对这一说法的措辞提出异议。"},{"en":"take pains to do ...","zh":"煞费苦心做……","ex":"The author took pains to explain the limits of the evidence.","cn":"作者费了很大力气解释证据的局限性。"},{"en":"take a stand on ...","zh":"对……明确表态","ex":"The organization refused to take a stand on the proposal.","cn":"该组织拒绝就提案表态。"},{"en":"take sides in ...","zh":"在……中选边站","ex":"The journal tried not to take sides in the dispute.","cn":"这家期刊尽量不在争论中偏袒任何一方。"},{"en":"take issue with a claim","zh":"对某种说法提出异议","ex":"The economist takes issue with the claim that costs will fall.","cn":"经济学家质疑成本会下降的说法。"},{"en":"keep pace with ...","zh":"跟上……的步伐","ex":"Regulations struggle to keep pace with technology.","cn":"监管规定难以跟上技术发展。"},{"en":"keep up with ...","zh":"跟上……","ex":"Smaller firms struggled to keep up with demand.","cn":"较小的企业难以满足需求。"},{"en":"keep track of ...","zh":"持续记录、跟踪……","ex":"The researchers kept track of changes in opinion.","cn":"研究人员持续记录公众观点的变化。"},{"en":"keep in mind ...","zh":"牢记；考虑到……","ex":"Keep in mind that the sample was unusually small.","cn":"请记住，这次样本量小得不寻常。"},{"en":"keep A from doing B","zh":"阻止 A 做 B","ex":"The rules keep companies from misusing personal data.","cn":"这些规定防止公司滥用个人数据。"},{"en":"keep A in check","zh":"控制 A；防止 A 过度发展","ex":"Independent oversight helps keep monopoly power in check.","cn":"独立监督有助于遏制垄断权力。"},{"en":"keep A at bay","zh":"使 A 无法靠近；抑制 A","ex":"Early treatment may keep the disease at bay.","cn":"早期治疗可能有助于控制这种疾病。"},{"en":"keep A in place","zh":"使 A 保持原状","ex":"The government decided to keep the restrictions in place.","cn":"政府决定继续实施限制措施。"},{"en":"hold back ...","zh":"阻碍；抑制……","ex":"Lack of funding held back the research.","cn":"缺乏资金阻碍了研究。"},{"en":"hold up ...","zh":"耽搁；支撑；举作例子","ex":"A legal dispute held up the project.","cn":"法律纠纷使项目推迟。"},{"en":"hold out hope","zh":"仍然抱有希望","ex":"The researchers still hold out hope for a solution.","cn":"研究人员仍抱有找到解决方案的希望。"},{"en":"hold true","zh":"仍然成立","ex":"The conclusion may not hold true in other settings.","cn":"这一结论在其他环境下可能不成立。"},{"en":"hold firm","zh":"保持坚定；维持不变","ex":"The committee held firm despite growing pressure.","cn":"尽管压力越来越大，委员会仍坚定立场。"},{"en":"hold a view","zh":"持有某种观点","ex":"The author holds a different view of the evidence.","cn":"作者对证据持有不同看法。"},{"en":"hold sway over ...","zh":"对……有重要影响；支配……","ex":"The industry held sway over the local economy.","cn":"该行业曾主导当地经济。"},{"en":"bear little resemblance to ...","zh":"与……几乎没有相似之处","ex":"The actual results bear little resemblance to the predictions.","cn":"实际结果与预测几乎毫无相似之处。"},{"en":"bear witness to ...","zh":"见证；证明……","ex":"The records bear witness to decades of change.","cn":"这些记录见证了数十年的变化。"},{"en":"bear in mind ...","zh":"牢记……","ex":"Bear in mind that the figures are preliminary.","cn":"请记住，这些数字只是初步数据。"},{"en":"bear the consequences","zh":"承担后果","ex":"The operator must bear the consequences of its decision.","cn":"运营商必须承担其决定的后果。"},{"en":"bear the brunt of ...","zh":"承受……的主要冲击","ex":"Low-income households bore the brunt of the price increase.","cn":"低收入家庭受到了此次涨价的最大冲击。"},{"en":"bring to light ...","zh":"揭露；使……为人所知","ex":"The investigation brought hidden risks to light.","cn":"调查揭露了隐藏的风险。"},{"en":"bring under control","zh":"使……受到控制","ex":"Officials struggled to bring inflation under control.","cn":"官员努力控制通货膨胀。"},{"en":"bring forward a plan","zh":"提出计划；把计划提前（依语境）","ex":"The ministry brought forward a plan to improve safety.","cn":"该部提前提出了一项改善安全的计划。"},{"en":"bring into focus","zh":"使……成为焦点；使清晰","ex":"The scandal brought accountability into focus.","cn":"这起丑闻使问责问题成为关注焦点。"},{"en":"bring A into line with B","zh":"使 A 与 B 保持一致","ex":"The revision brought local standards into line with national law.","cn":"这次修订使地方标准与国家法律保持一致。"},{"en":"make room for ...","zh":"为……腾出空间","ex":"The reform made room for new competitors.","cn":"改革为新竞争者创造了空间。"},{"en":"make a difference to ...","zh":"对……产生影响","ex":"The subsidy made a difference to low-income families.","cn":"这项补贴对低收入家庭产生了积极影响。"},{"en":"make little difference","zh":"影响不大","ex":"The additional funding made little difference.","cn":"额外资金几乎没有产生影响。"},{"en":"make light of ...","zh":"轻视；对……不以为意","ex":"Critics accused the minister of making light of the risks.","cn":"批评者指责部长轻视风险。"},{"en":"make much of ...","zh":"非常重视；大做文章","ex":"The article made much of a minor statistical change.","cn":"文章大肆强调一项微小的统计变化。"},{"en":"make the most of ...","zh":"充分利用……","ex":"Small firms should make the most of the new opportunities.","cn":"小企业应充分利用新机会。"},{"en":"make a point of doing ...","zh":"特意坚持做……","ex":"The author makes a point of citing independent evidence.","cn":"作者特别注意引用独立证据。"},{"en":"make do with ...","zh":"将就使用……","ex":"The hospital had to make do with outdated equipment.","cn":"医院不得不将就使用过时的设备。"},{"en":"make it clear that ...","zh":"明确指出……","ex":"The report makes it clear that the system needs reform.","cn":"报告明确指出，这个制度需要改革。"},{"en":"make it possible for A to ...","zh":"使 A 能够……","ex":"The grant made it possible for students to continue their studies.","cn":"这笔补助金使学生得以继续学业。"},{"en":"make it difficult for A to ...","zh":"使 A 难以……","ex":"High costs made it difficult for small firms to compete.","cn":"高成本使小企业难以竞争。"},{"en":"make sense","zh":"有道理；讲得通","ex":"The explanation makes sense when the figures are compared.","cn":"把这些数字放在一起比较后，这种解释就说得通了。"},{"en":"make matters worse","zh":"使情况更糟","ex":"To make matters worse, the costs kept rising.","cn":"更糟的是，成本还在持续上升。"},{"en":"make no mention of ...","zh":"完全没有提及……","ex":"The official statement makes no mention of the complaints.","cn":"官方声明完全没有提到投诉。"},{"en":"make no claim to ...","zh":"不声称拥有……","ex":"The report makes no claim to absolute certainty.","cn":"报告并不声称其结论绝对确定。"},{"en":"make a distinction","zh":"作出区分","ex":"The author makes a distinction between evidence and interpretation.","cn":"作者区分了证据与解释。"},{"en":"not A but B","zh":"不是 A，而是 B","ex":"The problem is not a lack of money but a lack of planning.","cn":"问题不在于缺钱，而在于缺乏规划。"},{"en":"not so much A as B","zh":"与其说是 A，不如说是 B","ex":"The issue is not so much cost as public trust.","cn":"问题与其说是成本，不如说是公众信任。"},{"en":"not only A but also B","zh":"不仅 A，而且 B","ex":"The policy affects not only firms but also consumers.","cn":"这项政策不仅影响企业，也影响消费者。"},{"en":"neither A nor B","zh":"既不 A，也不 B","ex":"Neither the company nor the regulator accepted responsibility.","cn":"公司和监管机构都没有承担责任。"},{"en":"either A or B","zh":"要么 A，要么 B","ex":"The committee must choose either reform or delay.","cn":"委员会必须在改革与拖延之间作出选择。"},{"en":"A rather than B","zh":"A 而不是 B","ex":"The authors favor evidence rather than speculation.","cn":"作者们更看重证据，而非猜测。"},{"en":"A instead of B","zh":"用 A 而非 B","ex":"The city invested in buses instead of new roads.","cn":"该市投资购买公交车，而不是修建新道路。"},{"en":"A as opposed to B","zh":"A 与 B 相对；A 而非 B","ex":"The report focuses on real wages as opposed to nominal wages.","cn":"报告关注的是实际工资，而不是名义工资。"},{"en":"no more than ...","zh":"仅仅；不超过……","ex":"The survey involved no more than twenty people.","cn":"这项调查涉及的人数不超过20人。"},{"en":"no less than ...","zh":"不少于……；多达……；竟然……","ex":"No less than five agencies reviewed the proposal.","cn":"至少有五个机构审查了这项提案。"},{"en":"no more A than B","zh":"A 并不比 B 更……；常表示两者都不具备某性质","ex":"This claim is no more reliable than the earlier rumor.","cn":"这种说法的可靠性丝毫不高于早先的传言。"},{"en":"no less A than B","zh":"A 不亚于 B；两者都具有某性质（视具体句式）","ex":"The new result is no less important than the original discovery.","cn":"新结果的重要性丝毫不亚于最初的发现。"},{"en":"not any more ... than ...","zh":"与……同样不……","ex":"The policy is not any more effective than the previous one.","cn":"这项政策并不比上一项政策更有效。"},{"en":"nothing but ...","zh":"只不过是……；只有……","ex":"The proposal offers nothing but temporary relief.","cn":"这项提议只能带来暂时的缓解。"},{"en":"anything but ...","zh":"绝不是……；一点也不……","ex":"The outcome was anything but predictable.","cn":"结果完全无法预测。"},{"en":"all but ...","zh":"几乎；除……之外全部","ex":"The new evidence all but settled the debate.","cn":"新证据几乎平息了争论。"},{"en":"far from ...","zh":"远非……；远没有……","ex":"The proposed solution is far from adequate.","cn":"拟议中的解决方案远远不够充分。"},{"en":"far from being ...","zh":"根本不是……","ex":"Far from being impartial, the report favored one side.","cn":"报告远非公正，而是偏袒了一方。"},{"en":"little more than ...","zh":"只不过是……","ex":"The announcement was little more than a public-relations exercise.","cn":"这项公告不过是一场公关活动。"},{"en":"nothing short of ...","zh":"简直就是……；无异于……","ex":"The discovery was nothing short of remarkable.","cn":"这一发现实在令人惊叹。"},{"en":"much less ...","zh":"更不用说……","ex":"The agency cannot guarantee safety, much less eliminate every risk.","cn":"该机构无法保证安全，更不用说消除所有风险。"},{"en":"let alone ...","zh":"更不用说……","ex":"Many households cannot afford rent, let alone a new house.","cn":"许多家庭连房租都负担不起，更不用说买新房了。"},{"en":"not to mention ...","zh":"更不必说……","ex":"The project needs more funding, not to mention better management.","cn":"项目需要更多资金，更不用说还需要改善管理。"},{"en":"to say nothing of ...","zh":"更不用说……","ex":"The policy may raise costs, to say nothing of its legal risks.","cn":"这项政策可能增加成本，更不用说它还存在法律风险。"},{"en":"at best","zh":"充其量；往好处说","ex":"At best, the new measures will offer short-term relief.","cn":"往好处说，新措施也只能带来短期缓解。"},{"en":"at worst","zh":"最坏情况下","ex":"At worst, the proposed cuts could close the hospital.","cn":"最糟糕的情况下，拟议中的削减可能导致医院关闭。"},{"en":"at least","zh":"至少","ex":"At least three independent studies reached the same conclusion.","cn":"至少三项独立研究得出了同样的结论。"},{"en":"at most","zh":"至多","ex":"At most, the policy will save a small amount.","cn":"这项政策最多只能节省一小笔钱。"},{"en":"in no way","zh":"绝不；丝毫不","ex":"This finding in no way proves the original theory.","cn":"这一发现绝不能证明原来的理论。"},{"en":"by no means","zh":"绝不","ex":"The results are by no means conclusive.","cn":"这些结果绝非定论。"},{"en":"under no circumstances","zh":"绝不；在任何情况下都不","ex":"Under no circumstances should personal data be disclosed.","cn":"在任何情况下都不得披露个人数据。"},{"en":"in no circumstances","zh":"在任何情况下都不","ex":"In no circumstances may the company ignore safety rules.","cn":"公司在任何情况下都不得无视安全规定。"},{"en":"not necessarily ...","zh":"未必；不一定……","ex":"Higher spending does not necessarily improve outcomes.","cn":"支出增加不一定能改善结果。"},{"en":"not always ...","zh":"并非总是……","ex":"A popular policy is not always an effective one.","cn":"受欢迎的政策并不总是有效的。"},{"en":"not entirely ...","zh":"并非完全……","ex":"The committee was not entirely satisfied with the evidence.","cn":"委员会对证据并非完全满意。"},{"en":"not uncommon","zh":"并不罕见","ex":"Such delays are not uncommon in major projects.","cn":"在大型项目中，这样的延误并不少见。"},{"en":"not impossible","zh":"并非不可能","ex":"Finding a solution is difficult, but not impossible.","cn":"找到解决办法虽然困难，但并非不可能。"},{"en":"not without merit","zh":"并非毫无可取之处","ex":"The objection is not without merit.","cn":"这种反对意见并非毫无道理。"},{"en":"not without risk","zh":"并非没有风险","ex":"The proposed reform is not without risk.","cn":"拟议中的改革并非没有风险。"},{"en":"not until ...","zh":"直到……才……","ex":"The company did not disclose the problem until March.","cn":"直到三月份，公司才披露这个问题。"},{"en":"only after ...","zh":"只有在……之后才……","ex":"Only after reviewing the evidence did the panel change its view.","cn":"只有在审查证据之后，专家组才改变了看法。"},{"en":"only if ...","zh":"只有在……条件下才……","ex":"The treatment is effective only if patients follow the schedule.","cn":"只有患者遵循规定的用药计划，治疗才有效。"},{"en":"if only ...","zh":"但愿……；要是……就好了","ex":"If only the government had acted sooner, the damage might have been avoided.","cn":"要是政府当初行动得更早，或许就能避免损失。"},{"en":"if not ...","zh":"如果不是……；即使不……（依语境）","ex":"The results are interesting, if not entirely convincing.","cn":"这些结果有意思，尽管还不能完全令人信服。"},{"en":"if anything","zh":"如果说有什么区别，倒是……","ex":"If anything, the new figures strengthen the argument for reform.","cn":"如果说有什么影响的话，新数字反而加强了支持改革的论点。"},{"en":"if at all","zh":"即使有；如果真的发生","ex":"The rule affects small firms only slightly, if at all.","cn":"这项规定对小企业的影响即便有也非常轻微。"},{"en":"if necessary","zh":"如有必要","ex":"The court may request further evidence if necessary.","cn":"如果有必要，法院可以要求进一步提供证据。"},{"en":"if possible","zh":"如果可能的话","ex":"The team will publish the results this week, if possible.","cn":"如果可能，团队将在本周公布结果。"},{"en":"unless ...","zh":"除非……；如果不……","ex":"The plan will fail unless funding increases.","cn":"除非资金增加，否则计划将失败。"},{"en":"provided that ...","zh":"只要……；条件是……","ex":"The project can proceed provided that safety standards are met.","cn":"只要符合安全标准，项目就可以继续推进。"},{"en":"providing that ...","zh":"只要……","ex":"Firms may reopen providing that they follow the new rules.","cn":"只要遵守新规定，企业就可以重新开业。"},{"en":"as long as ...","zh":"只要……；时间长达……","ex":"The policy can work as long as agencies cooperate.","cn":"只要各机构合作，这项政策就能奏效。"},{"en":"so long as ...","zh":"只要……","ex":"The grant remains available so long as applicants meet the criteria.","cn":"只要申请人符合标准，补助金就仍然可以申请。"},{"en":"on condition that ...","zh":"条件是……","ex":"The bank agreed to lend the money on condition that costs were reduced.","cn":"银行同意贷款，条件是降低成本。"},{"en":"in case ...","zh":"以防……；万一……","ex":"The hospital kept extra supplies in case demand increased.","cn":"医院储备了额外物资，以防需求增加。"},{"en":"in the event that ...","zh":"如果……发生","ex":"In the event that the project fails, the funding will be returned.","cn":"如果项目失败，资金将被退还。"},{"en":"for fear that ...","zh":"唯恐……；担心……","ex":"Officials withheld the report for fear that it might cause panic.","cn":"官员担心报告引发恐慌，因此暂缓公布。"},{"en":"lest ...","zh":"以免……；唯恐……","ex":"The committee delayed the vote lest important evidence be overlooked.","cn":"委员会推迟投票，以免忽略重要证据。"},{"en":"even if ...","zh":"即使……（假设让步）","ex":"Even if costs fall, the reform may still face opposition.","cn":"即使成本下降，改革仍可能面临反对。"},{"en":"even though ...","zh":"尽管……（事实让步）","ex":"Even though costs fell, the company raised its prices.","cn":"尽管成本下降了，公司还是提高了价格。"},{"en":"although ...","zh":"尽管……","ex":"Although the policy is popular, its benefits remain uncertain.","cn":"虽然这项政策很受欢迎，但它的益处仍不确定。"},{"en":"albeit ...","zh":"虽然；尽管","ex":"The study found an improvement, albeit a modest one.","cn":"研究发现情况有所改善，尽管幅度不大。"},{"en":"while ... (concession)","zh":"虽然……；尽管……","ex":"While the proposal has merits, it also carries serious risks.","cn":"这项提议虽然有优点，但也存在严重风险。"},{"en":"while ... (contrast)","zh":"而……；相比之下……","ex":"Some firms expanded, while others reduced investment.","cn":"一些企业扩张了业务，而另一些企业减少了投资。"},{"en":"whereas ...","zh":"然而；而（对比）","ex":"Urban incomes rose, whereas rural wages remained flat.","cn":"城市收入增加，而农村工资仍然停滞。"},{"en":"much as ...","zh":"尽管……；虽然……","ex":"Much as I respect the research, I question its conclusion.","cn":"尽管我非常尊重这项研究，但我质疑其结论。"},{"en":"despite ...","zh":"尽管……（后接名词性成分）","ex":"Despite strong opposition, the reform was approved.","cn":"尽管遭到强烈反对，改革仍获批准。"},{"en":"in spite of ...","zh":"尽管……","ex":"In spite of the warnings, the company continued the project.","cn":"尽管有警告，公司仍继续推进项目。"},{"en":"regardless of ...","zh":"不管……；不顾……","ex":"The rules apply regardless of the firm's size.","cn":"无论企业规模如何，这些规定都适用。"},{"en":"irrespective of ...","zh":"不论……；不考虑……","ex":"Every applicant is assessed irrespective of income.","cn":"每位申请人都要接受评估，不论其收入多少。"},{"en":"notwithstanding ...","zh":"尽管……；然而……","ex":"Notwithstanding the objections, the committee proceeded.","cn":"尽管存在反对意见，委员会还是继续推进。"},{"en":"for all ...","zh":"尽管……；虽然……","ex":"For all its promise, the technology remains expensive.","cn":"尽管这项技术前景可期，价格仍然高昂。"},{"en":"contrary to ...","zh":"与……相反","ex":"Contrary to expectations, demand declined.","cn":"与预期相反，需求下降了。"},{"en":"other than ...","zh":"除了……；不同于……","ex":"The study found no explanation other than rising costs.","cn":"研究发现，除了成本上升外没有其他解释。"},{"en":"rather than doing ...","zh":"而不是做……","ex":"Rather than cutting staff, the firm reduced executive bonuses.","cn":"公司没有裁员，而是削减了高管奖金。"},{"en":"instead of doing ...","zh":"而不去做……","ex":"Instead of raising prices, the company improved efficiency.","cn":"公司没有涨价，而是提高了效率。"},{"en":"by contrast","zh":"相比之下","ex":"By contrast, smaller firms reported falling profits.","cn":"相比之下，较小的企业报告利润下降。"},{"en":"by comparison","zh":"比较而言","ex":"By comparison, the previous policy was less costly.","cn":"相较之下，上一项政策成本更低。"},{"en":"conversely","zh":"反过来说；相反","ex":"Lower prices may boost demand; conversely, higher prices may reduce it.","cn":"降价可能刺激需求；反过来，涨价可能抑制需求。"},{"en":"on the contrary","zh":"恰恰相反（反驳前述否定）","ex":"The evidence did not weaken the theory; on the contrary, it strengthened it.","cn":"证据并没有削弱这一理论；恰恰相反，它加强了这一理论。"},{"en":"to the contrary","zh":"持相反意见的；相反的","ex":"Despite evidence to the contrary, the firm maintained its claim.","cn":"尽管有相反证据，公司仍坚持自己的说法。"},{"en":"quite the contrary","zh":"恰恰相反","ex":"The new data do not suggest decline; quite the contrary, they indicate growth.","cn":"新数据并不表明出现下降；恰恰相反，它们显示了增长。"},{"en":"otherwise","zh":"否则；在其他方面；不同地","ex":"The rules must be followed; otherwise, the permit may be revoked.","cn":"必须遵守这些规定，否则许可证可能被撤销。"},{"en":"alternatively","zh":"或者；作为另一种选择","ex":"Alternatively, the city could invest in public transport.","cn":"另一种选择是，该市可以投资公共交通。"},{"en":"meanwhile","zh":"与此同时；另一方面","ex":"The committee reviewed the plan; meanwhile, costs continued to rise.","cn":"委员会审查了计划；与此同时，成本继续上升。"},{"en":"whereby ...","zh":"凭借这一方式；据此……","ex":"They adopted a scheme whereby residents could apply for assistance online.","cn":"他们采用了一项方案，让居民可以在线申请援助。"},{"en":"thereby ...","zh":"从而；由此……","ex":"The reform reduced paperwork, thereby saving time.","cn":"改革减少了文书工作，从而节省了时间。"},{"en":"therefore","zh":"因此","ex":"The evidence is incomplete; therefore, further research is needed.","cn":"证据尚不完整，因此需要进一步研究。"},{"en":"hence","zh":"因此；由此","ex":"The sample was small; hence the conclusions remain tentative.","cn":"样本量较小，因此结论仍是初步的。"},{"en":"thus","zh":"因此；如此","ex":"The company reduced waste and thus lowered costs.","cn":"公司减少了浪费，从而降低了成本。"},{"en":"consequently","zh":"因此；结果","ex":"Funding was cut; consequently, several projects were delayed.","cn":"资金被削减，因此几个项目被推迟。"},{"en":"accordingly","zh":"因此；相应地","ex":"The risk increased, and the agency adjusted its rules accordingly.","cn":"风险增加，该机构于是相应调整了规定。"},{"en":"nevertheless","zh":"然而；尽管如此","ex":"The approach is expensive; nevertheless, it may be worthwhile.","cn":"这种方法成本高昂；然而，它可能值得采用。"},{"en":"nonetheless","zh":"尽管如此","ex":"The evidence is limited; nonetheless, the findings are promising.","cn":"证据有限；尽管如此，这些发现仍有希望。"},{"en":"still (conj./adv.)","zh":"然而；尽管这样","ex":"The plan is imperfect; still, it represents progress.","cn":"计划并不完美，但它仍代表着进步。"},{"en":"yet (conj./adv.)","zh":"然而；仍然","ex":"The economy grew, yet wages remained stagnant.","cn":"经济增长了，但工资仍然停滞不前。"},{"en":"admittedly","zh":"不可否认地；诚然","ex":"Admittedly, the policy is costly, but it protects vulnerable groups.","cn":"不可否认，这项政策成本很高，但它保护了弱势群体。"},{"en":"supposedly","zh":"据说；按说","ex":"The supposedly independent review was paid for by the company.","cn":"这项据称独立的审查实际上由该公司出资。"},{"en":"reportedly","zh":"据报道","ex":"The project was reportedly delayed by another month.","cn":"据报道，项目又被推迟了一个月。"},{"en":"purportedly","zh":"声称是……的；据称","ex":"The purportedly independent committee had close ties to the firm.","cn":"这家据称独立的委员会与公司关系密切。"},{"en":"allegedly","zh":"据称；据指控（未经证实）","ex":"The company allegedly concealed important safety information.","cn":"据指控，该公司隐瞒了重要的安全信息。"},{"en":"arguably","zh":"可以说；有理由认为","ex":"This is arguably the strongest evidence so far.","cn":"这可以说是迄今最有力的证据。"},{"en":"apparently","zh":"看来；据表面情况","ex":"Apparently, the figures were revised after publication.","cn":"显然，这些数字在发表后经过了修订。"},{"en":"presumably","zh":"大概；推测起来","ex":"Presumably, the board will discuss the proposal tomorrow.","cn":"据推测，董事会明天将讨论这项提案。"},{"en":"seemingly","zh":"表面上；看似","ex":"The seemingly minor change had major consequences.","cn":"这一看似微小的变化造成了重大后果。"},{"en":"ostensibly","zh":"表面上；据称","ex":"The policy was ostensibly designed to protect consumers.","cn":"这项政策表面上是为了保护消费者。"},{"en":"actually","zh":"实际上","ex":"The change appeared beneficial but actually increased costs.","cn":"这一变化看上去有利，实际上却增加了成本。"},{"en":"in fact","zh":"事实上","ex":"The reform did not fail; in fact, it exceeded expectations.","cn":"改革没有失败；事实上，它取得了超出预期的成果。"},{"en":"indeed","zh":"确实；甚至；实际上","ex":"The figures are encouraging; indeed, they show steady growth.","cn":"这些数字令人鼓舞；确实，它们显示出稳定增长。"},{"en":"as such","zh":"因此；就其本身而言（依语境）","ex":"This is a preliminary finding and should be treated as such.","cn":"这只是初步发现，应当据此谨慎对待。"},{"en":"such as ...","zh":"例如……（举例）","ex":"The study covers social risks such as unemployment and poverty.","cn":"该研究涉及失业和贫困等社会风险。"},{"en":"such that ...","zh":"以至于……；使得……","ex":"The rules were designed such that no single company could dominate the market.","cn":"这些规定旨在确保没有任何一家公司能够垄断市场。"},{"en":"in this sense","zh":"从这个意义上说","ex":"In this sense, the reform is a step toward greater fairness.","cn":"从这个意义上说，改革是迈向更公平的一步。"},{"en":"in particular","zh":"尤其；特别是","ex":"The report highlights younger workers in particular.","cn":"报告特别强调了年轻工人。"},{"en":"to that end","zh":"为实现这一目的","ex":"The city wants cleaner air; to that end, it expanded bus services.","cn":"该市希望空气更清洁；为此，它扩大了公交服务。"},{"en":"to no avail","zh":"徒劳地；没有奏效","ex":"The union appealed repeatedly, but to no avail.","cn":"工会一再上诉，但徒劳无功。"},{"en":"to some extent","zh":"在某种程度上","ex":"To some extent, the decline reflects changing consumer preferences.","cn":"在一定程度上，这种下降反映出消费者偏好的变化。"},{"en":"to a certain extent","zh":"在一定程度上","ex":"The policy succeeded to a certain extent.","cn":"这项政策取得了一定程度的成功。"},{"en":"to a large extent","zh":"在很大程度上","ex":"To a large extent, outcomes depend on family income.","cn":"结果在很大程度上取决于家庭收入。"},{"en":"to a limited extent","zh":"在有限程度上","ex":"The regulation protects consumers, but only to a limited extent.","cn":"这项规定保护消费者，但保护作用有限。"},{"en":"to the extent that ...","zh":"在……的程度上；以至于……","ex":"The plan will succeed to the extent that firms cooperate.","cn":"这项计划能否成功，取决于企业合作的程度。"},{"en":"insofar as ...","zh":"在……的范围内；鉴于……","ex":"The policy is effective insofar as it reduces harmful emissions.","cn":"在减少有害排放的范围内，这项政策是有效的。"},{"en":"inasmuch as ...","zh":"因为；在……程度上","ex":"The argument is valid inasmuch as it rests on reliable evidence.","cn":"鉴于论点建立在可靠证据之上，它是成立的。"},{"en":"given that ...","zh":"考虑到……；鉴于……","ex":"Given that costs are rising, the budget must be revised.","cn":"鉴于成本不断上升，预算必须修改。"},{"en":"seeing that ...","zh":"既然；鉴于……","ex":"Seeing that the evidence was weak, the judge dismissed the claim.","cn":"鉴于证据薄弱，法官驳回了这一主张。"},{"en":"considering that ...","zh":"考虑到……","ex":"Considering that resources are limited, the results are impressive.","cn":"考虑到资源有限，这些结果令人印象深刻。"},{"en":"in view of ...","zh":"鉴于……；考虑到……","ex":"In view of the new evidence, the decision was postponed.","cn":"鉴于出现新证据，这一决定被推迟。"},{"en":"in light of ...","zh":"鉴于……；根据……","ex":"In light of recent findings, the theory needs revision.","cn":"根据近期发现，这一理论需要修订。"},{"en":"in the wake of ...","zh":"随着……之后；继……而来","ex":"In the wake of the scandal, public trust fell sharply.","cn":"丑闻发生后，公众信任大幅下降。"},{"en":"in consequence of ...","zh":"由于……","ex":"The company closed several offices in consequence of declining demand.","cn":"由于需求下降，公司关闭了几个办事处。"},{"en":"as a result of ...","zh":"由于……的结果","ex":"Prices rose as a result of supply shortages.","cn":"供应短缺导致价格上涨。"},{"en":"as a consequence","zh":"因此；结果","ex":"The project was delayed; as a consequence, costs increased.","cn":"项目被推迟，因此成本增加。"},{"en":"by virtue of ...","zh":"凭借……；由于……","ex":"She gained access by virtue of her position.","cn":"她凭借自己的职位获得了访问权限。"},{"en":"by dint of ...","zh":"凭借……（通常指努力）","ex":"The team succeeded by dint of sustained effort.","cn":"团队凭借持续努力取得了成功。"},{"en":"for want of ...","zh":"由于缺乏……","ex":"The inquiry stalled for want of reliable evidence.","cn":"由于缺乏可靠证据，调查陷入停滞。"},{"en":"for lack of ...","zh":"由于缺少……","ex":"The case was dismissed for lack of evidence.","cn":"由于缺乏证据，此案被驳回。"},{"en":"owing to ...","zh":"由于……","ex":"Owing to bad weather, the launch was postponed.","cn":"由于天气恶劣，发射被推迟。"},{"en":"thanks to ...","zh":"由于……；多亏……","ex":"Thanks to early investment, the town avoided major damage.","cn":"多亏了早期投资，该镇避免了重大损失。"},{"en":"due to ...","zh":"由于……","ex":"The delay was due to unexpected repairs.","cn":"延误是意外维修造成的。"},{"en":"in terms of ...","zh":"在……方面；就……而言","ex":"In terms of cost, the second option is preferable.","cn":"就成本而言，第二种方案更可取。"},{"en":"in relation to ...","zh":"关于……；与……有关","ex":"The report raises questions in relation to worker safety.","cn":"报告提出了与工人安全有关的问题。"},{"en":"with regard to ...","zh":"关于……","ex":"With regard to privacy, the rules remain unclear.","cn":"在隐私方面，这些规定仍不明确。"},{"en":"as regards ...","zh":"至于……；关于……","ex":"As regards implementation, several issues remain unresolved.","cn":"就实施而言，几个问题仍未解决。"},{"en":"with respect to ...","zh":"关于……；就……而言","ex":"With respect to funding, the committee offered no details.","cn":"关于资金问题，委员会没有提供细节。"},{"en":"in respect of ...","zh":"关于……；涉及……","ex":"The company was fined in respect of several violations.","cn":"公司因多项违规行为受到罚款。"},{"en":"with reference to ...","zh":"关于……；参照……","ex":"With reference to your request, we have reviewed the policy.","cn":"关于您的请求，我们已审查了该政策。"},{"en":"on behalf of ...","zh":"代表……；为了……的利益","ex":"The lawyer spoke on behalf of the workers.","cn":"律师代表工人发言。"},{"en":"in the absence of ...","zh":"在缺乏……的情况下","ex":"In the absence of reliable data, the claim remains uncertain.","cn":"由于缺乏可靠数据，这一主张仍不确定。"},{"en":"in the presence of ...","zh":"在存在……的情况下","ex":"The reaction occurs in the presence of oxygen.","cn":"这一反应在有氧气的条件下发生。"},{"en":"in keeping with ...","zh":"符合……；与……一致","ex":"The changes are in keeping with international standards.","cn":"这些变化符合国际标准。"},{"en":"in conflict with ...","zh":"与……冲突","ex":"The local rule is in conflict with national law.","cn":"地方规定与国家法律相冲突。"},{"en":"at the expense of ...","zh":"以牺牲……为代价","ex":"Profits rose at the expense of worker safety.","cn":"利润增加是以牺牲工人安全为代价的。"},{"en":"at risk of ...","zh":"面临……的风险","ex":"Coastal communities are at risk of flooding.","cn":"沿海社区面临洪灾风险。"},{"en":"at odds with ...","zh":"与……不一致；有分歧","ex":"These findings are at odds with the earlier report.","cn":"这些发现与早先的报告相矛盾。"},{"en":"at stake","zh":"处于风险之中；攸关重大","ex":"Thousands of jobs are at stake in the negotiations.","cn":"成千上万个工作岗位在谈判中面临风险。"},{"en":"at issue","zh":"争论焦点所在","ex":"What is at issue is whether the process was fair.","cn":"争议焦点在于这一程序是否公平。"},{"en":"in question","zh":"所讨论的；有疑问的","ex":"The decision in question was made last year.","cn":"所讨论的这一决定是去年作出的。"},{"en":"under discussion","zh":"正在讨论中的","ex":"Several alternatives are still under discussion.","cn":"几种替代方案仍在讨论中。"},{"en":"in dispute","zh":"有争议的","ex":"The cause of the accident remains in dispute.","cn":"事故的原因仍有争议。"},{"en":"in doubt","zh":"尚无定论的","ex":"The long-term success of the project is still in doubt.","cn":"该项目能否取得长期成功仍值得怀疑。"},{"en":"in favor of ...","zh":"支持……；有利于……","ex":"A majority voted in favor of the reform.","cn":"大多数人投票支持改革。"},{"en":"in opposition to ...","zh":"反对……","ex":"The campaign was launched in opposition to the new tax.","cn":"这场活动是为反对新税而发起的。"},{"en":"against the backdrop of ...","zh":"在……的背景下","ex":"The debate unfolded against the backdrop of rising unemployment.","cn":"辩论是在失业率上升的背景下展开的。"},{"en":"beyond doubt","zh":"毫无疑问","ex":"The results establish beyond doubt that the device works under these conditions.","cn":"结果毫无疑问地证明，该装置在这些条件下能够工作。"},{"en":"beyond dispute","zh":"无可争议","ex":"The need for reform is beyond dispute.","cn":"改革的必要性无可争议。"},{"en":"to the best of one's knowledge","zh":"据某人所知","ex":"To the best of my knowledge, the report has not been released.","cn":"据我所知，报告尚未发布。"},{"en":"at face value","zh":"按表面意思；不加质疑地","ex":"The committee refused to take the claim at face value.","cn":"委员会拒绝不加质疑地接受这种说法。"},{"en":"on the face of it","zh":"乍看之下；表面上","ex":"On the face of it, the proposal seems reasonable.","cn":"表面上看，这项提议似乎合理。"},{"en":"beneath the surface","zh":"在表象之下","ex":"Beneath the surface, serious disagreements remained.","cn":"表面之下仍存在严重分歧。"},{"en":"on balance","zh":"权衡利弊后；总的来说","ex":"On balance, the benefits appear to outweigh the costs.","cn":"综合权衡，收益似乎大于成本。"},{"en":"by and large","zh":"大体上；总体而言","ex":"By and large, respondents supported the policy.","cn":"总体而言，受访者支持这项政策。"},{"en":"for the most part","zh":"在很大程度上；大部分","ex":"For the most part, the program achieved its goals.","cn":"这项计划在很大程度上实现了目标。"},{"en":"more often than not","zh":"往往；通常","ex":"More often than not, the first explanation is incomplete.","cn":"最初的解释往往不够完整。"},{"en":"in many respects","zh":"在许多方面","ex":"In many respects, the two approaches are similar.","cn":"这两种方法在许多方面相似。"},{"en":"in no small part","zh":"在相当大程度上","ex":"The success was due in no small part to local volunteers.","cn":"这次成功在很大程度上要归功于当地志愿者。"},{"en":"as a whole","zh":"作为整体；总体上","ex":"The reform benefited the economy as a whole.","cn":"改革使整体经济受益。"},{"en":"over time","zh":"随着时间推移","ex":"Public attitudes can change over time.","cn":"公众态度会随时间变化。"},{"en":"in the long run","zh":"从长远来看","ex":"In the long run, early investment can reduce costs.","cn":"从长远来看，早期投资可以降低成本。"},{"en":"in the short run","zh":"从短期来看","ex":"In the short run, the policy may increase prices.","cn":"从短期来看，这项政策可能推高价格。"},{"en":"for the time being","zh":"暂时；目前","ex":"For the time being, the old rules remain in force.","cn":"目前，旧规定仍然有效。"},{"en":"as things stand","zh":"按照目前情况","ex":"As things stand, the committee has no majority.","cn":"按照目前的情况，委员会没有获得多数支持。"},{"en":"as it stands","zh":"按现状来看","ex":"As it stands, the proposal lacks adequate funding.","cn":"就目前而言，这项提案缺乏足够资金。"},{"en":"up to a point","zh":"在某种程度上；有限度地","ex":"I agree with the argument up to a point.","cn":"我在一定程度上赞同这一论点。"},{"en":"so far","zh":"迄今为止；到目前为止","ex":"So far, no study has confirmed the claim.","cn":"到目前为止，没有研究证实这种说法。"},{"en":"up to now","zh":"直到现在","ex":"Up to now, funding has come entirely from donations.","cn":"迄今为止，资金全部来自捐赠。"},{"en":"by far","zh":"远远地；……得多","ex":"This was by far the strongest result in the survey.","cn":"这是这项调查中迄今最有力的结果。"},{"en":"far and away","zh":"远远；绝对地","ex":"This is far and away the most expensive option.","cn":"这是目前最昂贵的选择。"},{"en":"to a degree","zh":"在一定程度上","ex":"The criticism is justified to a degree.","cn":"这种批评在某种程度上是合理的。"},{"en":"in part","zh":"部分地","ex":"The rise in costs is due in part to higher wages.","cn":"成本上升部分是由于工资上涨。"},{"en":"in general","zh":"总体上；一般而言","ex":"In general, firms prefer predictable regulations.","cn":"总体而言，企业更喜欢可预测的监管规定。"},{"en":"in principle","zh":"原则上；理论上","ex":"In principle, the government supports the reform.","cn":"原则上，政府支持改革。"},{"en":"in practice","zh":"实际上；在实践中","ex":"In practice, the rule is difficult to enforce.","cn":"在实际操作中，这项规定难以执行。"},{"en":"generally speaking","zh":"一般而言","ex":"Generally speaking, the findings support the original theory.","cn":"总体来说，研究结果支持最初的理论。"},{"en":"strictly speaking","zh":"严格说来","ex":"Strictly speaking, the measure is a fee rather than a tax.","cn":"严格来说，这项措施是收费，而不是税收。"},{"en":"roughly speaking","zh":"大致说来","ex":"Roughly speaking, the project will take another year.","cn":"粗略估计，这个项目还需要一年。"},{"en":"in other words","zh":"换句话说","ex":"The policy shifts costs to users; in other words, taxpayers pay less.","cn":"这项政策将成本转嫁给使用者；换句话说，纳税人支付得更少。"},{"en":"that is to say","zh":"也就是说","ex":"The evidence is inconclusive, that is to say, no firm conclusion is possible.","cn":"证据尚无定论，也就是说，还无法得出明确结论。"},{"en":"namely","zh":"即；也就是","ex":"Only two groups benefited, namely students and retirees.","cn":"只有两个群体受益，即学生和退休人员。"},{"en":"put differently","zh":"换一种说法","ex":"Put differently, the policy treats unequal situations as if they were equal.","cn":"换种说法，这项政策把不平等的情况当作平等情况处理。"},{"en":"to put it simply","zh":"简单来说","ex":"To put it simply, higher prices discourage demand.","cn":"简单来说，价格上涨会抑制需求。"},{"en":"first and foremost","zh":"首要的是","ex":"First and foremost, the government must restore public trust.","cn":"首先也是最重要的，政府必须恢复公众信任。"},{"en":"not least because ...","zh":"尤其是因为……","ex":"The change matters, not least because millions depend on the service.","cn":"这一变化很重要，尤其是因为数百万人依赖这项服务。"},{"en":"not least among ...","zh":"在……中尤其值得注意的","ex":"Several concerns were raised, not least among them the cost of enforcement.","cn":"人们提出了好几个担忧，其中尤其包括执行成本。"},{"en":"all the same","zh":"尽管如此；仍然","ex":"The evidence is limited; all the same, it deserves attention.","cn":"证据有限，但即便如此，它仍值得关注。"},{"en":"all too ...","zh":"过于……（常含负面评价）","ex":"Such errors are all too common in rushed reports.","cn":"仓促撰写的报告中，这类错误太常见了。"},{"en":"far too ...","zh":"太……；过于……","ex":"The estimate is far too optimistic.","cn":"这一估计过于乐观。"},{"en":"only too ...","zh":"非常……；十分……","ex":"The committee was only too willing to accept the proposal.","cn":"委员会非常愿意接受这项提议。"},{"en":"too ... to ...","zh":"太……以至于不能……","ex":"The sample was too small to support a firm conclusion.","cn":"样本量太小，无法支持确定的结论。"},{"en":"cannot ... too ...","zh":"无论怎样……也不过分","ex":"We cannot be too careful when handling personal data.","cn":"处理个人数据时，我们再谨慎也不为过。"},{"en":"a number of ...","zh":"若干；许多……","ex":"A number of studies have questioned the claim.","cn":"多项研究质疑了这种说法。"},{"en":"the number of ...","zh":"……的数量","ex":"The number of applicants increased sharply.","cn":"申请人数急剧增加。"},{"en":"a majority of ...","zh":"……的大多数","ex":"A majority of respondents favored reform.","cn":"大多数受访者支持改革。"},{"en":"the vast majority of ...","zh":"……的绝大多数","ex":"The vast majority of participants completed the survey.","cn":"绝大多数参与者完成了调查。"},{"en":"a minority of ...","zh":"……中的少数","ex":"A minority of firms opposed the changes.","cn":"少数企业反对这些变化。"},{"en":"relatively few ...","zh":"相对少数的……","ex":"Relatively few students reported serious difficulties.","cn":"报告遇到严重困难的学生相对较少。"},{"en":"hardly any ...","zh":"几乎没有……","ex":"Hardly any evidence supports the allegation.","cn":"几乎没有证据支持这一指控。"},{"en":"few if any ...","zh":"即使有也寥寥无几","ex":"Few if any of the proposed measures address the main problem.","cn":"拟议中的措施几乎没有任何一项能够解决主要问题。"},{"en":"some but not all ...","zh":"一部分但并非全部……","ex":"Some but not all of the findings were replicated.","cn":"部分研究结果得到了重复验证，但并非全部。"},{"en":"not all ...","zh":"并非所有……","ex":"Not all experts agree with the conclusion.","cn":"并非所有专家都同意这一结论。"},{"en":"all too often","zh":"太过频繁地","ex":"All too often, small problems are ignored until they become crises.","cn":"小问题经常被忽略，直到演变成危机。"},{"en":"more than one ...","zh":"不止一个……","ex":"More than one explanation is consistent with the data.","cn":"不止一种解释与数据相符。"},{"en":"at least some ...","zh":"至少有一部分……","ex":"At least some of the decline is due to higher costs.","cn":"这种下降至少有一部分是由成本上升造成的。"},{"en":"no more than a few","zh":"仅仅几个","ex":"No more than a few participants withdrew.","cn":"退出的参与者至多只有几个人。"},{"en":"the former","zh":"前者","ex":"The former approach is cheaper but less reliable.","cn":"前一种方法更便宜，但可靠性较低。"},{"en":"the latter","zh":"后者","ex":"The latter option would require new legislation.","cn":"后一种选择需要制定新的法律。"},{"en":"respectively","zh":"分别地；依次对应地","ex":"The two groups scored 70 and 80 points, respectively.","cn":"两个小组分别得了70分和80分。"},{"en":"vice versa","zh":"反过来也一样","ex":"Higher costs may cause lower demand, and vice versa.","cn":"成本增加可能导致需求下降，反之亦然。"},{"en":"one another","zh":"彼此；相互","ex":"The two institutions depend on one another.","cn":"这两家机构相互依赖。"},{"en":"each other","zh":"彼此；相互","ex":"The researchers checked each other's calculations.","cn":"研究人员互相核对了计算结果。"},{"en":"whether or not ...","zh":"无论是否……；是否……","ex":"Whether or not the policy succeeds, its costs must be monitored.","cn":"无论这项政策是否成功，都必须监测其成本。"},{"en":"whether ... or ...","zh":"是……还是……","ex":"The committee will decide whether to proceed or to delay.","cn":"委员会将决定继续推进还是推迟。"},{"en":"as if ...","zh":"仿佛……；好像……","ex":"The report treats the claim as if it were already proven.","cn":"报告把这种说法当作已经得到证实的事实。"},{"en":"as though ...","zh":"仿佛……","ex":"She spoke as though the problem had been solved.","cn":"她讲话的语气仿佛问题已经解决。"},{"en":"as far as ... is concerned","zh":"就……而言","ex":"As far as public health is concerned, the benefits are clear.","cn":"就公共卫生而言，益处十分明显。"},{"en":"so far as ...","zh":"就……而言；只要……","ex":"So far as the available evidence shows, the treatment is safe.","cn":"根据目前掌握的证据，这种治疗是安全的。"},{"en":"as much as ...","zh":"多达……；尽管……（依语境）","ex":"As much as I respect the author, I disagree with the conclusion.","cn":"尽管我非常尊重作者，但我不同意这个结论。"},{"en":"as many as ...","zh":"多达……（修饰可数数量）","ex":"As many as 200 households may be affected.","cn":"多达200户家庭可能受到影响。"},{"en":"upwards of ...","zh":"超过……；……以上","ex":"The program received upwards of 1,000 applications.","cn":"该项目收到了超过1000份申请。"},{"en":"no fewer than ...","zh":"不少于……（可数）","ex":"No fewer than ten committees reviewed the bill.","cn":"审查该法案的委员会不少于十个。"},{"en":"no greater than ...","zh":"不大于……","ex":"The additional cost is no greater than five dollars.","cn":"额外费用不超过五美元。"},{"en":"less than certain","zh":"并不确定","ex":"The long-term effects remain less than certain.","cn":"长期影响仍然远不能确定。"},{"en":"anything like ...","zh":"接近……；像……（常用于否定）","ex":"The estimates are not anything like the final figures.","cn":"估计值与最终数字相差很大。"},{"en":"nothing like ...","zh":"完全不像……；远不及……","ex":"The current system is nothing like its predecessor.","cn":"现行制度与前任制度完全不同。"},{"en":"nothing other than ...","zh":"无非就是……","ex":"The proposal offers nothing other than a temporary fix.","cn":"这项提议除了暂时解决问题外别无其他作用。"},{"en":"none other than ...","zh":"正是……；不是别人而是……","ex":"The person responsible was none other than the project director.","cn":"负责人不是别人，正是项目主任。"},{"en":"the very ...","zh":"正是那个……；恰恰是……","ex":"This is the very assumption that the study challenges.","cn":"这正是该研究所质疑的假设。"},{"en":"the mere fact that ...","zh":"仅仅……这一事实","ex":"The mere fact that costs fell does not prove the reform worked.","cn":"成本下降这一事实本身并不能证明改革有效。"},{"en":"the extent to which ...","zh":"……的程度","ex":"The survey examined the extent to which attitudes had changed.","cn":"调查考察了人们态度变化的程度。"},{"en":"the degree to which ...","zh":"……的程度","ex":"Researchers measured the degree to which trust had declined.","cn":"研究人员测量了信任度下降的程度。"},{"en":"the extent of ...","zh":"……的范围；程度","ex":"The report underestimated the extent of the damage.","cn":"报告低估了损害的程度。"},{"en":"the nature of ...","zh":"……的性质","ex":"The nature of the problem remains disputed.","cn":"这一问题的性质仍有争议。"},{"en":"the implications of ...","zh":"……的含义；潜在影响","ex":"The implications of the ruling extend beyond one industry.","cn":"这一裁决的影响超出了单一行业。"},{"en":"the consequences of ...","zh":"……的后果","ex":"The consequences of the decision were unexpected.","cn":"这一决定的后果出乎意料。"},{"en":"the absence of ...","zh":"……的缺失","ex":"The absence of evidence does not settle the question.","cn":"缺乏证据并不能解决这个问题。"},{"en":"the presence of ...","zh":"……的存在","ex":"The presence of a control group improved the study.","cn":"设置对照组提高了研究质量。"},{"en":"the prospect of ...","zh":"……的可能性；前景","ex":"The prospect of higher taxes worried local firms.","cn":"税收可能上涨的前景使当地企业担忧。"},{"en":"the likelihood of ...","zh":"……发生的可能性","ex":"The likelihood of a delay increased after the vote.","cn":"投票后，发生延误的可能性增大。"},{"en":"the risk of ...","zh":"……的风险","ex":"The risk of unemployment is higher among younger workers.","cn":"年轻工人面临更高的失业风险。"},{"en":"the reason why ...","zh":"……的原因","ex":"The report explains the reason why prices increased.","cn":"报告解释了价格上涨的原因。"},{"en":"the fact that ...","zh":"……这一事实（通常作事实性表述）","ex":"The fact that prices fell does not prove the policy worked.","cn":"价格下降这一事实并不能证明政策有效。"},{"en":"the claim that ...","zh":"声称……的说法（不保证属实）","ex":"The claim that the treatment is effective remains disputed.","cn":"有关这种治疗有效的说法仍有争议。"},{"en":"the assumption that ...","zh":"……这一假设","ex":"The assumption that all firms behave alike is questionable.","cn":"所有企业行为都相同这一假设值得怀疑。"},{"en":"the suggestion that ...","zh":"……的建议／……这一暗示（依语境）","ex":"The suggestion that the rule is unnecessary drew criticism.","cn":"认为这项规定没有必要的建议招致批评。"},{"en":"the notion that ...","zh":"……这一观念","ex":"The notion that more information always helps is misleading.","cn":"认为更多信息总是有帮助的观念具有误导性。"},{"en":"the belief that ...","zh":"认为……的信念","ex":"The belief that markets always correct themselves has been challenged.","cn":"市场总能自行纠正问题的信念受到了质疑。"},{"en":"the argument that ...","zh":"主张……的论点","ex":"The argument that costs will fall needs more evidence.","cn":"成本会下降的论点还需要更多证据。"},{"en":"the possibility that ...","zh":"……的可能性","ex":"The committee considered the possibility that the data were incomplete.","cn":"委员会考虑了数据可能不完整的情况。"},{"en":"the evidence that ...","zh":"……的证据（或表明……的证据）","ex":"The evidence that pollution harms health is substantial.","cn":"污染损害健康的证据相当充分。"},{"en":"there is no guarantee that ...","zh":"不能保证……","ex":"There is no guarantee that the investment will pay off.","cn":"无法保证这项投资一定会获得回报。"},{"en":"there is no indication that ...","zh":"没有迹象表明……","ex":"There is no indication that the report was altered.","cn":"没有迹象表明这份报告遭到篡改。"},{"en":"there is little doubt that ...","zh":"几乎可以肯定……","ex":"There is little doubt that the regulation affected demand.","cn":"几乎可以肯定，这项法规影响了需求。"},{"en":"it does not follow that ...","zh":"这并不意味着……；不能由此推断……","ex":"Prices fell, but it does not follow that the reform caused the decline.","cn":"价格下降了，但这并不意味着改革造成了这次下降。"},{"en":"it is not the case that ...","zh":"……并非事实","ex":"It is not the case that every firm benefited from the policy.","cn":"并非每家企业都从这项政策中受益。"},{"en":"it is far from clear whether ...","zh":"是否……远不明确","ex":"It is far from clear whether the intervention will succeed.","cn":"目前远不清楚这项干预是否会成功。"},{"en":"it remains to be seen whether ...","zh":"是否……还有待观察","ex":"It remains to be seen whether the costs will decline.","cn":"成本是否会下降还有待观察。"},{"en":"it is worth noting that ...","zh":"值得注意的是……","ex":"It is worth noting that the study used a small sample.","cn":"值得注意的是，这项研究采用了小样本。"},{"en":"it should be noted that ...","zh":"应当指出……","ex":"It should be noted that these figures are he pattern is consistent with several competing explanations.","cn":"这一模式与好几种相互竞争的解释相符。"},{"en":"does not rule out ...","zh":"并未排除……的可能性","ex":"The result does not rule out other causes.","cn":"这一结果没有排除其他原因。"},{"en":"cannot be ruled out","zh":"不能排除","ex":"A measurement error cannot be ruled out.","cn":"不能排除测量误差的可能性。"},{"en":"is open to doubt","zh":"值得怀疑；尚存疑问","ex":"The accuracy of the estimate is open to doubt.","cn":"估计值的准确性值得怀疑。"},{"en":"falls short of proving ...","zh":"不足以证明……","ex":"This comparison falls short of proving a causal link.","cn":"这种比较不足以证明因果联系。"},{"en":"does not establish that ...","zh":"未能证实……","ex":"The study does not establish that the policy caused the decline.","cn":"研究并未证实是该政策造成了下降。"},{"en":"suggests but does not prove ...","zh":"提示……，但不能证明","ex":"The evidence suggests but does not prove a link between the two factors.","cn":"证据提示两项因素之间可能有关联，但尚未证明这种联系。"},{"en":"is subject to interpretation","zh":"可以有不同解释","ex":"The meaning of the response is subject to interpretation.","cn":"这一回应的含义有待解释。"},{"en":"should not be interpreted as ...","zh":"不应被解释为……","ex":"The committee's silence should not be interpreted as approval.","cn":"委员会的沉默不应被解释为赞同。"},{"en":"should not be confused with ...","zh":"不应与……混淆","ex":"Correlation should not be confused with causation.","cn":"不应混淆相关关系与因果关系。"},{"en":"is often mistaken for ...","zh":"经常被误认为……","ex":"Confidence is often mistaken for competence.","cn":"自信常常被误认为能力。"},{"en":"is taken for granted","zh":"被视为理所当然","ex":"The stability of the system is often taken for granted.","cn":"人们经常把系统的稳定性视为理所当然。"},{"en":"does not necessarily mean ...","zh":"不必然意味着……","ex":"A rise in complaints does not necessarily mean that services worsened.","cn":"投诉增加并不必然意味着服务变差。"},{"en":"does not imply that ...","zh":"并不意味着……","ex":"Rejecting the proposal does not imply that the old system is effective.","cn":"拒绝提案并不意味着旧制度有效。"},{"en":"implies the opposite","zh":"意味着相反的情况","ex":"The new evidence implies the opposite of what critics claimed.","cn":"新证据所暗示的结论与批评者的说法相反。"},{"en":"is a necessary condition for ...","zh":"是……的必要条件","ex":"Reliable data are a necessary condition for sound policy.","cn":"可靠数据是制定合理政策的必要条件。"},{"en":"is a sufficient condition for ...","zh":"是……的充分条件","ex":"This requirement alone is not a sufficient condition for success.","cn":"仅有这一要求并不足以保证成功。"},{"en":"is necessary but not sufficient","zh":"必要但不充分","ex":"Funding is necessary but not sufficient for better education.","cn":"资金是改善教育的必要条件，但不是充分条件。"},{"en":"correlation does not imply causation","zh":"相关不代表因果","ex":"Researchers warned that correlation does not imply causation.","cn":"研究人员警告说，相关关系不代表因果关系。"},{"en":"absence of evidence is not evidence of absence","zh":"缺乏证据不等于证明不存在","ex":"In science, absence of evidence is not evidence of absence.","cn":"在科学研究中，缺乏证据不等于有证据证明某事不存在。"},{"en":"people's impression of the Victorians","zh":"人们对维多利亚人的印象","ex":"The article examines people's impression of the Victorians.","cn":"文章探讨了人们对维多利亚人的印象。"},{"en":"the Victorians' impression of others","zh":"维多利亚人对其他人的印象","ex":"The discussion focused on the Victorians' impression of others.","cn":"讨论重点是维多利亚人对其他人的印象。"},{"en":"the Victorians' notion of public image","zh":"维多利亚人对公众形象的观念","ex":"The discussion focused on the Victorians' notion of public image.","cn":"讨论重点是维多利亚人对公众形象的观念。"},{"en":"the public's perception of science","zh":"公众对科学的看法","ex":"The discussion focused on the public's perception of science.","cn":"讨论重点是公众对科学的看法。"},{"en":"scientists' perception of the public","zh":"科学家对公众的看法","ex":"The article examines scientists' perception of the public.","cn":"文章探讨了科学家对公众的看法。"},{"en":"the public's criticism of the government","zh":"公众对政府的批评","ex":"The article examines the public's criticism of the government.","cn":"文章探讨了公众对政府的批评。"},{"en":"the government's criticism of the public","zh":"政府对公众的批评","ex":"The article examines the government's criticism of the public.","cn":"文章探讨了政府对公众的批评。"},{"en":"the public's rejection of the proposal","zh":"公众对该提案的拒绝","ex":"The article examines the public's rejection of the proposal.","cn":"文章探讨了公众对该提案的拒绝。"},{"en":"the proposal's rejection by the public","zh":"该提案遭到公众拒绝","ex":"The article examines the proposal's rejection by the public.","cn":"文章探讨了该提案遭公众拒绝的情况。"},{"en":"the committee's rejection of the proposal","zh":"委员会否决该提案","ex":"The article examines the committee's rejection of the proposal.","cn":"文章探讨了委员会拒绝该提案一事。"},{"en":"the proposal's rejection by the committee","zh":"提案被委员会否决","ex":"The article examines the proposal's rejection by the committee.","cn":"文章探讨了该提案遭委员会拒绝的情况。"},{"en":"the author challenges the claim","zh":"作者质疑这种说法","ex":"The author challenges the claim that the reform has succeeded.","cn":"作者质疑改革已经成功的说法。"},{"en":"the author advances the claim","zh":"作者提出这种主张","ex":"The author advances the claim that the old rules are outdated.","cn":"作者提出了旧规定已经过时的主张。"},{"en":"the author endorses the claim","zh":"作者支持这种说法","ex":"The author endorses the claim that early intervention helps.","cn":"作者赞同早期干预有帮助的说法。"},{"en":"the author dismisses the claim","zh":"作者否定／不予理会这种说法","ex":"The author dismisses the claim as unsupported by evidence.","cn":"作者以缺乏证据支持为由驳回了这一说法。"},{"en":"the author qualifies the claim","zh":"作者对该说法作出限定","ex":"The author qualifies the claim by noting several exceptions.","cn":"作者通过指出几个例外，对这一主张作出限定。"},{"en":"the author concedes the point","zh":"作者承认这一点","ex":"The author concedes the point but rejects the overall conclusion.","cn":"作者承认这一点，但拒绝接受总体结论。"},{"en":"the author questions the evidence","zh":"作者质疑这些证据","ex":"The author questions the evidence used to support the policy.","cn":"作者质疑用来支持这项政策的证据。"},{"en":"the author accepts the evidence","zh":"作者认可这些证据","ex":"The author accepts the evidence but disputes the interpretation.","cn":"作者接受证据，但对其解释有异议。"},{"en":"the author attributes A to B","zh":"作者将 A 归因于 B","ex":"The author attributes the decline to a shortage of funding.","cn":"作者将这种下降归因于资金短缺。"},{"en":"the author distinguishes A from B","zh":"作者区分 A 和 B","ex":"The author dist
