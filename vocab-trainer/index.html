nd:#f2f8f7;color:#638681}.mini-action.on{background:#dcf8ed;color:#008c7a}.mini-action.gold.on{background:#fff5dc;color:#af7a0a}.swipe-hint{display:flex;justify-content:center;gap:20px;padding:7px;color:#99acaa;font-size:12px}.empty{padding:45px 21px;text-align:center;line-height:1.8;color:#7b9391}.empty .empty-icon{font-size:42px;margin-bottom:13px}.list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 3px 16px}.list-head h2{margin:0;font-size:23px}.list-head small{color:#849a99}.list-item{display:flex;background:#fff;border:1px solid #edf1f0;align-items:center;border-radius:15px;padding:13px 11px;margin-bottom:9px;gap:11px}.item-main{border:0;text-align:left;background:transparent;flex:1;min-width:0}.item-main strong{display:block;font-size:15px;overflow-wrap:anywhere}.item-main small{display:block;font-size:12px;color:#8da0a0;margin-top:5px;overflow-wrap:anywhere;line-height:1.45}.small-button{border:1px solid #deeeee;border-radius:12px;padding:9px 11px;color:#1a9688;background:#effaf7;font-size:12px;white-space:nowrap}.detail-hero{margin-top:12px;background:radial-gradient(circle at 90% 10%,#d2fff0,transparent 58%),linear-gradient(140deg,#f3fffb,#fffaf3);border-radius:23px;padding:27px 23px 20px;min-height:195px;display:flex;flex-direction:column;justify-content:center}.detail-hero h2{margin:0 0 11px;font-size:31px;line-height:1.25;overflow-wrap:anywhere}.detail-hero .detail-mini{color:#71938c;font-size:12px;margin-bottom:9px}.detail-hero p{font-size:16px;line-height:1.75;font-weight:600;margin:0}.detail-example{margin-top:15px;padding:20px 21px}.detail-example h3{font-size:14px;margin:0 0 14px}.detail-example .en-ex{font-size:17px;line-height:1.8;color:#234746;font-weight:550}.detail-example .cn-ex{margin-top:12px;font-size:14px;line-height:1.8;color:#76898b}.detail-tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.tool-button{border:1px solid #d9efeb;background:#fff;border-radius:15px;min-height:49 <script>
'use strict';
const WORDS=[{"en":"challenge (a claim)","zh":"质疑某种说法；对其正确性提出异议","ex":"The researcher challenged the claim that the policy had reduced costs.","cn":"这位研究人员质疑了该政策降低成本的说法。"},{"en":"direct (attention)","zh":"把注意力引向……","ex":"The article directs readers' attention to the costs of reform.","cn":"这篇文章将读者的注意力引向改革的成本。"},{"en":"address (a problem)","zh":"处理、解决某个问题","ex":"The new policy seeks to address the problem of rising rents.","cn":"新政策旨在解决房租上涨的问题。"},{"en":"address (an audience)","zh":"向听众发表讲话","ex":"The scientist addressed an audience of students and journalists.","cn":"这位科学家向学生和记者组成的听众发表了讲话。"},{"en":"advance (an argument)","zh":"提出一个论点","ex":"The author advances an argument for stronger consumer protection.","cn":"作者提出了一个主张加强消费者保护的论点。"},{"en":"account (n.)","zh":"解释；叙述；账户","ex":"Her account of the incident differs from the official report.","cn":"她对事件的叙述与官方报告不同。"},{"en":"acknowledge (a fact)","zh":"承认某个事实","ex":"The minister acknowledged the fact that the policy had failed.","cn":"部长承认该政策已经失败。"},{"en":"act (on advice)","zh":"按照建议采取行动","ex":"The company acted on expert advice before changing its strategy.","cn":"公司在调整战略前听取了专家建议。"},{"en":"approach (n.)","zh":"方法；处理问题的途径","ex":"This approach to education focuses on students' needs.","cn":"这种教育方法关注学生的需求。"},{"en":"assume (responsibility)","zh":"承担责任","ex":"Local authorities must assume responsibility for the repairs.","cn":"地方当局必须承担维修责任。"},{"en":"assume (that ...)","zh":"假定……为真","ex":"We cannot assume that higher spending always produces better outcomes.","cn":"我们不能假定支出增加总会带来更好的结果。"},{"en":"admit (an error)","zh":"承认错误","ex":"The agency admitted an error in its calculations.","cn":"该机构承认其计算存在错误。"},{"en":"afford (an opportunity)","zh":"提供一个机会","ex":"Online courses afford students an opportunity to learn at home.","cn":"在线课程为学生提供了在家学习的机会。"},{"en":"apply (to ...)","zh":"适用于……","ex":"These safety rules apply to every factory in the region.","cn":"这些安全规定适用于该地区的每一家工厂。"},{"en":"appreciate (a distinction)","zh":"理解某种区别","ex":"Readers must appreciate the distinction between correlation and causation.","cn":"读者必须理解相关关系与因果关系的区别。"},{"en":"argue (that ...)","zh":"主张；论证说……","ex":"The researchers argue that the evidence remains inconclusive.","cn":"研究人员认为，现有证据尚不足以下定论。"},{"en":"arrest (a decline)","zh":"遏制下降趋势","ex":"New investment helped arrest the decline in local employment.","cn":"新投资有助于遏制当地就业人数下降。"},{"en":"associate (A with B)","zh":"把 A 与 B 联系起来","ex":"Many people associate economic growth with greater prosperity.","cn":"许多人把经济增长与更加繁荣联系起来。"},{"en":"attribute (A to B)","zh":"把 A 归因于 B","ex":"The report attributes the decline in sales to higher prices.","cn":"报告将销售额下降归因于价格上涨。"},{"en":"back (a proposal)","zh":"支持一项提案","ex":"Several lawmakers backed the proposal to expand public transport.","cn":"几名议员支持扩大公共交通的提案。"},{"en":"balance (interests)","zh":"平衡各方利益","ex":"Regulators must balance the interests of firms and consumers.","cn":"监管机构必须平衡企业与消费者的利益。"},{"en":"bear (the cost)","zh":"承担成本","ex":"Small businesses may bear the cost of the new requirements.","cn":"小企业可能需要承担新要求带来的成本。"},{"en":"beat (expectations)","zh":"超过预期","ex":"The latest employment figures beat expectations.","cn":"最新就业数据超出了预期。"},{"en":"become (someone)","zh":"适合某人；与某人相称（较正式）","ex":"The formal style of the speech did not become the young speaker.","cn":"正式的演讲风格并不适合这位年轻演讲者。"},{"en":"bid (n.)","zh":"努力争取；企图；出价","ex":"The firm's bid to enter the market ultimately failed.","cn":"该公司进入市场的努力最终失败了。"},{"en":"bill (n.)","zh":"法案草案；账单","ex":"Parliament debated a bill to improve consumer protection.","cn":"议会就一项旨在加强消费者保护的法案展开辩论。"},{"en":"blame (A for B)","zh":"因 B 而责怪 A","ex":"The manager blamed workers for the delay.","cn":"经理将延误归咎于工人。"},{"en":"block (reform)","zh":"阻碍改革","ex":"Political opposition blocked reform for several years.","cn":"政治反对力量阻碍改革长达数年。"},{"en":"break (a pattern)","zh":"打破一种模式","ex":"The new findings break the pattern observed in earlier studies.","cn":"新发现打破了早期研究观察到的规律。"},{"en":"brief (v.)","zh":"向某人简要介绍情况","ex":"Officials briefed reporters on the court's decision.","cn":"官员向记者简要介绍了法院的裁决。"},{"en":"broad (support)","zh":"广泛的支持","ex":"The policy enjoyed broad support among younger voters.","cn":"该政策获得了年轻选民的广泛支持。"},{"en":"budget (n.)","zh":"预算；经费","ex":"The school reduced its budget for building repairs.","cn":"学校削减了建筑维修预算。"},{"en":"buy (an argument)","zh":"接受、相信某种论点（口语）","ex":"Not everyone buys the argument that higher prices improve quality.","cn":"并非所有人都接受涨价能提高质量的论点。"},{"en":"capital (n.)","zh":"资本；首都；大写字母","ex":"The business struggled to attract enough capital to expand.","cn":"这家企业难以筹集足够的扩张资本。"},{"en":"capture (the essence)","zh":"抓住本质","ex":"The summary captures the essence of the author's argument.","cn":"这份摘要抓住了作者论证的核心。"},{"en":"case (n.)","zh":"情况；事例；论据；案件","ex":"The author makes a strong case for reform.","cn":"作者为改革提出了有力的论据。"},{"en":"cast (doubt on)","zh":"使……受到怀疑","ex":"The new evidence casts doubt on the original conclusion.","cn":"新证据使原先的结论受到质疑。"},{"en":"cause (n.)","zh":"原因；事业；主张","ex":"Scientists have not yet identified the cause of the decline.","cn":"科学家尚未确定这种下降的原因。"},{"en":"charge (n.)","zh":"费用；指控；职责","ex":"The service introduced an additional charge for delivery.","cn":"该服务新增了配送费用。"},{"en":"claim (v.)","zh":"声称；主张；索取","ex":"The company claims that its new system is safer.","cn":"公司声称其新系统更加安全。"},{"en":"class (n.)","zh":"阶层；类别","ex":"The reform affected the country's growing middle class.","cn":"改革影响了该国不断壮大的中产阶层。"},{"en":"clear (v.)","zh":"清除；批准；澄清","ex":"Regulators cleared the merger after reviewing the evidence.","cn":"监管机构审查证据后批准了此次合并。"},{"en":"close (adj.)","zh":"接近的；亲密的","ex":"The two studies reached remarkably close conclusions.","cn":"两项研究得出了非常接近的结论。"},{"en":"collapse (of confidence)","zh":"信心崩溃","ex":"The scandal triggered a collapse of confidence in the regulator.","cn":"这起丑闻引发了公众对监管机构的信任危机。"},{"en":"command (respect)","zh":"赢得尊重","ex":"Her careful research commands respect even among critics.","cn":"即使批评者也尊重她严谨的研究。"},{"en":"commit (to reform)","zh":"致力于改革；作出承诺","ex":"The government committed to reform despite strong opposition.","cn":"尽管遭遇强烈反对，政府仍承诺推进改革。"},{"en":"common (ground)","zh":"共同基础；共识","ex":"Both sides found common ground on consumer safety.","cn":"双方在消费者安全问题上找到了共同立场。"},{"en":"complex (n.)","zh":"综合体；情结","ex":"The city developed a new research complex near the university.","cn":"该市在大学附近建造了一座新的科研综合体。"},{"en":"compound (a problem)","zh":"加剧一个问题","ex":"Rising energy costs compounded the problem of weak demand.","cn":"能源成本上升加剧了需求疲软的问题。"},{"en":"concede (a point)","zh":"承认某一点；让步","ex":"The author concedes the point before challenging the broader claim.","cn":"作者先承认这一点，再质疑更广泛的主张。"},{"en":"concern (v.)","zh":"涉及；关系到","ex":"These changes concern everyone who uses public transport.","cn":"这些变化关系到每一位公共交通使用者。"},{"en":"concern (n.)","zh":"关注；担忧；利益关系","ex":"Public concern about privacy has increased.","cn":"公众对隐私问题的担忧有所增加。"},{"en":"conduct (a study)","zh":"开展研究","ex":"The team conducted a study of household spending.","cn":"该团队开展了一项家庭支出研究。"},{"en":"confront (a challenge)","zh":"面对挑战","ex":"Local schools confront a challenge in recruiting teachers.","cn":"当地学校在招聘教师方面面临挑战。"},{"en":"consequence (n.)","zh":"后果；影响","ex":"One consequence of the decision was higher operating costs.","cn":"这一决定的一个后果是运营成本上升。"},{"en":"considerable (adj.)","zh":"相当大的；可观的","ex":"The proposal attracted considerable public attention.","cn":"该提案引起了公众的广泛关注。"},{"en":"consistent (with ...)","zh":"与……一致","ex":"These results are consistent with the earlier findings.","cn":"这些结果与早期研究发现一致。"},{"en":"constitute (a threat)","zh":"构成威胁","ex":"A loss of funding could constitute a threat to the project.","cn":"资金减少可能对该项目构成威胁。"},{"en":"consult (sources)","zh":"查阅资料","ex":"The author consulted several sources before writing the report.","cn":"作者撰写报告前查阅了多份资料。"},{"en":"contest (a claim)","zh":"对某种主张提出异议","ex":"Several experts contested the claim that the treatment was ineffective.","cn":"几位专家对治疗无效的说法提出异议。"},{"en":"contract (v.)","zh":"收缩；签订合同","ex":"The local economy contracted during the recession.","cn":"当地经济在衰退期间出现收缩。"},{"en":"contrast (A with B)","zh":"将 A 与 B 对照","ex":"The paper contrasts urban poverty with rural poverty.","cn":"论文将城市贫困与农村贫困进行了对比。"},{"en":"contribute (to ...)","zh":"促成……；有助于……","ex":"Higher housing costs contribute to rising inequality.","cn":"住房成本上涨助长了不平等程度加剧。"},{"en":"conventional (wisdom)","zh":"传统看法；普遍接受的观点","ex":"The findings challenge the conventional wisdom about productivity.","cn":"这些发现挑战了有关生产率的传统看法。"},{"en":"convince (someone)","zh":"使某人信服","ex":"The evidence convinced the committee to reconsider its position.","cn":"证据说服委员会重新考虑其立场。"},{"en":"copy (a practice)","zh":"效仿一种做法","ex":"Other cities began to copy the practice.","cn":"其他城市开始效仿这种做法。"},{"en":"count (v.)","zh":"重要；算数；计数","ex":"In this debate, the quality of evidence counts more than quantity.","cn":"在这场辩论中，证据的质量比数量更重要。"},{"en":"counter (an argument)","zh":"反驳一个论点","ex":"The economist countered the argument with new data.","cn":"经济学家用新数据反驳了这一论点。"},{"en":"cover (an issue)","zh":"涉及、报道某个议题","ex":"The report covers the issue of public spending.","cn":"报告涉及公共支出问题。"},{"en":"credit (A with B)","zh":"认为 A 具有 B 功劳","ex":"The report credits volunteers with saving the library.","cn":"报告认为志愿者挽救图书馆功不可没。"},{"en":"critical (to ...)","zh":"对……至关重要","ex":"Public trust is critical to the success of the program.","cn":"公众信任对该项目的成功至关重要。"},{"en":"critical (of ...)","zh":"批评……的","ex":"The judge was critical of the agency's decision.","cn":"法官对该机构的决定持批评态度。"},{"en":"cure (a problem)","zh":"解决问题；治愈疾病","ex":"A temporary subsidy will not cure the underlying problem.","cn":"临时补贴无法解决根本问题。"},{"en":"current (policy)","zh":"现行政策","ex":"The current policy leaves many workers unprotected.","cn":"现行政策使许多工人缺乏保障。"},{"en":"cut (spending)","zh":"削减开支","ex":"The council cut spending on maintenance.","cn":"委员会削减了维护方面的支出。"},{"en":"deal (with ...)","zh":"处理……；应对……","ex":"The committee must deal with the complaints promptly.","cn":"委员会必须及时处理投诉。"},{"en":"debate (n.)","zh":"争论；辩论","ex":"The proposal sparked a heated debate about privacy.","cn":"这项提议引发了关于隐私的激烈辩论。"},{"en":"decline (v.)","zh":"下降；婉拒","ex":"The company declined to comment on the allegations.","cn":"公司拒绝就这些指控发表评论。"},{"en":"defend (a position)","zh":"维护某种立场","ex":"The minister defended her position during the hearing.","cn":"部长在听证会上为自己的立场辩护。"},{"en":"deliver (results)","zh":"取得预期成果","ex":"The reform has yet to deliver the promised results.","cn":"改革尚未取得承诺的成果。"},{"en":"demand (v.)","zh":"要求；需要","ex":"This complex task demands careful attention.","cn":"这项复杂任务需要认真细致地处理。"},{"en":"demonstrate (that ...)","zh":"表明；证明……","ex":"The study demonstrates that early intervention can help.","cn":"研究表明，早期干预可能有帮助。"},{"en":"deny (a claim)","zh":"否认某种说法","ex":"The firm denied the claim that it had misused data.","cn":"该公司否认曾滥用数据的指控。"},{"en":"derive (from ...)","zh":"源自……；由……得出","ex":"Most of the funding derives from local taxes.","cn":"大部分资金来自地方税收。"},{"en":"designate (v.)","zh":"指定；把……定为","ex":"The council designated the area as a protected zone.","cn":"委员会将该地区划定为保护区。"},{"en":"deserve (attention)","zh":"值得关注","ex":"The risks deserve more attention than they have received.","cn":"这些风险值得获得比目前更多的关注。"},{"en":"detect (a pattern)","zh":"察觉一种规律","ex":"Researchers detected a pattern in the survey responses.","cn":"研究人员在调查回答中发现了一种规律。"},{"en":"determine (whether ...)","zh":"确定是否……","ex":"Further research will determine whether the change was effective.","cn":"进一步研究将确定这一变化是否有效。"},{"en":"develop (an idea)","zh":"形成、发展一种想法","ex":"The author develops the idea in the following paragraph.","cn":"作者在下一段进一步阐述这一观点。"},{"en":"devise (a method)","zh":"设计；想出一种方法","ex":"The researchers devised a method to measure public trust.","cn":"研究人员设计了一种衡量公众信任的方法。"},{"en":"devote (resources)","zh":"投入资源","ex":"The hospital devoted more resources to preventive care.","cn":"医院将更多资源投入预防性医疗。"},{"en":"discipline (n.)","zh":"学科；纪律；训练","ex":"Economics is a discipline that studies how resources are allocated.","cn":"经济学是一门研究资源如何分配的学科。"},{"en":"dismiss (an argument)","zh":"不予考虑；驳回论点","ex":"The judge dismissed the argument as irrelevant.","cn":"法官以不相关为由驳回了该论点。"},{"en":"dispose (of ...)","zh":"处理掉；处置……","ex":"The factory must dispose of its waste safely.","cn":"工厂必须安全处置其废弃物。"},{"en":"distinction (n.)","zh":"区别；差异","ex":"The distinction between law and policy is important.","cn":"法律与政策之间的区别十分重要。"},{"en":"distinguish (A from B)","zh":"区分 A 与 B","ex":"We must distinguish evidence from speculation.","cn":"我们必须区分证据与猜测。"},{"en":"divert (attention)","zh":"转移注意力","ex":"The scandal diverted attention from the policy debate.","cn":"这起丑闻转移了公众对政策辩论的注意力。"},{"en":"domestic (market)","zh":"国内市场","ex":"Demand remained strong in the domestic market.","cn":"国内市场需求依然强劲。"},{"en":"dominate (a debate)","zh":"主导讨论","ex":"Questions about costs dominated the debate.","cn":"成本问题主导了这场辩论。"},{"en":"draft (n./v.)","zh":"草案；起草","ex":"The committee revised the draft of the new regulations.","cn":"委员会修订了新法规草案。"},{"en":"draw (a conclusion)","zh":"得出结论","ex":"The researchers drew a cautious conclusion from the evidence.","cn":"研究人员依据证据得出了审慎的结论。"},{"en":"drive (change)","zh":"推动变革","ex":"Technological advances can drive change across an industry.","cn":"技术进步可以推动整个行业发生变化。"},{"en":"due (to ...)","zh":"由于……；应归于……","ex":"The increase was due to higher production costs.","cn":"增长是由生产成本上升造成的。"},{"en":"effect (v.)","zh":"实现；促成（变化）","ex":"The board voted to effect a change in company policy.","cn":"董事会投票决定推动公司政策变革。"},{"en":"effective (from ...)","zh":"从……起生效","ex":"The new rules are effective from January 1.","cn":"新规定自1月1日起生效。"},{"en":"emerge (as ...)","zh":"作为……崭露头角","ex":"The town emerged as a center of scientific research.","cn":"该镇逐渐发展成为科学研究中心。"},{"en":"embrace (change)","zh":"欣然接受变化","ex":"Some firms embrace change more readily than others.","cn":"有些企业比其他企业更愿意接受变化。"},{"en":"emphasis (on ...)","zh":"对……的强调","ex":"The report places emphasis on long-term effects.","cn":"报告强调长期影响。"},{"en":"enact (a law)","zh":"颁布法律","ex":"Parliament enacted a law to protect consumers.","cn":"议会颁布了一项保护消费者的法律。"},{"en":"engage (in ...)","zh":"参与；从事……","ex":"Several firms engaged in unfair trading practices.","cn":"几家公司从事不公平交易行为。"},{"en":"enhance (credibility)","zh":"提高可信度","ex":"Independent review can enhance the credibility of a study.","cn":"独立审查可以提高研究的可信度。"},{"en":"entail (risk)","zh":"意味着；涉及风险","ex":"Investing in an untested system entails risk.","cn":"投资未经测试的系统意味着承担风险。"},{"en":"entitle (someone to ...)","zh":"使某人有权……","ex":"The contract entitles workers to paid leave.","cn":"合同赋予工人带薪休假的权利。"},{"en":"equate (A with B)","zh":"把 A 与 B 等同","ex":"It is a mistake to equate popularity with effectiveness.","cn":"把受欢迎程度等同于有效性是错误的。"},{"en":"establish (a link)","zh":"确定存在联系","ex":"The study failed to establish a causal link.","cn":"这项研究未能确立因果联系。"},{"en":"estimate (v.)","zh":"估算；估计","ex":"Analysts estimate that the project will cost $2 million.","cn":"分析师估计该项目将耗资200万美元。"},{"en":"evaluate (evidence)","zh":"评估证据","ex":"The panel evaluated evidence from several independent studies.","cn":"专家组评估了数项独立研究提供的证据。"},{"en":"evidence (n.)","zh":"证据；迹象","ex":"There is little evidence to support the claim.","cn":"几乎没有证据支持这一说法。"},{"en":"evolve (over time)","zh":"随着时间演变","ex":"Public attitudes evolve over time.","cn":"公众态度会随时间演变。"},{"en":"exceed (a limit)","zh":"超过限制","ex":"The emissions exceeded the legal limit.","cn":"排放量超过了法定限值。"},{"en":"exercise (authority)","zh":"行使权力","ex":"The regulator exercised its authority to impose a fine.","cn":"监管机构行使职权开出了罚款。"},{"en":"exhibit (a trait)","zh":"表现出某种特征","ex":"These species exhibit a similar pattern of behavior.","cn":"这些物种表现出类似的行为模式。"},{"en":"expand (on an idea)","zh":"进一步阐述某种观点","ex":"The author expands on this idea in the next paragraph.","cn":"作者在下一段进一步展开这一观点。"},{"en":"exploit (a resource)","zh":"利用资源；也可指剥削","ex":"The company exploited local resources without protecting the environment.","cn":"这家公司在开发当地资源时没有保护环境。"},{"en":"expose (a flaw)","zh":"揭露缺陷","ex":"The independent review exposed a flaw in the argument.","cn":"独立审查揭示了论证中的一个缺陷。"},{"en":"extend (an argument)","zh":"拓展论证","ex":"The author extends the argument to the education sector.","cn":"作者将这一论点延伸到了教育领域。"},{"en":"extract (information)","zh":"提取信息","ex":"Researchers extracted information from public records.","cn":"研究人员从公共记录中提取信息。"},{"en":"factor (n.)","zh":"因素；要素","ex":"Education is one factor affecting employment.","cn":"教育是影响就业的一个因素。"},{"en":"fair (assessment)","zh":"公正的评估","ex":"The panel promised a fair assessment of the evidence.","cn":"专家组承诺公正评估证据。"},{"en":"fall (into a category)","zh":"属于某一类别","ex":"This firm falls into the category of small businesses.","cn":"这家公司属于小企业类别。"},{"en":"feature (v.)","zh":"以……为特色；重点介绍","ex":"The study features interviews with local residents.","cn":"这项研究包含对当地居民的访谈。"},{"en":"figure (n.)","zh":"数字；人物；图表","ex":"The report gives a figure of 20 percent for unemployment.","cn":"报告给出的失业率数字为20%。"},{"en":"file (a complaint)","zh":"正式提出投诉","ex":"The residents filed a complaint against the operator.","cn":"居民向运营商提出了投诉。"},{"en":"fine (v.)","zh":"处以罚款","ex":"The agency fined the company for breaking safety rules.","cn":"该机构因公司违反安全规定而对其罚款。"},{"en":"firm (n.)","zh":"公司；商号","ex":"The small firm struggled to compete with larger rivals.","cn":"这家小企业难以与更大的竞争对手抗衡。"},{"en":"fit (a pattern)","zh":"符合某种模式","ex":"The results fit the pattern observed in earlier experiments.","cn":"这些结果符合早期实验观察到的模式。"},{"en":"fix (a problem)","zh":"解决问题","ex":"The software update failed to fix the problem.","cn":"软件更新未能解决问题。"},{"en":"flat (growth)","zh":"零增长；增长持平","ex":"Wage growth remained flat despite rising prices.","cn":"尽管物价上涨，工资增长依然停滞。"},{"en":"flourish (v.)","zh":"繁荣；兴盛","ex":"Small businesses flourished after the restrictions were lifted.","cn":"限制措施取消后，小企业蓬勃发展。"},{"en":"focus (on ...)","zh":"集中关注……","ex":"The review focuses on the social effects of reform.","cn":"这项审查重点关注改革的社会影响。"},{"en":"follow (from ...)","zh":"由……推导出","ex":"The conclusion does not follow from the evidence.","cn":"这一结论不能从证据中推导出来。"},{"en":"force (a change)","zh":"迫使发生改变","ex":"Public pressure forced a change in the policy.","cn":"公众压力迫使政策发生改变。"},{"en":"form (v.)","zh":"构成；形成","ex":"A consensus began to form among the researchers.","cn":"研究人员之间开始形成共识。"},{"en":"formal (agreement)","zh":"正式协议","ex":"The two sides reached a formal agreement.","cn":"双方达成了正式协议。"},{"en":"frame (an issue)","zh":"以某种方式界定、表述议题","ex":"The media framed the issue as a conflict between generations.","cn":"媒体将这一问题描述为代际冲突。"},{"en":"free (from ...)","zh":"不受……束缚；免于……","ex":"The service is free from advertising.","cn":"这项服务不含广告。"},{"en":"fuel (a debate)","zh":"加剧、助长争论","ex":"The unexpected findings fueled a wider debate.","cn":"意外的研究结果推动了更广泛的辩论。"},{"en":"fund (research)","zh":"资助研究","ex":"The government agreed to fund further research.","cn":"政府同意资助进一步研究。"},{"en":"gain (ground)","zh":"取得进展；扩大影响","ex":"Support for the reform has gained ground.","cn":"对改革的支持日益扩大。"},{"en":"generate (interest)","zh":"引发兴趣","ex":"The new study generated interest among policymakers.","cn":"新研究引起了政策制定者的兴趣。"},{"en":"given (that ...)","zh":"鉴于；考虑到……","ex":"Given that funds are limited, the plan should be revised.","cn":"鉴于资金有限，这项计划应当修改。"},{"en":"grant (that ...)","zh":"承认……（即使有所保留）","ex":"I grant that the argument has some merit.","cn":"我承认这一论点有一定道理。"},{"en":"ground (n.)","zh":"理由；依据；立场","ex":"There are strong grounds for questioning the decision.","cn":"我们有充分理由质疑这一决定。"},{"en":"handle (an issue)","zh":"处理问题","ex":"The agency handled the complaint poorly.","cn":"该机构未能妥善处理投诉。"},{"en":"hardly (adv.)","zh":"几乎不","ex":"The evidence is hardly sufficient to prove causation.","cn":"这些证据远不足以证明因果关系。"},{"en":"hold (that ...)","zh":"认为；主张……","ex":"The court held that the measure violated the law.","cn":"法院裁定这项措施违反法律。"},{"en":"highlight (a problem)","zh":"凸显问题","ex":"The incident highlighted a problem with the system.","cn":"这一事件凸显了系统存在的问题。"},{"en":"identify (a cause)","zh":"确认原因","ex":"The team identified a likely cause of the failure.","cn":"团队确定了导致失败的一个可能原因。"},{"en":"immediate (effect)","zh":"直接的影响；即时效果","ex":"The decision had an immediate effect on prices.","cn":"这一决定立即对价格产生了影响。"},{"en":"impose (a tax)","zh":"征税；施加税负","ex":"The government imposed a tax on imported goods.","cn":"政府对进口商品征收了税款。"},{"en":"imply (that ...)","zh":"暗示；意味着……","ex":"A decline in sales does not imply that demand has disappeared.","cn":"销售额下降并不意味着需求已经消失。"},{"en":"incentive (n.)","zh":"激励；动机","ex":"Tax relief provides an incentive to invest.","cn":"税收减免为投资提供了激励。"},{"en":"incur (costs)","zh":"招致、承担费用","ex":"The hospital incurred additional costs during the crisis.","cn":"医院在危机期间产生了额外费用。"},{"en":"indicate (a trend)","zh":"显示一种趋势","ex":"The figures indicate a trend toward remote work.","cn":"这些数字表明，远程办公正成为一种趋势。"},{"en":"individual (n.)","zh":"个人；个体","ex":"The survey treats each individual as an independent respondent.","cn":"该调查将每个人都视为独立的受访者。"},{"en":"industry (n.)","zh":"产业界；行业；工业","ex":"The industry opposed tighter safety regulations.","cn":"该行业反对更加严格的安全规定。"},{"en":"infer (from ...)","zh":"从……推断","ex":"We cannot infer causation from correlation alone.","cn":"我们不能仅凭相关关系推断因果关系。"},{"en":"inform (a decision)","zh":"为决策提供依据；影响决策","ex":"The new findings should inform future decisions.","cn":"这些新发现应该为今后的决策提供参考。"},{"en":"initial (reaction)","zh":"最初反应","ex":"The initial reaction to the proposal was negative.","cn":"人们对该提案的最初反应是消极的。"},{"en":"initiative (n.)","zh":"倡议；主动行动","ex":"The initiative aims to improve access to education.","cn":"这项倡议旨在改善接受教育的机会。"},{"en":"integrate (into ...)","zh":"融入；整合进……","ex":"The system will integrate new data into existing records.","cn":"该系统会将新数据整合到现有记录中。"},{"en":"interest (n.)","zh":"利益；兴趣；利息","ex":"The decision was made in the public interest.","cn":"这一决定是出于公共利益作出的。"},{"en":"interpret (a result)","zh":"解释结果","ex":"Researchers interpreted the result as evidence of change.","cn":"研究人员将这一结果解读为发生变化的证据。"},{"en":"issue (n.)","zh":"议题；问题；期刊（一期）","ex":"The report addresses the issue of housing affordability.","cn":"报告讨论住房可负担性问题。"},{"en":"issue (v.)","zh":"发布；发行","ex":"The agency issued a warning to consumers.","cn":"该机构向消费者发出了警告。"},{"en":"justify (a decision)","zh":"证明某决定合理","ex":"The board must justify its decision with evidence.","cn":"董事会必须用证据证明其决定合理。"},{"en":"key (to ...)","zh":"……的关键","ex":"Public cooperation is key to the plan's success.","cn":"公众合作是这项计划成功的关键。"},{"en":"labor (market)","zh":"劳动力市场","ex":"The labor market recovered slowly after the downturn.","cn":"经济下行后，劳动力市场缓慢复苏。"},{"en":"land (a job)","zh":"获得一份工作","ex":"Graduates with practical experience may find it easier to land a job.","cn":"拥有实践经验的毕业生可能更容易找到工作。"},{"en":"launch (a campaign)","zh":"发起一项运动","ex":"The organization launched a campaign to reduce waste.","cn":"该组织发起了一场减少浪费的活动。"},{"en":"lead (to ...)","zh":"导致……","ex":"Lower investment may lead to slower growth.","cn":"投资减少可能导致增长放缓。"},{"en":"lean (toward ...)","zh":"倾向于……","ex":"The panel leaned toward a more cautious approach.","cn":"专家组倾向于采用更加谨慎的方法。"},{"en":"leave (someone exposed)","zh":"使某人处于无保护的状态","ex":"Weak safeguards left consumers exposed to fraud.","cn":"薄弱的保障措施使消费者容易遭受欺诈。"},{"en":"legitimate (concern)","zh":"合理的关切","ex":"Data privacy is a legitimate concern.","cn":"数据隐私是一个合理的担忧。"},{"en":"level (of confidence)","zh":"信心水平；程度","ex":"The participants reported a high level of confidence.","cn":"参与者报告称自己有很高的信心。"},{"en":"lift (a ban)","zh":"解除禁令","ex":"Authorities lifted the ban after new safety tests.","cn":"新的安全测试完成后，当局解除了禁令。"},{"en":"light (of evidence)","zh":"考虑到证据（常见于 in light of）","ex":"In light of the evidence, the committee changed its position.","cn":"鉴于这些证据，委员会改变了立场。"},{"en":"limit (v.)","zh":"限制；限定","ex":"The new regulation limits the use of personal data.","cn":"新法规限制了个人数据的使用。"},{"en":"line (of argument)","zh":"论证思路","ex":"This line of argument overlooks the cost of enforcement.","cn":"这一论证思路忽视了执行成本。"},{"en":"link (A to B)","zh":"把 A 与 B 联系起来","ex":"The study links poor sleep to lower concentration.","cn":"该研究将睡眠不足与注意力下降联系起来。"},{"en":"list (a company)","zh":"使公司上市","ex":"The company plans to list its shares on the stock exchange.","cn":"公司计划在证券交易所上市股票。"},{"en":"live (debate)","zh":"仍在进行的争论","ex":"The question remains a live debate among economists.","cn":"这个问题仍是经济学家之间持续争论的话题。"},{"en":"load (n.)","zh":"负担；负载","ex":"Heavy debt placed a financial load on the company.","cn":"沉重的债务给公司造成了财务负担。"},{"en":"local (effect)","zh":"局部影响","ex":"The reform had a strong local effect in rural areas.","cn":"这项改革在农村地区产生了显著的地方性影响。"},{"en":"maintain (that ...)","zh":"坚称；主张……","ex":"The minister maintains that the policy is fair.","cn":"部长坚持认为该政策是公平的。"},{"en":"major (concern)","zh":"主要关切","ex":"A major concern is the lack of reliable evidence.","cn":"一个主要担忧是缺乏可靠证据。"},{"en":"make (a case)","zh":"提出理由；进行论证","ex":"The report makes a strong case for investment.","cn":"报告提出了支持投资的有力论据。"},{"en":"margin (n.)","zh":"差额；利润率；边缘","ex":"The difference was too small to fall outside the margin of error.","cn":"这种差异太小，未超出误差范围。"},{"en":"mark (a shift)","zh":"标志着转变","ex":"The ruling marked a shift in public policy.","cn":"这一裁决标志着公共政策的转变。"},{"en":"mass (n./adj.)","zh":"大众；大量的","ex":"The survey attracted a mass audience online.","cn":"这项调查在网络上吸引了大量受众。"},{"en":"match (expectations)","zh":"符合预期","ex":"The trial results did not match expectations.","cn":"试验结果不符合预期。"},{"en":"matter (v.)","zh":"要紧；有影响","ex":"The quality of the data matters more than its volume.","cn":"数据质量比数据量更重要。"},{"en":"mean (v.)","zh":"意味着；打算","ex":"The change could mean higher costs for households.","cn":"这一变化可能意味着家庭需要承担更高的成本。"},{"en":"measure (n.)","zh":"措施；测量","ex":"The government announced a measure to reduce emissions.","cn":"政府宣布了一项减少排放的措施。"},{"en":"medium (n.)","zh":"媒介；传播渠道","ex":"Radio remains an important medium for public information.","cn":"广播仍是传播公共信息的重要媒介。"},{"en":"meet (a requirement)","zh":"满足要求","ex":"Applicants must meet a minimum income requirement.","cn":"申请者必须达到最低收入要求。"},{"en":"merit (attention)","zh":"值得关注","ex":"The objections merit serious attention.","cn":"这些反对意见值得认真对待。"},{"en":"mind (v.)","zh":"介意；注意","ex":"Would you mind explaining how the figures were calculated?","cn":"你介意解释一下这些数字是如何计算的吗？"},{"en":"minor (role)","zh":"次要作用","ex":"The tax change played only a minor role in the decline.","cn":"税收调整在这次下降中只起到了次要作用。"},{"en":"model (n.)","zh":"模式；模型；典范","ex":"The researchers developed a model of consumer behavior.","cn":"研究人员建立了一个消费者行为模型。"},{"en":"moderate (a view)","zh":"缓和某种观点","ex":"New evidence led the economist to moderate her view.","cn":"新证据促使经济学家缓和了自己的观点。"},{"en":"monitor (progress)","zh":"监测进展","ex":"The agency will monitor progress over the next year.","cn":"该机构将监测未来一年的进展。"},{"en":"move (n.)","zh":"举措；行动","ex":"The decision was seen as a move toward greater transparency.","cn":"这一决定被视为迈向更高透明度的一步。"},{"en":"multiple (factors)","zh":"多个因素","ex":"Multiple factors contributed to the decline.","cn":"多种因素共同导致了下降。"},{"en":"name (a cause)","zh":"指出某个原因","ex":"The inquiry could not name a single cause of the accident.","cn":"调查未能确定事故的单一原因。"},{"en":"narrow (a gap)","zh":"缩小差距","ex":"The policy aims to narrow the gap between rich and poor.","cn":"该政策旨在缩小贫富差距。"},{"en":"nature (of a problem)","zh":"问题的性质","ex":"The nature of the problem changed as new evidence emerged.","cn":"随着新证据出现，问题的性质发生了变化。"},{"en":"negative (effect)","zh":"负面影响","ex":"The restriction had a negative effect on small firms.","cn":"这项限制对小企业产生了负面影响。"},{"en":"net (gain)","zh":"净收益","ex":"The policy produced a net gain in employment.","cn":"该政策带来了就业人数的净增加。"},{"en":"note (that ...)","zh":"指出；注意到……","ex":"The report notes that the evidence is incomplete.","cn":"报告指出证据尚不完整。"},{"en":"notion (of ...)","zh":"关于……的观念","ex":"The author questions the notion of unlimited economic growth.","cn":"作者质疑经济可以无限增长的观念。"},{"en":"observe (that ...)","zh":"评论说；指出……","ex":"The researchers observed that errors declined with practice.","cn":"研究人员观察到，随着练习增加，错误逐渐减少。"},{"en":"obtain (results)","zh":"获得结果","ex":"The team obtained similar results in a second experiment.","cn":"团队在第二次实验中获得了类似结果。"},{"en":"occupy (a position)","zh":"占据某种地位","ex":"The company occupies a leading position in the market.","cn":"这家公司在市场上占据领先地位。"},{"en":"occur (to someone)","zh":"被某人想到","ex":"It never occurred to the committee that the data might be wrong.","cn":"委员会从未想到数据可能有误。"},{"en":"offer (an explanation)","zh":"提出一种解释","ex":"The study offers an explanation for the decline.","cn":"研究为这种下降提供了一种解释。"},{"en":"operate (a service)","zh":"经营、运营服务","ex":"Private firms operate the local rail service.","cn":"私人企业运营当地铁路服务。"},{"en":"order (n.)","zh":"顺序；秩序；命令","ex":"The court issued an order requiring the documents to be released.","cn":"法院发布命令，要求公开这些文件。"},{"en":"ordinary (citizens)","zh":"普通公民","ex":"Ordinary citizens struggled with higher prices.","cn":"普通公民难以应对物价上涨。"},{"en":"organic (growth)","zh":"自然形成的增长；内生增长","ex":"The firm reported organic growth rather than growth through acquisitions.","cn":"公司报告了内生性增长，而不是通过收购实现的增长。"},{"en":"original (intention)","zh":"最初意图","ex":"The original intention was to protect small businesses.","cn":"最初的目的是保护小企业。"},{"en":"outcome (n.)","zh":"结果；后果","ex":"The outcome of the vote surprised observers.","cn":"投票结果令观察人士感到意外。"},{"en":"outlet (n.)","zh":"销售渠道；媒体机构；出口","ex":"The story appeared in a major news outlet.","cn":"这则新闻出现在一家主要新闻媒体上。"},{"en":"overlook (a factor)","zh":"忽略某个因素","ex":"The report overlooked an important factor.","cn":"报告忽略了一个重要因素。"},{"en":"oversee (a project)","zh":"监督项目","ex":"An independent board will oversee the project.","cn":"一个独立董事会将监督该项目。"},{"en":"own (up to ...)","zh":"承认错误或责任","ex":"Officials eventually owned up to the mistake.","cn":"官员最终承认了错误。"},{"en":"panel (n.)","zh":"专家小组；专门委员会","ex":"A panel of experts reviewed the findings.","cn":"专家小组审查了研究结果。"},{"en":"particular (case)","zh":"特定情况","ex":"In this particular case, the rule does not apply.","cn":"在这个特殊情况下，该规则不适用。"},{"en":"pass (a law)","zh":"通过法律","ex":"Parliament passed a law requiring clearer labels.","cn":"议会通过了一项要求标签更清晰的法律。"},{"en":"pattern (of behavior)","zh":"行为模式","ex":"The study identified a pattern of behavior among consumers.","cn":"研究发现了消费者的一种行为模式。"},{"en":"pay (off)","zh":"取得成效；带来回报","ex":"The early investment finally paid off.","cn":"早期投资终于取得回报。"},{"en":"perform (a function)","zh":"发挥某项功能","ex":"This committee performs an important oversight function.","cn":"这个委员会发挥着重要的监督作用。"},{"en":"permit (v.)","zh":"允许","ex":"The regulation permits limited data sharing.","cn":"这项法规允许有限度地共享数据。"},{"en":"persist (v.)","zh":"持续存在","ex":"The problem persisted despite repeated reforms.","cn":"尽管反复改革，问题仍然持续存在。"},{"en":"perspective (n.)","zh":"视角；观点","ex":"The article examines the issue from a historical perspective.","cn":"文章从历史视角审视这个问题。"},{"en":"phase (n.)","zh":"阶段","ex":"The project entered its final phase.","cn":"该项目进入最后阶段。"},{"en":"place (emphasis on ...)","zh":"强调……","ex":"The report places emphasis on protecting vulnerable groups.","cn":"报告强调保护弱势群体。"},{"en":"plain (fact)","zh":"显而易见的事实","ex":"The plain fact is that the budget is insufficient.","cn":"显而易见的事实是预算不足。"},{"en":"plant (n.)","zh":"工厂；植物","ex":"The company opened a new manufacturing plant.","cn":"公司开设了一家新的制造工厂。"},{"en":"play (a role)","zh":"发挥作用","ex":"Education plays an important role in social mobility.","cn":"教育在社会阶层流动中发挥重要作用。"},{"en":"point (n.)","zh":"论点；要点；意图","ex":"The author makes a useful point about public trust.","cn":"作者就公众信任提出了一个有价值的观点。"},{"en":"policy (n.)","zh":"政策；方针；保险单","ex":"The policy seeks to reduce inequality.","cn":"该政策力求减少不平等。"},{"en":"pose (a threat)","zh":"构成威胁","ex":"Rising costs pose a threat to the project.","cn":"成本上升对项目构成威胁。"},{"en":"position (n.)","zh":"立场；职位；处境","ex":"The minister defended the government's position.","cn":"部长为政府的立场辩护。"},{"en":"positive (evidence)","zh":"肯定性证据","ex":"The trial provided positive evidence of improvement.","cn":"试验为情况改善提供了积极证据。"},{"en":"potential (risk)","zh":"潜在风险","ex":"The report identifies a potential risk to consumers.","cn":"报告指出消费者可能面临的风险。"},{"en":"practice (n.)","zh":"惯例；做法；执业","ex":"The practice of sharing personal data has drawn criticism.","cn":"共享个人数据的做法招致批评。"},{"en":"press (n.)","zh":"新闻媒体","ex":"The story attracted attention from the national press.","cn":"这则报道引起了全国性媒体的关注。"},{"en":"presume (that ...)","zh":"推定；假定……","ex":"We cannot presume that the policy will succeed.","cn":"我们不能预先认定该政策会成功。"},{"en":"present (evidence)","zh":"提交；呈现证据","ex":"The researchers presented evidence to the committee.","cn":"研究人员向委员会提交了证据。"},{"en":"preserve (the status quo)","zh":"维持现状","ex":"Opponents of reform hoped to preserve the status quo.","cn":"改革反对者希望维持现状。"},{"en":"preside (over ...)","zh":"主持；主导……","ex":"The judge presided over the hearing.","cn":"法官主持了听证会。"},{"en":"pressure (on ...)","zh":"对……的压力","ex":"Public pressure on the company continued to grow.","cn":"公司面临的公众压力持续增加。"},{"en":"prevail (v.)","zh":"盛行；占上风","ex":"The government's position prevailed in court.","cn":"政府的立场在法庭上获得支持。"},{"en":"prime (concern)","zh":"首要关切","ex":"The prime concern was the safety of residents.","cn":"首要关切是居民的安全。"},{"en":"principle (n.)","zh":"原则；原理","ex":"The law reflects the principle of equal treatment.","cn":"该法律体现了平等对待原则。"},{"en":"process (v.)","zh":"处理；加工","ex":"The agency must process applications within a month.","cn":"该机构必须在一个月内处理申请。"},{"en":"produce (an effect)","zh":"产生影响","ex":"The treatment produced a measurable effect.","cn":"这种治疗产生了可测量的效果。"},{"en":"proceed (with ...)","zh":"继续开展……","ex":"The board decided to proceed with the plan.","cn":"董事会决定继续实施该计划。"},{"en":"profess (to believe ...)","zh":"声称相信……","ex":"The company professes to believe in transparency.","cn":"该公司自称信奉透明原则。"},{"en":"project (v.)","zh":"预测；投射；展示","ex":"Analysts project growth of about two percent.","cn":"分析师预计增长约为2%。"},{"en":"promote (an idea)","zh":"推广一种观点","ex":"The campaign promotes the idea of lifelong learning.","cn":"这项活动宣传终身学习的理念。"},{"en":"prompt (a response)","zh":"引发回应","ex":"The announcement prompted an immediate response.","cn":"这一公告引发了即时反应。"},{"en":"propose (a solution)","zh":"提出解决方案","ex":"The report proposes a solution to the funding ger safeguards.","cn":"政府认识到需要更有力的保障措施。"},{"en":"record (n.)","zh":"记录；履历；历史表现","ex":"The company's safety record improved last year.","cn":"该公司的安全记录去年有所改善。"},{"en":"recover (from ...)","zh":"从……中恢复","ex":"The local economy recovered from the downturn.","cn":"当地经济从衰退中复苏。"},{"en":"reflect (a concern)","zh":"反映某种关切","ex":"The policy reflects public concern about data privacy.","cn":"该政策反映了公众对数据隐私的担忧。"},{"en":"reform (n./v.)","zh":"改革","ex":"The government proposed a reform of the tax system.","cn":"政府提出了税制改革方案。"},{"en":"regard (A as B)","zh":"把 A 视为 B","ex":"Critics regard the new rule as unnecessary.","cn":"批评者认为新规定没有必要。"},{"en":"register (concern)","zh":"表达担忧","ex":"Several groups registered concern about the plan.","cn":"多个团体对该计划表达了担忧。"},{"en":"regular (review)","zh":"定期审查","ex":"The agency conducts a regular review of safety standards.","cn":"该机构定期审查安全标准。"},{"en":"reject (a claim)","zh":"否定某种说法","ex":"The court rejected the claim as unsupported.","cn":"法院以缺乏证据支持为由驳回了这一主张。"},{"en":"relate (to ...)","zh":"涉及……；与……相关","ex":"These findings relate to the question of inequality.","cn":"这些发现与不平等问题有关。"},{"en":"release (findings)","zh":"发布研究结果","ex":"The researchers released their findings in June.","cn":"研究人员于六月公布了研究结果。"},{"en":"relevant (to ...)","zh":"与……相关","ex":"The data are relevant to the debate on housing.","cn":"这些数据与住房问题的讨论相关。"},{"en":"relief (from ...)","zh":"从……中得到缓解","ex":"The subsidy provided relief from rising energy costs.","cn":"这项补贴缓解了能源成本上涨带来的压力。"},{"en":"rely (on ...)","zh":"依赖……","ex":"The study relies on data from public surveys.","cn":"该研究依赖公众调查的数据。"},{"en":"remain (unresolved)","zh":"仍未解决","ex":"Several important questions remain unresolved.","cn":"几个重要问题仍未解决。"},{"en":"remark (n.)","zh":"评论；言论","ex":"Her remark about the policy was widely misunderstood.","cn":"她关于这项政策的评论被广泛误解。"},{"en":"render (a claim invalid)","zh":"使某种主张失效","ex":"The new evidence rendered the earlier claim invalid.","cn":"新证据使早先的说法失去效力。"},{"en":"renew (efforts)","zh":"重新作出努力","ex":"The agency renewed efforts to improve access.","cn":"该机构再次努力改善获取服务的机会。"},{"en":"represent (an interest)","zh":"代表某种利益","ex":"The association represents the interests of small firms.","cn":"该协会代表小企业的利益。"},{"en":"require (attention)","zh":"需要关注","ex":"The problem requires immediate attention.","cn":"这个问题需要立即关注。"},{"en":"reserve (the right)","zh":"保留权利","ex":"The regulator reserves the right to review the decision.","cn":"监管机构保留复查这一决定的权利。"},{"en":"resist (pressure)","zh":"抵抗压力","ex":"The committee resisted pressure to approve the plan.","cn":"委员会抵制了要求批准该计划的压力。"},{"en":"resolve (a dispute)","zh":"解决争端","ex":"The two parties resolved the dispute through mediation.","cn":"双方通过调解解决了争端。"},{"en":"resort (to ...)","zh":"诉诸……；采取不得已的手段","ex":"The company resorted to layoffs to cut costs.","cn":"公司为削减成本而采取裁员措施。"},{"en":"respect (n.)","zh":"方面；尊重","ex":"In this respect, the two policies differ greatly.","cn":"在这一方面，两项政策存在很大差异。"},{"en":"respond (to criticism)","zh":"回应批评","ex":"The agency responded to criticism of its methods.","cn":"该机构回应了对其工作方法的批评。"},{"en":"rest (on ...)","zh":"以……为基础；取决于……","ex":"The argument rests on an untested assumption.","cn":"这个论点建立在未经检验的假设之上。"},{"en":"result (in ...)","zh":"导致……","ex":"The change resulted in higher costs.","cn":"这一变化导致成本增加。"},{"en":"retain (control)","zh":"保留控制权","ex":"The government retained control over the network.","cn":"政府保留了对网络的控制权。"},{"en":"return (n.)","zh":"回报；收益","ex":"The investment generated a modest return.","cn":"这项投资获得了适度回报。"},{"en":"reverse (a trend)","zh":"扭转趋势","ex":"The new policy reversed the trend of declining employment.","cn":"新政策扭转了就业人数下降的趋势。"},{"en":"review (a decision)","zh":"复核、审查决定","ex":"The court will review the decision next month.","cn":"法院将于下月审查这一决定。"},{"en":"revise (a policy)","zh":"修订政策","ex":"The ministry revised the policy after consultation.","cn":"该部在征求意见后修订了政策。"},{"en":"right (n.)","zh":"权利；正当性","ex":"Consumers have a right to accurate information.","cn":"消费者有权获得准确的信息。"},{"en":"rise (of ...)","zh":"……的兴起","ex":"The rise of online platforms changed retail markets.","cn":"线上平台的兴起改变了零售市场。"},{"en":"risk (doing ...)","zh":"冒……的风险","ex":"Firms risk losing customers if they raise prices.","cn":"企业如果提高价格，就有失去客户的风险。"},{"en":"role (n.)","zh":"作用；职责；角色","ex":"The agency plays a key role in consumer protection.","cn":"该机构在消费者保护中发挥关键作用。"},{"en":"rule (v.)","zh":"裁决；统治","ex":"The court ruled that the restriction was unlawful.","cn":"法院裁定这一限制不合法。"},{"en":"run (a business)","zh":"经营企业","ex":"She has run a small business for ten years.","cn":"她已经经营一家小企业十年了。"},{"en":"sanction (n./v.)","zh":"制裁；批准（需依语境区分）","ex":"The regulator imposed sanctions on firms that violated the rules.","cn":"监管机构制裁了违反规定的企业。"},{"en":"scale (of an issue)","zh":"问题的规模","ex":"The study revealed the scale of the problem.","cn":"研究揭示了问题的规模。"},{"en":"scope (of a study)","zh":"研究范围","ex":"The scope of the study was limited to rural areas.","cn":"这项研究的范围仅限于农村地区。"},{"en":"secure (support)","zh":"争取到支持","ex":"The proposal secured support from local residents.","cn":"这项提案获得了当地居民的支持。"},{"en":"see (A as B)","zh":"把 A 看作 B","ex":"Many voters see the measure as unnecessary.","cn":"许多选民认为这项措施没有必要。"},{"en":"seek (to ...)","zh":"试图……","ex":"The law seeks to protect consumers from fraud.","cn":"这部法律旨在保护消费者免受欺诈。"},{"en":"sense (n.)","zh":"意义；感觉；意识","ex":"In this sense, the reform can be called a success.","cn":"从这个意义上说，改革可以算是成功。"},{"en":"serve (as ...)","zh":"充当；起到……作用","ex":"The survey results serve as evidence of changing attitudes.","cn":"调查结果可以证明人们的态度正在发生变化。"},{"en":"set (a standard)","zh":"制定标准","ex":"The law sets a minimum standard for safety.","cn":"法律规定了最低安全标准。"},{"en":"settle (a dispute)","zh":"解决争议","ex":"The court settled the dispute in favor of the workers.","cn":"法院作出了有利于工人的裁决，解决了争端。"},{"en":"shape (public opinion)","zh":"塑造公众舆论","ex":"Media coverage can shape public opinion.","cn":"媒体报道会塑造公众舆论。"},{"en":"share (n.)","zh":"份额；股份","ex":"The firm's market share declined.","cn":"该公司的市场份额下降了。"},{"en":"shift (in attitudes)","zh":"态度转变","ex":"The survey revealed a shift in attitudes toward regulation.","cn":"调查显示人们对监管的态度发生了转变。"},{"en":"signal (a change)","zh":"预示变化","ex":"The decision signaled a change in government policy.","cn":"这一决定标志着政府政策的变化。"},{"en":"significant (effect)","zh":"显著影响","ex":"The intervention had a statistically significant effect.","cn":"这一干预产生了统计学上显著的效果。"},{"en":"single (out ...)","zh":"单独挑出……","ex":"The report singled out three companies for criticism.","cn":"报告特别点名批评了三家公司。"},{"en":"site (of a dispute)","zh":"争议发生的场所","ex":"The building became the site of a dispute over ownership.","cn":"这栋建筑成为一场所有权纠纷的争议地点。"},{"en":"slip (in standards)","zh":"标准下降","ex":"Inspectors reported a slip in safety standards.","cn":"检查人员报告说安全标准有所下降。"},{"en":"social (norms)","zh":"社会规范","ex":"Social norms influence how people behave in public.","cn":"社会规范影响人们在公共场合的行为。"},{"en":"solid (evidence)","zh":"可靠证据","ex":"The report offered solid evidence of misconduct.","cn":"报告提供了不当行为的确凿证据。"},{"en":"source (of conflict)","zh":"冲突来源","ex":"Differences over funding became a source of conflict.","cn":"在资金问题上的分歧成为冲突的根源。"},{"en":"specific (claim)","zh":"具体主张","ex":"The article examines one specific claim about the policy.","cn":"文章探讨了关于该政策的一项具体主张。"},{"en":"specify (a condition)","zh":"明确规定条件","ex":"The contract specifies a condition for renewal.","cn":"合同规定了续约条件。"},{"en":"spring (from ...)","zh":"源于……","ex":"The dispute sprang from a misunderstanding.","cn":"这场争执源于误解。"},{"en":"standard (of proof)","zh":"证明标准","ex":"The court applied a strict standard of proof.","cn":"法院采用了严格的证明标准。"},{"en":"stand (for ...)","zh":"代表；主张……","ex":"The abbreviation stands for an international organization.","cn":"这个缩写代表一个国际组织。"},{"en":"state (a position)","zh":"陈述立场","ex":"The company stated its position in a press release.","cn":"该公司在新闻稿中阐述了自己的立场。"},{"en":"step (n.)","zh":"措施；步骤","ex":"The first step is to review the evidence.","cn":"第一步是审查证据。"},{"en":"stick (to a position)","zh":"坚持原有立场","ex":"The committee stuck to its position despite pressure.","cn":"尽管面临压力，委员会仍坚持自己的立场。"},{"en":"stress (the importance)","zh":"强调重要性","ex":"The author stresses the importance of accurate data.","cn":"作者强调准确数据的重要性。"},{"en":"strike (a balance)","zh":"取得平衡","ex":"Policymakers must strike a balance between safety and innovation.","cn":"政策制定者必须在安全与创新之间取得平衡。"},{"en":"subject (someone to ...)","zh":"使某人遭受……","ex":"The rules subject firms to regular inspections.","cn":"这些规定使企业必须接受定期检查。"},{"en":"submit (evidence)","zh":"提交证据","ex":"The company submitted evidence to the court.","cn":"公司向法院提交了证据。"},{"en":"substantial (difference)","zh":"显著差异；实质差异","ex":"There is a substantial difference between the two estimates.","cn":"两个估计值之间存在显著差异。"},{"en":"suffer (a loss)","zh":"遭受损失","ex":"The company suffered a loss after the policy change.","cn":"政策改变后，公司蒙受了损失。"},{"en":"suggest (that ...)","zh":"表明；暗示；建议说……","ex":"The findings suggest that the treatment may help.","cn":"研究结果表明这种治疗可能有效。"},{"en":"supply (evidence)","zh":"提供证据","ex":"The report supplied evidence for the claim.","cn":"报告提供了支持这一主张的证据。"},{"en":"support (a claim)","zh":"支持某种主张；提供佐证","ex":"The available data do not support the claim.","cn":"现有数据不支持这种说法。"},{"en":"suppose (that ...)","zh":"假设……","ex":"Suppose that the figures are correct; what follows?","cn":"假设这些数字正确，那么能够得出什么结论？"},{"en":"survive (criticism)","zh":"经受住批评","ex":"The theory survived extensive criticism.","cn":"这一理论经受住了广泛批评。"},{"en":"sustain (growth)","zh":"维持增长","ex":"The region struggled to sustain economic growth.","cn":"该地区努力维持经济增长。"},{"en":"swing (in opinion)","zh":"舆论转向","ex":"The survey recorded a swing in public opinion.","cn":"调查记录到公众舆论的转变。"},{"en":"take (effect)","zh":"生效","ex":"The new regulation will take effect next year.","cn":"新法规将于明年生效。"},{"en":"target (a group)","zh":"针对某个群体","ex":"The program targets low-income families.","cn":"该项目面向低收入家庭。"},{"en":"term (n.)","zh":"术语；期限；条件","ex":"The meaning of the term varies by discipline.","cn":"这个术语的含义因学科而异。"},{"en":"tend (to ...)","zh":"往往会；倾向于……","ex":"People tend to overestimate rare risks.","cn":"人们往往高估罕见风险。"},{"en":"tension (between ...)","zh":"……之间的紧张关系","ex":"There is tension between economic growth and environmental protection.","cn":"经济增长与环境保护之间存在矛盾。"},{"en":"theory (n.)","zh":"理论；解释","ex":"The data are consistent with the theory.","cn":"这些数据与理论一致。"},{"en":"threat (of ...)","zh":"……的威胁；风险","ex":"The threat of closure worried local residents.","cn":"关闭的威胁使当地居民担忧。"},{"en":"tie (A to B)","zh":"把 A 与 B 联系起来","ex":"The report ties the increase in costs to higher energy prices.","cn":"报告将成本上涨与能源价格上涨联系起来。"},{"en":"time (v.)","zh":"安排时间；计时","ex":"The government timed the announcement to coincide with the election.","cn":"政府将公告安排在选举期间发布。"},{"en":"tip (the balance)","zh":"改变力量对比","ex":"A small number of votes tipped the balance.","cn":"少数几张选票改变了结果。"},{"en":"toll (on ...)","zh":"对……造成的损失","ex":"Long working hours took a toll on employees' health.","cn":"长时间工作损害了员工的健康。"},{"en":"top (a list)","zh":"位居榜首","ex":"Education topped the list of public concerns.","cn":"教育位居公众关注问题之首。"},{"en":"track (changes)","zh":"追踪变化","ex":"Researchers tracked changes in public attitudes.","cn":"研究人员追踪了公众态度的变化。"},{"en":"trade-off (n.)","zh":"取舍；权衡","ex":"There is a trade-off between cost and accuracy.","cn":"成本与准确性之间存在权衡。"},{"en":"transfer (control)","zh":"转移控制权","ex":"The agreement transferred control to the local authority.","cn":"协议将控制权转交给地方当局。"},{"en":"treat (A as B)","zh":"将 A 当作 B","ex":"Officials treated the complaint as a serious warning.","cn":"官员将这起投诉视为严重警告。"},{"en":"trial (n.)","zh":"试验；审判","ex":"The clinical trial involved 300 participants.","cn":"这项临床试验有300名参与者。"},{"en":"trigger (a response)","zh":"引发反应","ex":"The policy triggered a strong public response.","cn":"这项政策引发了公众的强烈反应。"},{"en":"turn (out to be ...)","zh":"结果是……","ex":"The proposed shortcut turned out to be expensive.","cn":"拟议中的捷径最终被证明成本高昂。"},{"en":"underlie (a trend)","zh":"构成某趋势的基础","ex":"Demographic changes underlie the long-term trend.","cn":"人口结构变化是这一长期趋势的根本原因。"},{"en":"undergo (change)","zh":"经历变化","ex":"The industry is undergoing rapid change.","cn":"该行业正在经历快速变化。"},{"en":"undermine (confidence)","zh":"削弱信心","ex":"The scandal undermined public confidence in the agency.","cn":"丑闻削弱了公众对该机构的信任。"},{"en":"undertake (a study)","zh":"开展研究","ex":"The researchers undertook a study of local schools.","cn":"研究人员开展了一项关于当地学校的研究。"},{"en":"unfold (v.)","zh":"逐渐展开；显现","ex":"The events unfolded over several months.","cn":"这些事件在数个月间逐步展开。"},{"en":"unique (to ...)","zh":"……所特有的","ex":"This pattern is unique to the region.","cn":"这种模式是该地区特有的。"},{"en":"urge (action)","zh":"敦促采取行动","ex":"Experts urged immediate action to reduce emissions.","cn":"专家敦促立即采取措施减少排放。"},{"en":"valid (objection)","zh":"合理的异议","ex":"The committee acknowledged a valid objection.","cn":"委员会承认这是一项合理的反对意见。"},{"en":"value (v.)","zh":"重视；珍视","ex":"The organization values independent research.","cn":"该组织重视独立研究。"},{"en":"vary (by region)","zh":"因地区而异","ex":"Employment opportunities vary by region.","cn":"就业机会因地区而异。"},{"en":"venture (n.)","zh":"风险项目；新企业","ex":"The new venture attracted several investors.","cn":"这项新业务吸引了几位投资者。"},{"en":"view (A as B)","zh":"把 A 看作 B","ex":"Many scientists view the change as a positive sign.","cn":"许多科学家认为这一变化是积极的信号。"},{"en":"virtually (all)","zh":"几乎全部","ex":"Virtually all participants completed the questionnaire.","cn":"几乎所有参与者都完成了问卷。"},{"en":"vision (n.)","zh":"愿景；构想","ex":"The report presents a long-term vision for the city.","cn":"报告为这座城市提出了长期愿景。"},{"en":"voice (concerns)","zh":"表达担忧","ex":"Several parents voiced concerns about safety.","cn":"几位家长表达了对安全的担忧。"},{"en":"volume (of trade)","zh":"贸易量","ex":"The volume of trade rose during the year.","cn":"年内贸易量有所增加。"},{"en":"warrant (attention)","zh":"值得关注；有充分理由引起关注","ex":"The discrepancies warrant further attention.","cn":"这些差异值得进一步关注。"},{"en":"weigh (the evidence)","zh":"权衡证据","ex":"The court carefully weighed the evidence.","cn":"法院仔细权衡了证据。"},{"en":"while (conj.)","zh":"虽然……；而……（表对照）","ex":"While some experts agreed, others challenged the claim.","cn":"虽然有些专家表示赞同，但另一些专家质疑这一说法。"},{"en":"will (n.)","zh":"意愿；遗嘱","ex":"The decision reflected the political will to reform.","cn":"这一决定体现了推进改革的政治意愿。"},{"en":"withdraw (a claim)","zh":"撤回某种主张","ex":"The company withdrew its claim after the review.","cn":"审查后，公司撤回了其主张。"},{"en":"work (v.)","zh":"奏效；发挥作用","ex":"The strategy worked despite initial doubts.","cn":"尽管最初受到怀疑，这项战略仍然奏效了。"},{"en":"worth (considering)","zh":"值得考虑","ex":"The alternative is worth considering.","cn":"这个替代方案值得考虑。"},{"en":"yield (results)","zh":"产生结果；带来成果","ex":"The research yielded useful results.","cn":"这项研究取得了有价值的成果。"},{"en":"agree with a view","zh":"赞同某种观点","ex":"Several economists agree with the view that early investment reduces costs.","cn":"几位经济学家赞同早期投资可以降低成本的观点。"},{"en":"agree on a solution","zh":"就解决方案达成一致","ex":"The two parties finally agreed on a solution to the dispute.","cn":"双方最终就解决争端的办法达成一致。"},{"en":"act on evidence","zh":"依据证据采取行动","ex":"Regulators should act on evidence rather than rumors.","cn":"监管机构应根据证据而非传言采取行动。"},{"en":"act as a barrier","zh":"起到障碍作用","ex":"High costs can act as a barrier to education.","cn":"高昂的费用可能成为接受教育的障碍。"},{"en":"add to the problem","zh":"使问题更严重","ex":"A lack of reliable data may add to the problem.","cn":"缺乏可靠数据可能使问题更加严重。"},{"en":"amount to a rejection","zh":"等同于拒绝；实际上构成拒绝","ex":"The committee's response may amount to a rejection of the proposal.","cn":"委员会的回应可能相当于拒绝该提案。"},{"en":"apply to a case","zh":"适用于某个情况","ex":"The new rule may apply to this case.","cn":"新规定可能适用于此案。"},{"en":"approve of a proposal","zh":"赞成一项提案","ex":"Most members approved of the proposal to expand public transport.","cn":"大多数成员支持扩大公共交通的提案。"},{"en":"argue against a policy","zh":"提出反对某项政策的理由","ex":"The study argues against a policy that imposes excessive costs.","cn":"这项研究反对会带来过高成本的政策。"},{"en":"argue for reform","zh":"为改革提出理由；主张改革","ex":"Researchers argue for reform on the basis of new evidence.","cn":"研究人员依据新证据主张改革。"},{"en":"argue that ...","zh":"论证或主张……","ex":"The author argues that the reform will not solve the underlying problem.","cn":"作者认为改革无法解决根本问题。"},{"en":"arise from a conflict","zh":"源于冲突","ex":"The delay may arise from a conflict between the two departments.","cn":"延误可能源于两个部门之间的冲突。"},{"en":"arrive at a conclusion","zh":"得出结论","ex":"The committee arrived at a conclusion after reviewing the evidence.","cn":"委员会审查证据后得出了结论。"},{"en":"ascribe A to B","zh":"把 A 归因于 B","ex":"The report ascribes the decline in sales to higher prices.","cn":"报告将销售下降归因于价格上涨。"},{"en":"associate A with B","zh":"把 A 与 B 联系起来","ex":"The study associates poor sleep with lower concentration.","cn":"该研究将睡眠不足与注意力下降联系起来。"},{"en":"attribute A to B","zh":"将 A 归因于 B","ex":"The study attributes higher costs to energy shortages.","cn":"研究将成本上升归因于能源短缺。"},{"en":"be attributed to ...","zh":"被归因于……","ex":"The rise in prices may be attributed to increased demand.","cn":"价格上涨可能归因于需求增加。"},{"en":"bear on the issue","zh":"与该问题有关；影响该问题","ex":"These findings bear directly on the issue of public safety.","cn":"这些发现与公共安全问题直接相关。"},{"en":"be based on evidence","zh":"以证据为基础","ex":"Sound policy should be based on evidence.","cn":"合理的政策应该以证据为基础。"},{"en":"be bound to happen","zh":"必然会发生","ex":"Without new funding, further delays are bound to happen.","cn":"没有新的资金支持，进一步延误势必发生。"},{"en":"be subject to criticism","zh":"受到批评；可能遭到批评","ex":"Even a popular decision can be subject to criticism.","cn":"即使是受欢迎的决定也可能受到批评。"},{"en":"be supposed to do","zh":"按理应该做……","ex":"The regulator is supposed to protect consumers from abuse.","cn":"监管机构本应保护消费者免受侵害。"},{"en":"blame A for B","zh":"因 B 责怪 A","ex":"The minister may blame the firm for the delay.","cn":"部长可能将延误归咎于该公司。"},{"en":"blame B on A","zh":"把 B 归咎于 A","ex":"The manager blamed the delay on the supplier.","cn":"经理将延误归咎于供应商。"},{"en":"bring about change","zh":"促成变化","ex":"Public pressure can bring about change.","cn":"公众压力能够促成改变。"},{"en":"bring into question","zh":"使……受到质疑","ex":"The new data bring the earlier estimates into question.","cn":"新数据使早先的估计受到质疑。"},{"en":"build on previous work","zh":"在已有工作基础上进一步发展","ex":"The researchers may build on previous work.","cn":"研究人员可以在先前工作的基础上进一步研究。"},{"en":"call for action","zh":"呼吁采取行动；要求行动","ex":"The report calls for immediate action to reduce pollution.","cn":"报告呼吁立即采取措施减少污染。"},{"en":"call into question","zh":"对……提出质疑","ex":"The evidence calls the original assumption into question.","cn":"证据使原先的假设受到质疑。"},{"en":"cast doubt on a claim","zh":"使某种说法受到怀疑","ex":"The new evidence may cast doubt on a claim.","cn":"新证据可能使某项说法受到怀疑。"},{"en":"charge A with B","zh":"指控 A 犯有 B","ex":"Prosecutors charged the former executive with fraud.","cn":"检察官指控这名前高管犯有欺诈罪。"},{"en":"challenge the assumption that ...","zh":"质疑“……”这一假设","ex":"The author challenges the assumption that bigger firms are more efficient.","cn":"作者质疑大企业效率更高这一假设。"},{"en":"claim that ...","zh":"声称……；不保证所述为真","ex":"The company claims that the new system is safe.","cn":"公司声称新系统是安全的。"},{"en":"coincide with ...","zh":"与……同时发生；一致","ex":"The announcement coincided with a rise in demand.","cn":"这项公告发布时，需求也有所增长。"},{"en":"come at a cost","zh":"需要付出代价","ex":"Greater convenience may come at a cost to privacy.","cn":"更加便利可能以牺牲隐私为代价。"},{"en":"come down to ...","zh":"归结为……","ex":"The dispute comes down to a question of ownership.","cn":"这场争议归根结底是所有权问题。"},{"en":"come into effect","zh":"开始生效","ex":"The new regulation will come into effect in January.","cn":"新法规将于一月生效。"},{"en":"come to terms with ...","zh":"接受并逐渐适应……","ex":"Workers gradually came to terms with the new arrangement.","cn":"工人逐渐接受了新的安排。"},{"en":"compare A with B","zh":"比较 A 和 B 的异同","ex":"The researchers compared the new method with the old one.","cn":"研究人员将新方法与旧方法进行了比较。"},{"en":"compare A to B","zh":"把 A 比作 B；也可用于比较","ex":"The author compares the economy to a living organism.","cn":"作者将经济比作一个生命有机体。"},{"en":"compensate for a loss","zh":"弥补损失","ex":"The subsidy may compensate for a loss of income.","cn":"补贴可能弥补收入损失。"},{"en":"comply with a rule","zh":"遵守规定","ex":"Firms must comply with the new rule.","cn":"企业必须遵守新规定。"},{"en":"concede that ...","zh":"承认……；常含让步意味","ex":"The author concedes that the evidence is incomplete.","cn":"作者承认证据尚不完整。"},{"en":"concern oneself with ...","zh":"关心；关注……","ex":"The inquiry concerns itself with the safety of the public.","cn":"这项调查关注公众安全。"},{"en":"consent to ...","zh":"同意……","ex":"The workers refused to consent to the new terms.","cn":"工人拒绝同意新的条款。"},{"en":"consist of ...","zh":"由……组成","ex":"The panel consists of five independent experts.","cn":"专家组由五名独立专家组成。"},{"en":"consist in ...","zh":"在于……；本质是……","ex":"The difficulty consists in distinguishing correlation from causation.","cn":"困难在于区分相关关系与因果关系。"},{"en":"constitute evidence of ...","zh":"构成……的证据","ex":"The repeated failures constitute evidence of a systemic problem.","cn":"屡次失败构成了系统性问题的证据。"},{"en":"contribute to a decline","zh":"导致或促成下降","ex":"Reduced investment may contribute to a decline in productivity.","cn":"投资减少可能导致生产率下降。"},{"en":"contrast A with B","zh":"将 A 与 B 作对比","ex":"The report may contrast the new rule with the old one.","cn":"报告可能会将新规定与旧规定进行对比。"},{"en":"convince A of B","zh":"使 A 相信 B","ex":"The new evidence convinced the committee of the need for reform.","cn":"新证据使委员会相信改革势在必行。"},{"en":"convince A that ...","zh":"使 A 相信……","ex":"The data convinced the committee that reform was necessary.","cn":"数据让委员会确信改革是必要的。"},{"en":"count against an argument","zh":"成为不利于该论点的证据","ex":"The later results count against the original argument.","cn":"后来的结果不利于支持最初的论点。"},{"en":"count in favor of ...","zh":"成为支持……的理由","ex":"The new evidence counts in favor of the proposed explanation.","cn":"新证据有利于支持所提出的解释。"},{"en":"count on ...","zh":"依靠；指望……","ex":"Students count on grants to help cover tuition.","cn":"学生依赖补助金帮助支付学费。"},{"en":"counter an argument","zh":"反驳某个论点","ex":"The researcher countered the argument with stronger evidence.","cn":"研究人员用更有力的证据反驳了这一论点。"},{"en":"deal with a difficulty","zh":"处理难题","ex":"The team developed a method to deal with the difficulty.","cn":"团队开发了一种应对困难的方法。"},{"en":"debate over a policy","zh":"围绕某项政策的争论","ex":"The debate over the policy lasted several months.","cn":"围绕这项政策的争论持续了数月。"},{"en":"decide against ...","zh":"决定不选择……","ex":"The council decided against introducing a new fee.","cn":"委员会决定不引入新的收费项目。"},{"en":"defer to authority","zh":"尊重并服从权威意见","ex":"The committee refused to defer blindly to authority.","cn":"委员会拒绝盲从权威。"},{"en":"demand that ...","zh":"要求……（不等于声称）","ex":"Workers demanded that management improve safety standards.","cn":"工人要求管理层提高安全标准。"},{"en":"depend on context","zh":"取决于语境","ex":"The meaning of the word depends on context.","cn":"词义取决于上下文。"},{"en":"derive A from B","zh":"从 B 推导出 A","ex":"Researchers derived the estimate from survey data.","cn":"研究人员根据调查数据推算出估计值。"},{"en":"derive from ...","zh":"来源于……","ex":"The theory derives from earlier research.","cn":"这一理论源自早期研究。"},{"en":"deter A from doing B","zh":"阻止 A 做 B","ex":"The penalty may deter firms from breaking the rules.","cn":"处罚可能阻止企业违规。"},{"en":"differ from ...","zh":"不同于……","ex":"The results differ from those reported last year.","cn":"这些结果与去年公布的结果不同。"},{"en":"distinguish A from B","zh":"区分 A 和 B","ex":"The author may distinguish evidence from speculation.","cn":"作者可能会区分证据和猜测。"},{"en":"draw attention to ...","zh":"使人注意到……","ex":"The report draws attention to a serious problem.","cn":"报告引起人们对一个严重问题的关注。"},{"en":"draw a distinction between ...","zh":"区分……与……","ex":"The author draws a distinction between ownership and control.","cn":"作者区分了所有权与控制权。"},{"en":"draw on experience","zh":"利用经验","ex":"The team drew on experience from previous projects.","cn":"团队借鉴了以往项目的经验。"},{"en":"entail a risk","zh":"意味着存在风险","ex":"The change would entail a risk of higher costs.","cn":"这一变化将伴随成本上涨的风险。"},{"en":"equate A with B","zh":"将 A 与 B 等同","ex":"Popularity should not be equated with effectiveness.","cn":"不应将受欢迎程度等同于有效性。"},{"en":"engage in debate","zh":"参与讨论","ex":"Experts engaged in debate over the proposed rule.","cn":"专家们就拟议中的规定展开辩论。"},{"en":"ensure that ...","zh":"确保……","ex":"The agency must ensure that the standards are met.","cn":"该机构必须确保达到标准。"},{"en":"enter into an agreement","zh":"达成协议","ex":"The two firms entered into an agreement to share technology.","cn":"两家公司签订了技术共享协议。"},{"en":"escape notice","zh":"未被注意到","ex":"The error escaped notice until the final review.","cn":"直到最后审查时，人们才注意到这个错误。"},{"en":"evaluate whether ...","zh":"评估是否……","ex":"The study evaluates whether the intervention improves outcomes.","cn":"研究评估干预措施是否能改善结果。"},{"en":"except for ...","zh":"除……之外","ex":"Except for one question, the survey was completed in full.","cn":"除了一个问题，这份调查问卷全部填写完毕。"},{"en":"expose A to B","zh":"使 A 暴露于 B 之下","ex":"The outdated system exposes users to security risks.","cn":"过时的系统使用户面临安全风险。"},{"en":"fail to address ...","zh":"未能处理……","ex":"The plan fails to address the causes of rising costs.","cn":"这一计划未能解决成本上涨的根源。"},{"en":"fall short of expectations","zh":"未达到预期","ex":"The initial results fell short of expectations.","cn":"初步结果低于预期。"},{"en":"follow from evidence","zh":"由证据推导得出","ex":"The conclusion does not follow from the available evidence.","cn":"这一结论不能从现有证据中推导出来。"},{"en":"follow through on a promise","zh":"兑现承诺；坚持把承诺落实","ex":"The company failed to follow through on its promise.","cn":"公司没有履行承诺。"},{"en":"for the sake of ...","zh":"为了……的缘故","ex":"The team delayed publication for the sake of accuracy.","cn":"为了确保准确性，团队推迟了发表时间。"},{"en":"force A to do B","zh":"迫使 A 做 B","ex":"The lawsuit forced the firm to disclose its records.","cn":"诉讼迫使公司披露记录。"},{"en":"give rise to concerns","zh":"引发担忧","ex":"The proposed merger gave rise to concerns about competition.","cn":"拟议中的合并引发了对竞争的担忧。"},{"en":"go against the evidence","zh":"与证据相矛盾","ex":"The claim appears to go against the evidence.","cn":"这一说法似乎与证据相悖。"},{"en":"go beyond the data","zh":"超出数据能够支持的范围","ex":"The author's interpretation goes beyond the data.","cn":"作者的解释超出了数据能够支持的范围。"},{"en":"go hand in hand with ...","zh":"与……相伴而生","ex":"Economic growth does not always go hand in hand with equality.","cn":"经济增长并不总是与平等同步。"},{"en":"have a bearing on ...","zh":"与……有关；对……有影响","ex":"The findings have a bearing on the proposed policy.","cn":"这些发现与拟议中的政策有关。"},{"en":"hinge on ...","zh":"取决于……；以……为关键","ex":"The outcome hinges on the court's interpretation.","cn":"结果取决于法院的解释。"},{"en":"hold that ...","zh":"认为；坚持主张……","ex":"The researchers hold that early support is essential.","cn":"研究人员认为早期支持必不可少。"},{"en":"imply that ...","zh":"暗示；意味着……","ex":"The findings imply that more research is necessary.","cn":"这些发现意味着还需要进一步研究。"},{"en":"impose A on B","zh":"把 A 强加于 B","ex":"The government imposed strict limits on the operators.","cn":"政府对运营商施加了严格限制。"},{"en":"in accordance with ...","zh":"依照……；符合……","ex":"The documents were prepared in accordance with the law.","cn":"这些文件是依法准备的。"},{"en":"in contrast to ...","zh":"与……形成对照","ex":"In contrast to the previous year, demand declined.","cn":"与上一年相比，需求下降了。"},{"en":"in effect","zh":"实际上；实质上","ex":"The new requirement is, in effect, a ban on the practice.","cn":"新要求实际上相当于禁止这种做法。"},{"en":"in light of the evidence","zh":"鉴于证据；考虑到证据","ex":"In light of the evidence, the panel revised its conclusion.","cn":"鉴于这些证据，专家组修改了结论。"},{"en":"in line with ...","zh":"与……一致；符合……","ex":"The decision was in line with the committee's recommendation.","cn":"这一决定符合委员会的建议。"},{"en":"in place of ...","zh":"代替……","ex":"The company used digital records in place of paper files.","cn":"公司使用电子记录代替纸质档案。"},{"en":"in response to ...","zh":"作为对……的回应","ex":"The agency changed the rules in response to complaints.","cn":"该机构因应投诉修改了规定。"},{"en":"in the face of ...","zh":"面对……；尽管有……","ex":"The committee continued in the face of opposition.","cn":"尽管遭到反对，委员会仍继续推进。"},{"en":"in turn","zh":"继而；反过来；依次","ex":"Higher costs reduced investment, which in turn slowed growth.","cn":"成本增加减少了投资，而投资减少又导致增长放缓。"},{"en":"infer A from B","zh":"根据 B 推断 A","ex":"We cannot infer a causal connection from the correlation.","cn":"我们不能从相关关系中推断出因果联系。"},{"en":"interfere with ...","zh":"干扰；妨碍……","ex":"The new rules may interfere with routine business activities.","cn":"新规定可能妨碍日常商业活动。"},{"en":"interpret A as B","zh":"把 A 解释为 B","ex":"The court interpreted the statement as a promise.","cn":"法院将这份声明解释为一种承诺。"},{"en":"be likely to ...","zh":"可能会……","ex":"Demand is likely to fall if prices rise.","cn":"如果价格上涨，需求很可能下降。"},{"en":"lay the groundwork for ...","zh":"为……奠定基础","ex":"The research laid the groundwork for later discoveries.","cn":"这项研究为后来的发现奠定了基础。"},{"en":"lead to a result","zh":"导致某种结果","ex":"A series of experiments led to an unexpected result.","cn":"一系列实验带来了意想不到的结果。"},{"en":"lend support to a claim","zh":"为某种主张提供支持","ex":"The data lend support to the claim that costs are rising.","cn":"数据支持成本正在上升的说法。"},{"en":"leave room for doubt","zh":"留下怀疑空间","ex":"The small sample leaves room for doubt.","cn":"样本量过小，使人仍有理由怀疑。"},{"en":"make a case for ...","zh":"为……提出论据","ex":"The report makes a case for stronger regulation.","cn":"报告提出了加强监管的理由。"},{"en":"make sense of ...","zh":"理解；弄清……","ex":"The model helps researchers make sense of the results.","cn":"该模型帮助研究人员理解结果。"},{"en":"make up for a loss","zh":"弥补损失","ex":"The subsidy helped make up for a loss of income.","cn":"这项补贴有助于弥补收入损失。"},{"en":"measure up to a standard","zh":"达到某项标准","ex":"The system failed to measure up to the safety standard.","cn":"该系统未能达到安全标准。"},{"en":"mistake A for B","zh":"把 A 错当成 B","ex":"Readers sometimes mistake correlation for causation.","cn":"读者有时会把相关关系误认为因果关系。"},{"en":"not necessarily imply ...","zh":"不一定意味着……","ex":"Greater confidence does not necessarily imply greater knowledge.","cn":"信心增强并不必然意味着知识增加。"},{"en":"on account of ...","zh":"由于……","ex":"The hearing was delayed on account of new evidence.","cn":"由于出现新证据，听证会被推迟。"},{"en":"on the grounds that ...","zh":"理由是……；根据……的理由","ex":"The judge rejected the claim on the grounds that it lacked evidence.","cn":"法官以缺乏证据为由驳回了这一主张。"},{"en":"on the premise that ...","zh":"基于……这一前提","ex":"The plan rests on the premise that costs will decline.","cn":"该计划建立在成本会下降这一前提之上。"},{"en":"on the verge of ...","zh":"处于即将……的边缘","ex":"The firm was on the verge of bankruptcy.","cn":"公司濒临破产。"},{"en":"opt for ...","zh":"选择……","ex":"The council opted for a cheaper alternative.","cn":"委员会选择了成本更低的替代方案。"},{"en":"originate in ...","zh":"起源于……","ex":"The idea originated in an earlier debate.","cn":"这个想法源于早先的一场辩论。"},{"en":"owe A to B","zh":"把 A 归功于 B；A 是由于 B","ex":"The project owes its success to local volunteers.","cn":"项目的成功归功于当地志愿者。"},{"en":"pay off in the long run","zh":"从长远看取得成效","ex":"Early investment in education can pay off in the long run.","cn":"早期教育投资从长远来看能够获得回报。"},{"en":"point to evidence","zh":"指向某种证据；表明","ex":"The author points to evidence of a wider problem.","cn":"作者指出了一个更广泛问题的证据。"},{"en":"pose a challenge to ...","zh":"对……构成挑战","ex":"Rising costs pose a challenge to small firms.","cn":"成本上涨给小企业带来了挑战。"},{"en":"prompt A to do B","zh":"促使 A 做 B","ex":"The findings prompted officials to reconsider the rule.","cn":"这些发现促使官员重新考虑规定。"},{"en":"provide for ...","zh":"规定……；为……作准备","ex":"The contract provides for annual inspections.","cn":"合同规定每年进行检查。"},{"en":"put forward a theory","zh":"提出理论","ex":"The researchers put forward a theory to explain the pattern.","cn":"研究人员提出了一套解释这种模式的理论。"},{"en":"question the validity of ...","zh":"质疑……的有效性","ex":"Critics question the validity of the survey.","cn":"批评者质疑这项调查的有效性。"},{"en":"raise doubts about ...","zh":"对……提出疑问","ex":"The findings raise doubts about the original explanation.","cn":"这些发现让人怀疑最初的解释。"},{"en":"rather than ...","zh":"而不是……","ex":"The study focuses on evidence rather than opinion.","cn":"这项研究关注证据而不是观点。"},{"en":"reflect on a decision","zh":"认真思考、反省某项决定","ex":"The committee reflected on its decision after the review.","cn":"委员会在审查之后反思了自己的决定。"},{"en":"reflect public concern","zh":"反映公众关切","ex":"The protests reflect public concern about safety.","cn":"抗议活动反映了公众对安全的担忧。"},{"en":"regard A as B","zh":"把 A 看作 B","ex":"The author regards the reform as a necessary step.","cn":"作者认为改革是必要的一步。"},{"en":"relate to ...","zh":"与……有关","ex":"The question relates to the costs of implementation.","cn":"这个问题与实施成本有关。"},{"en":"rely on assumptions","zh":"依靠假设","ex":"The forecast relies on several uncertain assumptions.","cn":"预测依赖于几个不确定的假设。"},{"en":"render A ineffective","zh":"使 A 失效","ex":"The exception rendered the rule ineffective.","cn":"这一例外使规定失去了效力。"},{"en":"result from ...","zh":"由……导致；起因于……","ex":"The delay resulted from a shortage of materials.","cn":"延误是材料短缺造成的。"},{"en":"result in ...","zh":"导致……","ex":"The change resulted in higher prices.","cn":"这种变化导致价格上涨。"},{"en":"resist pressure to ...","zh":"抵制要求……的压力","ex":"The panel resisted pressure to approve the plan quickly.","cn":"专家组抵制了要求迅速批准计划的压力。"},{"en":"rule out an explanation","zh":"排除某种解释","ex":"The test ruled out one possible explanation.","cn":"测试排除了一种可能的解释。"},{"en":"see through a claim","zh":"识破某种说法","ex":"Careful readers saw through the misleading claim.","cn":"细心的读者识破了这一误导性说法。"},{"en":"set out to do ...","zh":"着手、打算做……","ex":"The study set out to identify the main causes of the decline.","cn":"该研究旨在找出下降的主要原因。"},{"en":"signal a shift in ...","zh":"表明……出现转变","ex":"The decision signaled a shift in public policy.","cn":"这一决定标志着公共政策的转变。"},{"en":"speak to a broader issue","zh":"涉及并说明一个更广泛的问题","ex":"The case speaks to a broader issue of accountability.","cn":"此案涉及更广泛的问责问题。"},{"en":"stem from ...","zh":"源于……","ex":"The disagreement stems from different interpretations.","cn":"分歧源于不同的解释。"},{"en":"subject A to B","zh":"使 A 承受 B；让 A 接受 B","ex":"The law subjects firms to regular inspections.","cn":"这部法律要求企业接受定期检查。"},{"en":"substitute A for B","zh":"以 A 代替 B","ex":"Schools substituted online lessons for in-person classes.","cn":"学校用在线课程代替面授课程。"},{"en":"take A into account","zh":"把 A 考虑在内","ex":"The report takes regional differences into account.","cn":"报告考虑了地区差异。"},{"en":"take issue with ...","zh":"对……表示不同意；提出异议","ex":"The economist takes issue with the government's estimate.","cn":"经济学家对政府的估计提出异议。"},{"en":"take place","zh":"发生；举行","ex":"The meeting took place on Tuesday.","cn":"会议于周二举行。"},{"en":"take the view that ...","zh":"持有……的观点","ex":"The author takes the view that stronger safeguards are needed.","cn":"作者认为需要更有力的保障措施。"},{"en":"tend to do ...","zh":"往往会……；倾向于……","ex":"Consumers tend to avoid products they consider unsafe.","cn":"消费者往往会避开他们认为不安全的产品。"},{"en":"testify to ...","zh":"证明；证实……","ex":"The results testify to the importance of early intervention.","cn":"这些结果证明了早期干预的重要性。"},{"en":"throw light on ...","zh":"阐明……；使……更清楚","ex":"The newly discovered records throw light on the debate.","cn":"新发现的记录有助于阐明这场辩论。"},{"en":"trace A to B","zh":"追溯 A 的来源至 B","ex":"The study traces the decline to higher energy prices.","cn":"该研究将这种下降追溯到更高的能源价格。"},{"en":"translate into ...","zh":"转化为……","ex":"Greater efficiency can translate into lower costs.","cn":"更高的效率可以转化为更低的成本。"},{"en":"turn out to be ...","zh":"结果证明是……","ex":"The initial estimate turned out to be inaccurate.","cn":"初步估计后来被证明不准确。"},{"en":"under the assumption that ...","zh":"在假定……的情况下","ex":"The analysis was conducted under the assumption that demand was stable.","cn":"这项分析是在需求稳定的假设下开展的。"},{"en":"work against ...","zh":"不利于……；妨碍……","ex":"The rule may work against the goal of encouraging innovation.","cn":"这项规定可能不利于鼓励创新的目标。"},{"en":"work toward a goal","zh":"朝某个目标努力","ex":"The agencies are working toward a common goal.","cn":"这些机构正朝着共同目标努力。"},{"en":"warrant further study","zh":"有必要进一步研究","ex":"These unexpected findings warrant further study.","cn":"这些意外发现值得进一步研究。"},{"en":"weigh against ...","zh":"成为不利于……的因素","ex":"High costs weigh against the proposed solution.","cn":"高昂成本是不利于采纳该方案的因素。"},{"en":"without regard to ...","zh":"不考虑……；不顾……","ex":"The rule was applied without regard to individual circumstances.","cn":"这一规定的执行没有考虑个人具体情况。"},{"en":"with a view to doing ...","zh":"以……为目的","ex":"The committee met with a view to resolving the dispute.","cn":"委员会开会旨在解决争端。"},{"en":"yield to pressure","zh":"屈服于压力","ex":"The company yielded to pressure and revised its policy.","cn":"公司迫于压力让步并修改了政策。"},{"en":"be aimed at ...","zh":"旨在……；针对……","ex":"The measures are aimed at reducing emissions.","cn":"这些措施旨在减少排放。"},{"en":"be directed at ...","zh":"针对……；指向……","ex":"The criticism was directed at the firm's management.","cn":"批评针对的是公司的管理层。"},{"en":"be opposed to ...","zh":"反对……","ex":"Most residents were opposed to the plan.","cn":"大多数居民反对这项计划。"},{"en":"be open to question","zh":"尚有疑问；值得商榷","ex":"The accuracy of the report is open to question.","cn":"这份报告的准确性值得怀疑。"},{"en":"be open to interpretation","zh":"存在不同解释的空间","ex":"The final sentence is open to interpretation.","cn":"最后一句话有多种解释方式。"},{"en":"be credited with ...","zh":"被认为有……功劳","ex":"The scientists were credited with the discovery.","cn":"科学家被认为在这项发现中功不可没。"},{"en":"be mistaken for ...","zh":"被误认为……","ex":"A lack of protest should not be mistaken for support.","cn":"没有抗议不应被误认为是支持。"},{"en":"be concerned about ...","zh":"担心……；关切……","ex":"Consumers are concerned about online privacy.","cn":"消费者担心网络隐私。"},{"en":"be concerned with ...","zh":"涉及……；与……有关","ex":"The paper is concerned with the costs of reform.","cn":"这篇论文关注改革的成本。"},{"en":"show concern for ...","zh":"表现出对……的关心","ex":"The government should show concern for vulnerable people.","cn":"政府应该关心弱势群体。"},{"en":"be a case in point","zh":"是一个恰当的例子","ex":"The railway dispute is a case in point.","cn":"铁路争议就是一个恰当的例子。"},{"en":"it follows that ...","zh":"由此可以推断……","ex":"The costs exceed the benefits; it follows that the plan needs revision.","cn":"成本超过收益，因此计划需要修订。"},{"en":"the point is that ...","zh":"关键在于……","ex":"The point is that the evidence is still incomplete.","cn":"关键在于证据仍不完整。"},{"en":"it remains unclear whether ...","zh":"是否……仍不明确","ex":"It remains unclear whether the policy will succeed.","cn":"目前尚不清楚该政策能否成功。"},{"en":"there is no evidence that ...","zh":"没有证据表明……","ex":"There is no evidence that the company altered the figures.","cn":"没有证据表明该公司篡改了数字。"},{"en":"there is little evidence that ...","zh":"几乎没有证据表明……","ex":"There is little evidence that the restriction improved safety.","cn":"几乎没有证据表明这项限制提高了安全性。"},{"en":"the evidence does not suggest ...","zh":"证据并未表明……","ex":"The evidence does not suggest that prices will fall.","cn":"证据并不表明价格会下降。"},{"en":"a lack of evidence for ...","zh":"缺乏支持……的证据","ex":"The report highlights a lack of evidence for the claim.","cn":"报告强调这一说法缺乏证据支持。"},{"en":"be consistent with ...","zh":"与……一致；符合……","ex":"These results are consistent with the earlier study.","cn":"这些结果与早期研究一致。"},{"en":"be incompatible with ...","zh":"与……不相容","ex":"The two requirements may be incompatible with each other.","cn":"这两项要求可能相互矛盾。"},{"en":"be contingent on ...","zh":"以……为条件；取决于……","ex":"Approval is contingent on the completion of safety tests.","cn":"批准取决于安全测试是否完成。"},{"en":"be independent of ...","zh":"独立于……；不依赖……","ex":"The findings are independent of the funding source.","cn":"这些发现不受资金来源的影响。"},{"en":"be dependent on ...","zh":"依赖于……","ex":"The program is dependent on continued public funding.","cn":"这个项目依赖持续的公共资金支持。"},{"en":"be irrelevant to ...","zh":"与……无关","ex":"The minister's personal beliefs are irrelevant to the legal issue.","cn":"部长的个人信仰与这一法律问题无关。"},{"en":"be directly related to ...","zh":"与……直接相关","ex":"The decline is directly related to rising costs.","cn":"这种下降与成本上涨直接相关。"},{"en":"be loosely associated with ...","zh":"与……存在较弱关联","ex":"The two variables are only loosely associated with each other.","cn":"这两个变量之间只有较弱的关联。"},{"en":"be closely linked to ...","zh":"与……密切相关","ex":"The results are closely linked to differences in income.","cn":"这些结果与收入差异密切相关。"},{"en":"be traced back to ...","zh":"可追溯到……","ex":"The error can be traced back to the first calculation.","cn":"这个错误可以追溯到第一次计算。"},{"en":"be rooted in ...","zh":"根源在于……","ex":"The conflict is rooted in a disagreement over ownership.","cn":"这场冲突根源于所有权方面的分歧。"},{"en":"be grounded in evidence","zh":"以证据为依据","ex":"The policy may be grounded in evidence.","cn":"该政策可能以证据为基础。"},{"en":"be indicative of ...","zh":"表明……；是……的迹象","ex":"Rising complaints may be indicative of wider problems.","cn":"投诉数量增加可能预示着更广泛的问题。"},{"en":"be evidence of ...","zh":"是……的证据","ex":"A delay alone is not evidence of misconduct.","cn":"仅有延误并不能证明存在不当行为。"},{"en":"be a response to ...","zh":"是对……的回应","ex":"The new rule was a response to public complaints.","cn":"新规定是对公众投诉的回应。"},{"en":"be resistant to ...","zh":"抵制……；对……有抵抗力","ex":"Some bacteria are resistant to the treatment.","cn":"某些细菌对这种治疗具有耐药性。"},{"en":"be receptive to ...","zh":"愿意接受……","ex":"Officials were receptive to the new proposal.","cn":"官员们愿意接受新提案。"},{"en":"be sensitive to ...","zh":"对……敏感","ex":"Demand is sensitive to changes in price.","cn":"需求对价格变化十分敏感。"},{"en":"be inclined to ...","zh":"倾向于……","ex":"Some voters are inclined to support the reform.","cn":"一些选民倾向于支持改革。"},{"en":"be reluctant to ...","zh":"不情愿……","ex":"Firms may be reluctant to share their data.","cn":"企业可能不愿分享自己的数据。"},{"en":"be committed to doing ...","zh":"致力于……","ex":"The agency is committed to protecting personal information.","cn":"该机构致力于保护个人信息。"},{"en":"be entitled to ...","zh":"有权获得……","ex":"Employees are entitled to paid leave.","cn":"员工有权享受带薪休假。"},{"en":"be eligible for ...","zh":"符合……的申请资格","ex":"Low-income households may be eligible for assistance.","cn":"低收入家庭可能符合获得援助的资格。"},{"en":"be liable to ...","zh":"可能遭受……；负有……责任（依语境）","ex":"The company is liable to pay compensation if it breaks the contract.","cn":"如果公司违约，就有责任支付赔偿。"},{"en":"be prone to ...","zh":"容易……；倾向发生……","ex":"Small samples are prone to random errors.","cn":"小样本容易出现随机误差。"},{"en":"be vulnerable to ...","zh":"容易受到……影响","ex":"Older systems are vulnerable to cyberattacks.","cn":"较旧的系统容易受到网络攻击。"},{"en":"be accountable for ...","zh":"对……承担责任","ex":"The director is accountable for the agency's spending.","cn":"主任需要对该机构的支出负责。"},{"en":"be responsible for ...","zh":"负责……；是……的原因","ex":"The committee is responsible for
