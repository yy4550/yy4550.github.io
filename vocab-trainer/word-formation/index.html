<script>
'use strict';
const WORDS=[{"en":"unexpected","zh":"意料之外的","ex":"The unexpected result forced the researchers to revise their theory.","cn":"这一出乎意料的结果迫使研究人员修正理论。","cat":"前缀派生词","formation":"un-（否定）+ expected"},{"en":"unavoidable","zh":"不可避免的","ex":"Some degree of uncertainty is unavoidable in long-term forecasts.","cn":"长期预测中一定程度的不确定性不可避免。","cat":"前缀派生词","formation":"un- + avoidable"},{"en":"unprecedented","zh":"前所未有的","ex":"The city experienced unprecedented population growth.","cn":"这座城市经历了前所未有的人口增长。","cat":"前缀派生词","formation":"un- + precedented"},{"en":"unconventional","zh":"非传统的","ex":"Her unconventional approach challenged established teaching methods.","cn":"她的非传统方法挑战了既有的教学方式。","cat":"前缀派生词","formation":"un- + conventional"},{"en":"unreliable","zh":"不可靠的","ex":"Unreliable data can lead to misleading conclusions.","cn":"不可靠的数据可能导致误导性的结论。","cat":"前缀派生词","formation":"un- + reliable"},{"en":"unintentional","zh":"无意的","ex":"The policy had several unintentional consequences.","cn":"这项政策产生了一些意料之外的后果。","cat":"前缀派生词","formation":"un- + intentional"},{"en":"unproductive","zh":"低效的；无成效的","ex":"Lengthy meetings can become unproductive without a clear agenda.","cn":"没有明确议程，冗长的会议可能毫无成效。","cat":"前缀派生词","formation":"un- + productive"},{"en":"unemployment","zh":"失业；失业率","ex":"Rising unemployment placed pressure on public services.","cn":"失业率上升给公共服务带来了压力。","cat":"前缀派生词","formation":"un- + employment"},{"en":"underestimate","zh":"低估","ex":"We should not underestimate the influence of early education.","cn":"我们不应低估早期教育的影响。","cat":"前缀派生词","formation":"under-（不足）+ estimate"},{"en":"underfunded","zh":"资金不足的","ex":"Many rural schools remain underfunded.","cn":"许多农村学校仍然资金不足。","cat":"前缀派生词","formation":"under- + funded"},{"en":"underrepresented","zh":"代表性不足的","ex":"Women remain underrepresented in some technical fields.","cn":"女性在某些技术领域的代表性仍然不足。","cat":"前缀派生词","formation":"under- + represented"},{"en":"underdeveloped","zh":"欠发达的；发育不足的","ex":"Underdeveloped infrastructure limits economic opportunities.","cn":"不完善的基础设施限制了经济机会。","cat":"前缀派生词","formation":"under- + developed"},{"en":"undergraduate","zh":"本科生","ex":"Undergraduate students were invited to join the project.","cn":"本科生受邀参加该项目。","cat":"前缀派生词","formation":"under- + graduate"},{"en":"underlying","zh":"潜在的；根本的","ex":"The report examines the underlying causes of inequality.","cn":"报告考察了不平等的深层原因。","cat":"前缀派生词","formation":"under- + lying"},{"en":"undermine","zh":"削弱；破坏","ex":"Constant interruptions undermine concentration.","cn":"持续的打断会削弱注意力。","cat":"前缀派生词","formation":"under- + mine"},{"en":"undergo","zh":"经历；接受","ex":"Patients may undergo additional examinations.","cn":"患者可能接受进一步检查。","cat":"前缀派生词","formation":"under- + go"},{"en":"overestimate","zh":"高估","ex":"Managers often overestimate short-term demand.","cn":"管理者常常高估短期需求。","cat":"前缀派生词","formation":"over-（过度）+ estimate"},{"en":"overlook","zh":"忽视；未注意到","ex":"The study overlooked several important variables.","cn":"这项研究忽略了几个重要变量。","cat":"前缀派生词","formation":"over- + look"},{"en":"overcome","zh":"克服","ex":"Students need support to overcome language barriers.","cn":"学生需要支持才能克服语言障碍。","cat":"前缀派生词","formation":"over- + come"},{"en":"overall","zh":"总体的；总体上","ex":"The overall effect was smaller than expected.","cn":"总体效果比预期更小。","cat":"前缀派生词","formation":"over- + all"},{"en":"overwhelming","zh":"压倒性的；难以承受的","ex":"The evidence provides overwhelming support for the hypothesis.","cn":"这些证据为假设提供了压倒性的支持。","cat":"前缀派生词","formation":"over- + whelming"},{"en":"overconsumption","zh":"过度消费","ex":"Overconsumption contributes to environmental damage.","cn":"过度消费加剧了环境破坏。","cat":"前缀派生词","formation":"over- + consumption"},{"en":"overpopulation","zh":"人口过剩","ex":"Overpopulation can intensify pressure on housing.","cn":"人口过剩可能加重住房压力。","cat":"前缀派生词","formation":"over- + population"},{"en":"overconfident","zh":"过度自信的","ex":"Overconfident investors may ignore warning signs.","cn":"过度自信的投资者可能忽视警示信号。","cat":"前缀派生词","formation":"over- + confident"},{"en":"misunderstanding","zh":"误解","ex":"A minor misunderstanding developed into a serious dispute.","cn":"一个小误解演变成了严重争执。","cat":"前缀派生词","formation":"mis-（错误）+ understanding"},{"en":"misleading","zh":"误导性的","ex":"Averages can be misleading when the sample is small.","cn":"样本较小时，平均值可能产生误导。","cat":"前缀派生词","formation":"mis- + leading"},{"en":"misinterpret","zh":"误解；曲解","ex":"Readers may misinterpret the author's tone.","cn":"读者可能误解作者的语气。","cat":"前缀派生词","formation":"mis- + interpret"},{"en":"misconception","zh":"错误观念","ex":"The article challenges a widespread misconception about aging.","cn":"文章质疑了关于衰老的一种普遍误解。","cat":"前缀派生词","formation":"mis- + conception"},{"en":"misconduct","zh":"不当行为；失职","ex":"The investigation uncovered serious scientific misconduct.","cn":"调查揭露了严重的科研不端行为。","cat":"前缀派生词","formation":"mis- + conduct"},{"en":"misinformation","zh":"错误信息","ex":"Misinformation spreads quickly through social networks.","cn":"错误信息通过社交网络迅速传播。","cat":"前缀派生词","formation":"mis- + information"},{"en":"mismanagement","zh":"管理不善","ex":"Financial mismanagement weakened the organization.","cn":"财务管理不善削弱了该组织。","cat":"前缀派生词","formation":"mis- + management"},{"en":"miscalculate","zh":"误算；误判","ex":"The firm miscalculated the costs of expansion.","cn":"公司误判了扩张成本。","cat":"前缀派生词","formation":"mis- + calculate"},{"en":"reconsider","zh":"重新考虑","ex":"The committee agreed to reconsider its original decision.","cn":"委员会同意重新考虑最初的决定。","cat":"前缀派生词","formation":"re-（再次）+ consider"},{"en":"reassess","zh":"重新评估","ex":"Scientists must reassess their findings when new evidence appears.","cn":"出现新证据时，科学家必须重新评估发现。","cat":"前缀派生词","formation":"re- + assess"},{"en":"redefine","zh":"重新定义","ex":"Digital platforms have redefined how people access news.","cn":"数字平台重新定义了人们获取新闻的方式。","cat":"前缀派生词","formation":"re- + define"},{"en":"reconstruct","zh":"重建；还原","ex":"Researchers reconstructed the sequence of historical events.","cn":"研究人员还原了历史事件的先后顺序。","cat":"前缀派生词","formation":"re- + construct"},{"en":"reproduce","zh":"复制；繁殖","ex":"Other laboratories failed to reproduce the results.","cn":"其他实验室未能复现这些结果。","cat":"前缀派生词","formation":"re- + produce"},{"en":"reallocate","zh":"重新分配","ex":"The agency plans to reallocate funds to public health.","cn":"该机构计划将资金重新分配给公共卫生。","cat":"前缀派生词","formation":"re- + allocate"},{"en":"reorganize","zh":"重组；重新组织","ex":"The company reorganized its internal departments.","cn":"公司重组了内部部门。","cat":"前缀派生词","formation":"re- + organize"},{"en":"rebuild","zh":"重建","ex":"Communities worked together to rebuild damaged schools.","cn":"社区合作重建受损学校。","cat":"前缀派生词","formation":"re- + build"},{"en":"rethink","zh":"重新思考","ex":"The crisis prompted policymakers to rethink their assumptions.","cn":"危机促使政策制定者重新思考既有假设。","cat":"前缀派生词","formation":"re- + think"},{"en":"reexamine","zh":"重新检查；重新审视","ex":"The court agreed to reexamine the evidence.","cn":"法院同意重新审查证据。","cat":"前缀派生词","formation":"re- + examine"},{"en":"precondition","zh":"前提条件","ex":"Public trust is a precondition for successful reform.","cn":"公众信任是改革成功的前提条件。","cat":"前缀派生词","formation":"pre-（预先）+ condition"},{"en":"preliminary","zh":"初步的；预备的","ex":"Preliminary findings suggest a link between sleep and memory.","cn":"初步发现表明睡眠与记忆之间存在联系。","cat":"前缀派生词","formation":"pre- + liminary"},{"en":"predictable","zh":"可预测的","ex":"Consumer behavior is not always predictable.","cn":"消费者行为并不总是可预测的。","cat":"前缀派生词","formation":"predict + -able"},{"en":"predetermine","zh":"预先决定","ex":"Economic background should not predetermine a child's future.","cn":"经济背景不应预先决定孩子的未来。","cat":"前缀派生词","formation":"pre- + determine"},{"en":"preexisting","zh":"预先存在的","ex":"The treatment may interact with preexisting conditions.","cn":"这种治疗可能与既有疾病相互影响。","cat":"前缀派生词","formation":"pre- + existing"},{"en":"prepaid","zh":"预付的","ex":"The scheme offers prepaid access to medical services.","cn":"该计划提供预付费医疗服务。","cat":"前缀派生词","formation":"pre- + paid"},{"en":"prevention","zh":"预防","ex":"Prevention is often cheaper than treatment.","cn":"预防往往比治疗成本更低。","cat":"前缀派生词","formation":"prevent + -ion"},{"en":"postwar","zh":"战后的","ex":"Postwar reconstruction transformed the country's economy.","cn":"战后重建改变了该国经济。","cat":"前缀派生词","formation":"post-（之后）+ war"},{"en":"postgraduate","zh":"研究生；研究生阶段的","ex":"She pursued postgraduate study in environmental science.","cn":"她攻读环境科学研究生课程。","cat":"前缀派生词","formation":"post- + graduate"},{"en":"postindustrial","zh":"后工业化的","ex":"Postindustrial cities face new employment challenges.","cn":"后工业化城市面临新的就业挑战。","cat":"前缀派生词","formation":"post- + industrial"},{"en":"postpone","zh":"推迟","ex":"The organizers decided to postpone the conference.","cn":"组织者决定推迟会议。","cat":"前缀派生词","formation":"post- + pone"},{"en":"interdisciplinary","zh":"跨学科的","ex":"Interdisciplinary research can reveal hidden connections.","cn":"跨学科研究能够揭示隐藏的联系。","cat":"前缀派生词","formation":"inter-（之间）+ disciplinary"},{"en":"interpersonal","zh":"人际的","ex":"Interpersonal trust is essential to teamwork.","cn":"人际信任对团队合作至关重要。","cat":"前缀派生词","formation":"inter- + personal"},{"en":"interconnected","zh":"相互联系的","ex":"Global supply chains are deeply interconnected.","cn":"全球供应链彼此紧密相连。","cat":"前缀派生词","formation":"inter- + connected"},{"en":"interdependent","zh":"相互依赖的","ex":"Economic growth and environmental quality are interdependent.","cn":"经济增长与环境质量相互依赖。","cat":"前缀派生词","formation":"inter- + dependent"},{"en":"intergenerational","zh":"代际的","ex":"Intergenerational mobility is shaped by access to education.","cn":"代际流动受到教育机会的影响。","cat":"前缀派生词","formation":"inter- + generational"},{"en":"internationalization","zh":"国际化","ex":"University internationalization has changed academic cooperation.","cn":"大学国际化改变了学术合作模式。","cat":"前缀派生词","formation":"inter- + nationalization"},{"en":"intraregional","zh":"区域内部的","ex":"Intraregional trade increased after transport costs fell.","cn":"运输成本下降后区域内部贸易增加。","cat":"前缀派生词","formation":"intra-（内部）+ regional"},{"en":"intrapersonal","zh":"个体内在的","ex":"Intrapersonal reflection can improve emotional awareness.","cn":"自我反思能够提高情绪觉察能力。","cat":"前缀派生词","formation":"intra- + personal"},{"en":"transnational","zh":"跨国的","ex":"Transnational companies operate across different legal systems.","cn":"跨国公司在不同法律体系下运营。","cat":"前缀派生词","formation":"trans-（跨越）+ national"},{"en":"transformation","zh":"转变；变革","ex":"The transformation of traditional media continues.","cn":"传统媒体的转型仍在继续。","cat":"前缀派生词","formation":"transform + -ation"},{"en":"transboundary","zh":"跨边界的","ex":"Air pollution is often a transboundary problem.","cn":"空气污染常常是跨边界的问题。","cat":"前缀派生词","formation":"trans- + boundary"},{"en":"transplant","zh":"移植；移植器官","ex":"Doctors performed a successful kidney transplant.","cn":"医生成功实施了一例肾移植。","cat":"前缀派生词","formation":"trans- + plant"},{"en":"subconscious","zh":"潜意识的","ex":"Subconscious biases can influence hiring decisions.","cn":"潜意识偏见可能影响招聘决定。","cat":"前缀派生词","formation":"sub-（下；次级）+ conscious"},{"en":"substandard","zh":"低于标准的","ex":"Substandard housing poses risks to public health.","cn":"不达标住房危及公众健康。","cat":"前缀派生词","formation":"sub- + standard"},{"en":"subdivision","zh":"细分；分支","ex":"The report divides the market into several subdivisions.","cn":"报告将市场划分为若干细分领域。","cat":"前缀派生词","formation":"sub- + division"},{"en":"subculture","zh":"亚文化","ex":"Online communities can develop distinctive subcultures.","cn":"网络社区可能形成独特的亚文化。","cat":"前缀派生词","formation":"sub- + culture"},{"en":"subsidize","zh":"补贴","ex":"Governments sometimes subsidize public transportation.","cn":"政府有时会补贴公共交通。","cat":"前缀派生词","formation":"subsidy + -ize"},{"en":"superficial","zh":"表面的；肤浅的","ex":"A superficial explanation cannot account for the evidence.","cn":"肤浅的解释无法说明这些证据。","cat":"前缀派生词","formation":"super- + ficial"},{"en":"superhuman","zh":"超人的","ex":"The story attributes superhuman abilities to its hero.","cn":"故事赋予主人公超人的能力。","cat":"前缀派生词","formation":"super-（超越）+ human"},{"en":"superpower","zh":"超级大国；超能力","ex":"A superpower can influence international institutions.","cn":"超级大国能够影响国际机构。","cat":"前缀派生词","formation":"super- + power"},{"en":"superimpose","zh":"叠加；覆盖","ex":"The researchers superimposed the two maps for comparison.","cn":"研究人员将两张地图叠加进行比较。","cat":"前缀派生词","formation":"super- + impose"},{"en":"coexist","zh":"共存","ex":"Traditional and digital media will continue to coexist.","cn":"传统媒体与数字媒体将继续共存。","cat":"前缀派生词","formation":"co-（共同）+ exist"},{"en":"cooperate","zh":"合作","ex":"The two universities agreed to cooperate on climate research.","cn":"两所大学同意合作开展气候研究。","cat":"前缀派生词","formation":"co- + operate"},{"en":"coauthor","zh":"合著者；共同撰写","ex":"She coauthored a paper on urban migration.","cn":"她合著了一篇研究城市迁移的论文。","cat":"前缀派生词","formation":"co- + author"},{"en":"cofounder","zh":"共同创办人","ex":"The cofounder stepped down after ten years.","cn":"这位联合创始人在十年后卸任。","cat":"前缀派生词","formation":"co- + founder"},{"en":"coevolution","zh":"共同进化","ex":"Coevolution shapes the relationship between plants and insects.","cn":"共同进化塑造植物与昆虫之间的关系。","cat":"前缀派生词","formation":"co- + evolution"},{"en":"multicultural","zh":"多元文化的","ex":"Multicultural classrooms can enrich student discussion.","cn":"多元文化课堂能够丰富学生讨论。","cat":"前缀派生词","formation":"multi-（多）+ cultural"},{"en":"multinational","zh":"跨国的；跨国公司","ex":"A multinational firm must adapt to local regulations.","cn":"跨国企业必须适应当地法规。","cat":"前缀派生词","formation":"multi- + national"},{"en":"multidisciplinary","zh":"多学科的","ex":"The project brought together a multidisciplinary team.","cn":"该项目召集了一支多学科团队。","cat":"前缀派生词","formation":"multi- + disciplinary"},{"en":"multifaceted","zh":"多方面的","ex":"Poverty is a multifaceted social issue.","cn":"贫困是一个涉及多方面的社会问题。","cat":"前缀派生词","formation":"multi- + faceted"},{"en":"multitask","zh":"同时处理多项任务","ex":"Constantly multitasking may reduce accuracy.","cn":"持续同时处理多项任务可能降低准确率。","cat":"前缀派生词","formation":"multi- + task"},{"en":"microorganism","zh":"微生物","ex":"Some microorganisms play crucial roles in soil health.","cn":"一些微生物对土壤健康至关重要。","cat":"前缀派生词","formation":"micro-（微小）+ organism"},{"en":"microeconomic","zh":"微观经济的","ex":"Microeconomic models examine individual decisions.","cn":"微观经济模型研究个体决策。","cat":"前缀派生词","formation":"micro- + economic"},{"en":"microscopic","zh":"微观的；显微镜下的","ex":"Microscopic evidence revealed damage to the cells.","cn":"显微观察证据显示细胞受损。","cat":"前缀派生词","formation":"micro- + scopic"},{"en":"macroeconomic","zh":"宏观经济的","ex":"Macroeconomic uncertainty affects investment decisions.","cn":"宏观经济不确定性影响投资决策。","cat":"前缀派生词","formation":"macro-（宏观）+ economic"},{"en":"macrostructure","zh":"宏观结构","ex":"The essay's macrostructure makes its argument easier to follow.","cn":"文章的宏观结构让论证更易理解。","cat":"前缀派生词","formation":"macro- + structure"},{"en":"counterargument","zh":"反驳论点","ex":"A strong essay addresses the main counterargument.","cn":"优秀的文章会回应主要反方论点。","cat":"前缀派生词","formation":"counter-（反向）+ argument"},{"en":"counterproductive","zh":"适得其反的","ex":"Excessive monitoring can be counterproductive.","cn":"过度监督可能适得其反。","cat":"前缀派生词","formation":"counter- + productive"},{"en":"counterbalance","zh":"抵消；制衡","ex":"Public oversight can counterbalance private interests.","cn":"公众监督可以制衡私人利益。","cat":"前缀派生词","formation":"counter- + balance"},{"en":"counterintuitive","zh":"违反直觉的","ex":"The experiment produced a counterintuitive finding.","cn":"实验得出了一个违反直觉的发现。","cat":"前缀派生词","formation":"counter- + intuitive"},{"en":"countermeasure","zh":"应对措施","ex":"Officials introduced countermeasures against misinformation.","cn":"官员推出了应对错误信息的措施。","cat":"前缀派生词","formation":"counter- + measure"},{"en":"antibacterial","zh":"抗菌的","ex":"Antibacterial products are not always necessary.","cn":"抗菌产品并非总是必需的。","cat":"前缀派生词","formation":"anti-（反对；抵抗）+ bacterial"},{"en":"antiwar","zh":"反战的","ex":"An antiwar movement gained support among students.","cn":"一场反战运动获得学生支持。","cat":"前缀派生词","formation":"anti- + war"},{"en":"antitrust","zh":"反垄断的","ex":"Antitrust laws aim to preserve market competition.","cn":"反垄断法旨在维护市场竞争。","cat":"前缀派生词","formation":"anti- + trust"},{"en":"antioxidant","zh":"抗氧化物","ex":"Some foods contain natural antioxidants.","cn":"某些食物含有天然抗氧化物。","cat":"前缀派生词","formation":"anti- + oxidant"},{"en":"nonverbal","zh":"非语言的","ex":"Nonverbal signals can reveal discomfort.","cn":"非语言信号可以透露不适感。","cat":"前缀派生词","formation":"non-（非）+ verbal"},{"en":"nonprofit","zh":"非营利的；非营利组织","ex":"A nonprofit organization published the survey.","cn":"一家非营利组织发布了这份调查。","cat":"前缀派生词","formation":"non- + profit"},{"en":"nonrenewable","zh":"不可再生的","ex":"Coal is a nonrenewable energy source.","cn":"煤炭是不可再生能源。","cat":"前缀派生词","formation":"non- + renewable"},{"en":"nonlinear","zh":"非线性的","ex":"The relationship between income and happiness may be nonlinear.","cn":"收入与幸福感的关系可能是非线性的。","cat":"前缀派生词","formation":"non- + linear"},{"en":"nonetheless","zh":"尽管如此","ex":"The sample was small; nonetheless, the pattern was clear.","cn":"样本虽小，但这一模式仍然清晰。","cat":"前缀派生词","formation":"none + the + less"},{"en":"inaccessible","zh":"难以获得的；无法进入的","ex":"Reliable health care remains inaccessible to many families.","cn":"许多家庭仍无法获得可靠医疗服务。","cat":"前缀派生词","formation":"in-（否定）+ accessible"},{"en":"incompatible","zh":"不兼容的；不相容的","ex":"The two systems are incompatible without an adapter.","cn":"没有适配器，这两套系统无法兼容。","cat":"前缀派生词","formation":"in- + compatible"},{"en":"inconsistent","zh":"不一致的","ex":"Inconsistent results require further investigation.","cn":"不一致的结果需要进一步调查。","cat":"前缀派生词","formation":"in- + consistent"},{"en":"inefficient","zh":"效率低的","ex":"Inefficient procedures waste time and resources.","cn":"低效流程浪费时间和资源。","cat":"前缀派生词","formation":"in- + efficient"},{"en":"invisible","zh":"看不见的","ex":"Many forms of unpaid labor remain invisible in official statistics.","cn":"许多无偿劳动未被官方统计反映。","cat":"前缀派生词","formation":"in- + visible"},{"en":"impractical","zh":"不切实际的","ex":"The proposal proved impractical under current conditions.","cn":"在当前条件下，该提案被证明不切实际。","cat":"前缀派生词","formation":"im-（否定）+ practical"},{"en":"immoral","zh":"不道德的","ex":"Some critics called the practice immoral.","cn":"一些批评者称这种做法不道德。","cat":"前缀派生词","formation":"im- + moral"},{"en":"irrelevant","zh":"无关的","ex":"Irrelevant information distracts readers from the main argument.","cn":"无关信息使读者偏离主要论点。","cat":"前缀派生词","formation":"ir-（否定）+ relevant"},{"en":"irregular","zh":"不规则的；不规律的","ex":"Irregular sleep schedules may affect concentration.","cn":"不规律的睡眠作息可能影响注意力。","cat":"前缀派生词","formation":"ir- + regular"},{"en":"illogical","zh":"不合逻辑的","ex":"The conclusion is illogical because it ignores the evidence.","cn":"这一结论不合逻辑，因为它忽略了证据。","cat":"前缀派生词","formation":"il-（否定）+ logical"},{"en":"disadvantage","zh":"不利条件；劣势","ex":"Lack of internet access is a major disadvantage.","cn":"缺乏网络接入是一个重大劣势。","cat":"前缀派生词","formation":"dis-（否定）+ advantage"},{"en":"disagreement","zh":"分歧","ex":"Disagreement among experts is not unusual.","cn":"专家之间存在分歧并不罕见。","cat":"前缀派生词","formation":"dis- + agreement"},{"en":"disconnection","zh":"脱节；断开连接","ex":"The disconnection between research and practice is worrying.","cn":"研究与实践脱节令人担忧。","cat":"前缀派生词","formation":"dis- + connection"},{"en":"disapprove","zh":"不赞成","ex":"Many residents disapprove of the proposed development.","cn":"许多居民不赞成拟议的开发项目。","cat":"前缀派生词","formation":"dis- + approve"},{"en":"disrupt","zh":"扰乱；中断","ex":"Extreme weather can disrupt food supplies.","cn":"极端天气可能扰乱食品供应。","cat":"前缀派生词","formation":"dis- + rupt"},{"en":"deindustrialization","zh":"去工业化","ex":"Deindustrialization altered employment patterns in the region.","cn":"去工业化改变了该地区的就业模式。","cat":"前缀派生词","formation":"de-（去除）+ industrialization"},{"en":"decentralization","zh":"去中心化；分权","ex":"Decentralization gave local authorities greater autonomy.","cn":"权力下放赋予地方机构更大自主权。","cat":"前缀派生词","formation":"de- + centralization"},{"en":"deforestation","zh":"森林砍伐","ex":"Deforestation threatens biodiversity.","cn":"森林砍伐威胁生物多样性。","cat":"前缀派生词","formation":"de- + forestation"},{"en":"deregulation","zh":"放松管制","ex":"Deregulation increased competition in the sector.","cn":"放松管制加剧了该行业竞争。","cat":"前缀派生词","formation":"de- + regulation"},{"en":"self-awareness","zh":"自我意识；自我觉察","ex":"Self-awareness can improve decision-making.","cn" ored","zh":"历史悠久的；由来已久的","ex":"The festival follows a time-honored tradition.","cn":"这个节日延续了由来已久的传统。","cat":"连字符复合词","formation":"time + honored"},{"en":"time-tested","zh":"久经考验的","ex":"Time-tested methods are not always sufficient for new problems.","cn":"久经考验的方法不一定能解决新问题。","cat":"连字符复合词","formation":"time + tested"},{"en":"full-time","zh":"全职的","ex":"Full-time employees receive additional benefits.","cn":"全职员工获得额外福利。","cat":"连字符复合词","formation":"full + time"},{"en":"part-time","zh":"兼职的","ex":"Part-time work can provide useful experience.","cn":"兼职工作可以提供有益经验。","cat":"连字符复合词","formation":"part + time"},{"en":"real-time","zh":"实时的","ex":"Real-time data allow faster responses.","cn":"实时数据支持更快速的应对。","cat":"连字符复合词","formation":"real + time"},{"en":"face-to-face","zh":"面对面的","ex":"Face-to-face interaction can build trust.","cn":"面对面互动能够建立信任。","cat":"连字符复合词","formation":"face + to + face"},{"en":"one-to-one","zh":"一对一的","ex":"One-to-one tutoring can address individual weaknesses.","cn":"一对一辅导能够针对个人薄弱环节。","cat":"连字符复合词","formation":"one + to + one"},{"en":"one-size-fits-all","zh":"一刀切的；适用于所有人的","ex":"A one-size-fits-all policy ignores local differences.","cn":"一刀切政策忽视地方差异。","cat":"连字符复合词","formation":"one + size + fits + all"},{"en":"step-by-step","zh":"循序渐进的","ex":"A step-by-step guide makes the procedure clearer.","cn":"分步指南使操作流程更清晰。","cat":"连字符复合词","formation":"step + by + step"},{"en":"case-by-case","zh":"逐案的；视情况而定的","ex":"Applications are reviewed on a case-by-case basis.","cn":"申请会逐案审核。","cat":"连字符复合词","formation":"case + by + case"},{"en":"word-for-word","zh":"逐字逐句的","ex":"Word-for-word translation can sound unnatural.","cn":"逐字翻译可能显得不自然。","cat":"连字符复合词","formation":"word + for + word"},{"en":"trial-and-error","zh":"反复试错的","ex":"Trial-and-error learning helps reveal hidden assumptions.","cn":"试错学习帮助揭示隐含假设。","cat":"连字符复合词","formation":"trial + and + error"},{"en":"cause-and-effect","zh":"因果关系的","ex":"The essay needs a clearer cause-and-effect explanation.","cn":"文章需 tion","zh":"能源转型","ex":"The energy transition creates new jobs and risks.","cn":"能源转型带来新的工作机会与风险。","cat":"开放式复合词与名词组合","formation":"energy + transition"},{"en":"natural resources","zh":"自然资源","ex":"Natural resources are unevenly distributed.","cn":"自然资源分布不均衡。","cat":"开放式复合词与名词组合","formation":"natural + resources"},{"en":"natural selection","zh":"自然选择","ex":"Natural selection favors traits that aid reproduction.","cn":"自然选择偏向有利于繁殖的性状。","cat":"开放式复合词与名词组合","formation":"natural + selection"},{"en":"natural disaster","zh":"自然灾害","ex":"A natural disaster can disrupt schooling for months.","cn":"自然灾害可能使学校停课数月。","cat":"开放式复合词与名词组合","formation":"natural + disaster"},{"en":"natural environment","zh":"自然环境","ex":"Tourism can place pressure on the natural environment.","cn":"旅游业可能给自然环境带来压力。","cat":"开放式复合词与名词组合","formation":"natural + environment"},{"en":"environmental protection","zh":"环境保护","ex":"Environmental protection requires public participation.","cn":"环境保护需要公众参与。","cat":"开放式复合词与名词组合","formation":"environmental + protection"},{"en":"environmental impact","zh":"环境影响","ex":"The project underwent an environmental impact assessment.","cn":"该项目接受了环境影响评估。","cat":"开放式复合词与名词组合","formation":"environmental + impact"},{"en":"biodiversity loss","zh":"生物多样性丧失","ex":"Biodiversity loss threatens ecosystem stability.","cn":"生物多样性丧失威胁生态系统稳定。","cat":"开放式复合词与名词组合","formation":"biodiversity + loss"},{"en":"habitat loss","zh":"栖息地丧失","ex":"Habitat loss endangers many species.","cn":"栖息地丧失危及许多物种。","cat":"开放式复合词与名词组合","formation":"habitat + loss"},{"en":"urban planning","zh":"城市规划","ex":"Urban planning should consider public transportation.","cn":"城市规划应考虑公共交通。","cat":"开放式复合词与名词组合","formation":"urban + planning"},{"en":"urban sprawl","zh":"城市蔓延","ex":"Urban sprawl can increase dependence on cars.","cn":"城市无序扩张可能增加对汽车的依赖。","cat":"开放式复合词与名词组合","formation":"urban + sprawl"},{"en":"urban renewal","zh":"城市更新","ex":"Urban renewal can displace existing residents.","cn":"城市更新可能迫使原有居民迁离。","cat":"开放式复合词与名词组合","formation":"urban + renewal"},{"en":"urban population","zh":"城市人口","ex":"The urban population has grown steadily.","cn":"城市人口持续增长。","cat":"开放式复合词与名词组合","formation":"urban + population"},{"en":"population density","zh":"人口密度","ex":"Population density affects housing demand.","cn":"人口密度影响住房需求。","cat":"开放式复合词与名词组合","formation":"population + density"},{"en":"population aging","zh":"人口老龄化","ex":"Population aging increases demand for care services.","cn":"人口老龄化增加照护服务需求。","cat":"开放式复合词与名词组合","formation":"population + aging"},{"en":"birth rate","zh":"出生率","ex":"The birth rate declined over the decade.","cn":"这十年间出生率下降了。","cat":"开放式复合词与名词组合","formation":"birth + rate"},{"en":"mortality rate","zh":"死亡率","ex":"The mortality rate fell after better treatment became available.","cn":"更好的治疗普及后死亡率下降了。","cat":"开放式复合词与名词组合","formation":"mortality + rate"},{"en":"migration patterns","zh":"迁移模式","ex":"Migration patterns have changed since the pandemic.","cn":"疫情以来迁移模式发生了变化。","cat":"开放式复合词与名词组合","formation":"migration + patterns"},{"en":"immigration policy","zh":"移民政策","ex":"Immigration policy shapes labor supply.","cn":"移民政策影响劳动力供给。","cat":"开放式复合词与名词组合","formation":"immigration + policy"},{"en":"cultural diversity","zh":"文化多样性","ex":"Cultural diversity can enrich local communities.","cn":"文化多样性能够丰富当地社区。","cat":"开放式复合词与名词组合","formation":"cultural + diversity"},{"en":"cultural identity","zh":"文化认同","ex":"Language plays a role in cultural identity.","cn":"语言在文化认同中发挥作用。","cat":"开放式复合词与名词组合","formation":"cultural + identity"},{"en":"cultural heritage","zh":"文化遗产","ex":"Local museums preserve cultural heritage.","cn":"地方博物馆保护文化遗产。","cat":"开放式复合词与名词组合","formation":"cultural + heritage"},{"en":"cultural exchange","zh":"文化交流","ex":"Cultural exchange programs help reduce stereotypes.","cn":"文化交流项目有助于减少刻板印象。","cat":"开放式复合词与名词组合","formation":"cultural + exchange"},{"en":"account for","zh":"解释；占比","ex":"Age alone cannot account for the difference in performance.","cn":"仅凭年龄无法解释表现差异。","cat":"高频动词搭配与固定表达","formation":"account + for"},{"en":"amount to","zh":"总计；相当于","ex":"The changes amount to a major shift in policy.","cn":"这些变化相当于一次重大政策转向。","cat":"高频动词搭配与固定表达","formation":"amount + to"},{"en":"arise from","zh":"由……引起","ex":"The conflict arose from a misunderstanding.","cn":"冲突源于一场误解。","cat":"高频动词搭配与固定表达","formation":"arise + from"},{"en":"result in","zh":"导致","ex":"Poor sleep may result in reduced concentration.","cn":"睡眠不足可能导致注意力下降。","cat":"高频动词搭配与固定表达","formation":"result + in"},{"en":"result from","zh":"起因于","ex":"The improvement resulted from consistent practice.","cn":"这一进步源于持续练习。","cat":"高频动词搭配与固定表达","formation":"result + from"},{"en":"contribute to","zh":"促进；导致","ex":"Access to education contributes to social mobility.","cn":"教育机会有助于社会流动。","cat":"高频动词搭配与固定表达","formation":"contribute + to"},{"en":"lead to","zh":"导致；通向","ex":"Unchecked assumptions can lead to false conclusions.","cn":"未经检验的假设可能导致错误结论。","cat":"高频动词搭配与固定表达","formation":"lead + to"},{"en":"give rise to","zh":"引起；产生","ex":"Rapid change can give rise to unexpected tensions.","cn":"快速变化可能引发意想不到的紧张局面。","cat":"高频动词搭配与固定表达","formation":"give + rise + to"},{"en":"stem from","zh":"源于","ex":"Many disagreements stem from different definitions.","cn":"许多分歧源于不同定义。","cat":"高频动词搭配与固定表达","formation":"stem + from"},{"en":"be attributed to","zh":"归因于","ex":"The decline can be attributed to several factors.","cn":"这一下降可归因于多个因素。","cat":"高频动词搭配与固定表达","formation":"attribute + to"},{"en":"be associated with","zh":"与……有关","ex":"High stress is associated with poor sleep.","cn":"高压力与睡眠不佳有关。","cat":"高频动词搭配与固定表达","formation":"associate + with"},{"en":"be linked to","zh":"与……相关","ex":"The findings were linked to earlier research.","cn":"这些发现与早期研究有关。","cat":"高频动词搭配与固定表达","formation":"link + to"},{"en":"be subject to","zh":"受……支配；可能遭受","ex":"All applications are subject to review.","cn":"所有申请均须接受审查。","cat":"高频动词搭配与固定表达","formation":"subject + to"},{"en":"be prone to","zh":"容易……","ex":"Young children are prone to imitate adults.","cn":"幼儿容易模仿成年人。","cat":"高频动词搭配与固定表达","formation":"prone + to"},{"en":"be susceptible to","zh":"易受……影响","ex":"Older systems may be susceptible to attack.","cn":"老旧系统可能容易受到攻击。","cat":"高频动词搭配与固定表达","formation":"susceptible + to"},{"en":"be vulnerable to","zh":"容易受到……伤害","ex":"Small firms are vulnerable to sudden price changes.","cn":"小企业容易受到价格突变的冲击。","cat":"高频动词搭配与固定表达","formation":"vulnerable + to"},{"en":"be exposed to","zh":"暴露于；接触到","ex":"Students are exposed to different viewpoints in discussion.","cn":"学生在讨论中接触不同观点。","cat":"高频动词搭配与固定表达","formation":"expose + to"},{"en":"be equipped with","zh":"配备有","ex":"The classroom is equipped with digital tools.","cn":"教室配备了数字工具。","cat":"高频动词搭配与固定表达","formation":"equip + with"},{"en":"be engaged in","zh":"从事；参与","ex":"The team is engaged in long-term research.","cn":"团队正在从事长期研究。","cat":"高频动词搭配与固定表达","formation":"engage + in"},{"en":"be involved in","zh":"参与；涉及","ex":"Parents should be involved in educational decisions.","cn":"家长应参与教育决策。","cat":"高频动词搭配与固定表达","formation":"involve + in"},{"en":"be committed to","zh":"致力于；承诺","ex":"The institution is committed to equal opportunity.","cn":"该机构致力于机会平等。","cat":"高频动词搭配与固定表达","formation":"commit + to"},{"en":"be dedicated to","zh":"致力于","ex":"The center is dedicated to preserving historical records.","cn":"该中心致力于保存历史记录。","cat":"高频动词搭配与固定表达","formation":"dedicate + to"},{"en":"be inclined to","zh":"倾向于","ex":"People may be inclined to favor familiar options.","cn":"人们可能倾向于选择熟悉的选项。","cat":"高频动词搭配与固定表达","formation":"incline + to"},{"en":"be bound to","zh":"必定；一定会","ex":"A hurried decision is bound to create problems.","cn":"仓促的决定势必带来问题。","cat":"高频动词搭配与固定表达","formation":"bound + to"},{"en":"be likely to","zh":"可能会","ex":"Older buildings are likely to need renovation.","cn":"老旧建筑很可能需要翻新。","cat":"高频动词搭配与固定表达","formation":"likely + to"},{"en":"be reluctant to","zh":"不愿意","ex":"Some firms are reluctant to share sensitive data.","cn":"一些公司不愿共享敏感数据。","cat":"高频动词搭配与固定表达","formation":"reluctant + to"},{"en":"be willing to","zh":"愿意","ex":"Most participants were willing to answer follow-up questions.","cn":"多数参与者愿意回答后续问题。","cat":"高频动词搭配与固定表达","formation":"willing + to"},{"en":"be entitled to","zh":"有权享有","ex":"Employees are entitled to paid leave under the policy.","cn":"根据政策，员工有权享受带薪休假。","cat":"高频动词搭配与固定表达","formation":"entitle + to"},{"en":"be capable of","zh":"能够；有能力","ex":"The model is capable of detecting subtle patterns.","cn":"该模型能够检测细微模式。","cat":"高频动词搭配与固定表达","formation":"capable + of"},{"en":"be responsible for","zh":"负责；是……的原因","ex":"Local agencies are responsible for implementation.","cn":"地方机构负责实施。","cat":"高频动词搭配与固定表达","formation":"responsible + for"},{"en":"be consistent with","zh":"与……一致","ex":"The results are consistent with the earlier hypothesis.","cn":"结果与先前假设一致。","cat":"高频动词搭配与固定表达","formation":"consistent + with"},{"en":"be compatible with","zh":"与……兼容","ex":"The software is compatible with older devices.","cn":"该软件兼容较旧设备。","cat":"高频动词搭配与固定表达","formation":"compatible + with"},{"en":"be comparable to","zh":"可与……相比","ex":"The new figures are comparable to last year's data.","cn":"新数据可与去年的数据进行比较。","cat":"高频动词搭配与固定表达","formation":"comparable + to"},{"en":"be relevant to","zh":"与……相关","ex":"The case is directly relevant to the debate.","cn":"这一案例与辩论直接相关。","cat":"高频动词搭配与固定表达","formation":"relevant + to"},{"en":"be essential to","zh":"对……至关重要","ex":"Trust is essential to effective cooperation.","cn":"信任对有效合作至关重要。","cat":"高频动词搭配与固定表达","formation":"essential + to"},{"en":"be crucial for","zh":"对……关键","ex":"Clear communication is crucial for successful teamwork.","cn":"清晰沟通对团队成功至关重要。","cat":"高频动词搭配与固定表达","formation":"crucial + for"},{"en":"be independent of","zh":"独立于；不受……影响","ex":"The result is independent of the sample order.","cn":"结果不受样本顺序影响。","cat":"高频动词搭配与固定表达","formation":"independent + of"},{"en":"be dependent on","zh":"依赖于","ex":"The project is dependent on public funding.","cn":"项目依赖公共资金。","cat":"高频动词搭配与固定表达","formation":"dependent + on"},{"en":"be derived from","zh":"源于；由……推导","ex":"The formula is derived from a general principle.","cn":"该公式由一般原理推导而来。","cat":"高频动词搭配与固定表达","formation":"derive + from"},{"en":"be based on","zh":"基于","ex":"The policy is based on preliminary evidence.","cn":"该政策基于初步证据。","cat":"高频动词搭配与固定表达","formation":"base + on"},{"en":"take into account","zh":"考虑到","ex":"The analysis should take regional differences into account.","cn":"分析应考虑地区差异。","cat":"高频动词搭配与固定表达","formation":"take + into + account"},{"en":"take advantage of","zh":"利用","ex":"Small firms can take advantage of digital platforms.","cn":"小企业可以利用数字平台。","cat":"高频动词搭配与固定表达","formation":"take + advantage + of"},{"en":"take for granted","zh":"想当然；认为理所当然","ex":"We often take reliable internet access for granted.","cn":"我们常把稳定的网络接入视为理所当然。","cat":"高频动词搭配与固定表达","formation":"take + for + granted"},{"en":"take precedence over","zh":"优先于","ex":"Public safety must take precedence over convenience.","cn":"公共安全必须优先于便利性。","cat":"高频动词搭配与固定表达","formation":"take + precedence + over"},{"en":"take responsibility for","zh":"对……负责","ex":"Institutions must take responsibility for their decisions.","cn":"机构必须对自身决策负责。","cat":"高频动词搭配与固定表达","formation":"take + responsibility + for"},{"en":"take measures to","zh":"采取措施以……","ex":"Cities should take measures to reduce air pollution.","cn":"城市应采取措施减少空气污染。","cat":"高频动词搭配与固定表达","formation":"take + measures + to"},{"en":"have access to","zh":"能够获得；有机会使用","ex":"Not all students have access to reliable computers.","cn":"并非所有学生都能使用可靠的电脑。","cat":"高频动词搭配与固定表达","formation":"have + access + to"},{"en":"have an impact on","zh":"对……产生影响","ex":"Rising prices have an impact on household spending.","cn":"价格上涨影响家庭支出。","cat":"高频动词搭配与固定表达","formation":"have + an + impact + on"},{"en":"have implications for","zh":"对……具有影响；意味着","ex":"The finding has implications for future education policy.","cn":"这一发现对未来教育政策具有启示。","cat":"高频动词搭配与固定表达","formation":"have + implications + for"},{"en":"have a tendency to","zh":"倾向于","ex":"Readers have a tendency to trust familiar sources.","cn":"读者倾向于信任熟悉的信息来源。","cat":"高频动词搭配与固定表达","formation":"have + a + tendency + to"},{"en":"make a difference","zh":"产生影响；起作用","ex":"Small changes in teaching can make a difference.","cn":"教学中的小改变也能起作用。","cat":"高频动词搭配与固定表达","formation":"make + a + difference"},{"en":"make sense of","zh":"理解；弄明白","ex":"The framework helps us make sense of complex data.","cn":"该框架帮助我们理解复杂数据。","cat":"高频动词搭配与固定表达","formation":"make + sense + of"},{"en":"make up for","zh":"弥补","ex":"Extra practice can make up for missed classes.","cn":"额外练习可以弥补缺课。","cat":"高频动词搭配与固定表达","formation":"make + up + for"},{"en":"make room for","zh":"为……腾出空间","ex":"Schools should make room for creative activities.","cn":"学校应为创造性活动留出空间。","cat":"高频动词搭配与固定表达","formation":"make + room + for"},{"en":"make use of","zh":"利用","ex":"The study makes use of historical records.","cn":"研究利用了历史记录。","cat":"高频动词搭配与固定表达","formation":"make + use + of"},{"en":"make the most of","zh":"充分利用","ex":"Students should make the most of library resources.","cn":"学生应充分利用图书馆资源。","cat":"高频动词搭配与固定表达","formation":"make + the + most + of"},{"en":"make an effort to","zh":"努力去做","ex":"The author makes an effort to present both sides.","cn":"作者努力呈现双方观点。","cat":"高频动词搭配与固定表达","formation":"make + an + effort + to"},{"en":"make a contribution to","zh":"为……作贡献","ex":"Volunteers make a contribution to community life.","cn":"志愿者为社区生活作贡献。","cat":"高频动词搭配与固定表达","formation":"make + a + contribution + to"},{"en":"make a distinction between","zh":"区分","ex":"The report makes a distinction between correlation and causation.","cn":"报告区分了相关性与因果性。","cat":"高频动词搭配与固定表达","formation":"make + a + distinction + between"},{"en":"draw a conclusion","zh":"得出结论","ex":"It is too early to draw a conclusion from the data.","cn":"仅凭这些数据现在下结论还为时过早。","cat":"高频动词搭配与固定表达","formation":"draw + a + conclusion"},{"en":"draw attention to","zh":"引起对……的关注","ex":"The article draws attention to unequal access to care.","cn":"文章让人关注医疗服务获取不平等。","cat":"高频动词搭配与固定表达","formation":"draw + attention + to"},{"en":"draw on","zh":"利用；借鉴","ex":"The theory draws on ideas from psychology.","cn":"该理论借鉴了心理学观点。","cat":"高频动词搭配与固定表达","formation":"draw + on"},{"en":"bring about","zh":"引起；导致","ex":"The reform brought about major social changes.","cn":"改革带来了重大的社会变化。","cat":"高频动词搭配与固定表达","formation":"bring + about"},{"en":"bring up","zh":"提出；抚养","ex":"The speaker brought up a difficult ethical question.","cn":"演讲者提出了一个棘手的伦理问题。","cat":"高频动词搭配与固定表达","formation":"bring + up"},{"en":"bring forward","zh":"提出；提前","ex":"The committee brought forward a new proposal.","cn":"委员会提出了新提案。","cat":"高频动词搭配与固定表达","formation":"bring + forward"},{"en":"bring into question","zh":"使受到质疑","ex":"The new evidence brings the claim into question.","cn":"新证据使这一主张受到质疑。","cat":"高频动词搭配与固定表达","formation":"bring + into + question"},{"en":"carry out","zh":"执行；开展","ex":"Researchers carried out a series of experiments.","cn":"研究人员开展了一系列实验。","cat":"高频动词搭配与固定表达","formation":"carry + out"},{"en":"carry on","zh":"继续","ex":"Despite setbacks, the team carried on with its work.","cn":"尽管遇到挫折，团队仍继续工作。","cat":"高频动词搭配与固定表达","formation":"carry + on"},{"en":"carry over","zh":"延续；影响到","ex":"Habits formed in childhood may carry over into adulthood.","cn":"童年形成的习惯可能延续到成年。","cat":"高频动词搭配与固定表达","formation":"carry + over"},{"en":"carry weight","zh":"有分量；有影响力","ex":"Expert opinions often carry weight in public debate.","cn":"专家意见在公共讨论中往往有分量。","cat":"高频动词搭配与固定表达","formation":"carry + weight"},{"en":"set out to","zh":"着手；打算","ex":"The researchers set out to test a common assumption.","cn":"研究人员着手检验一个普遍假设。","cat":"高频动词搭配与固定表达","formation":"set + out + to"},{"en":"set aside","zh":"留出；搁置","ex":"The team set aside funds for future maintenance.","cn":"团队留出了未来维护资金。","cat":"高频动词搭配与固定表达","formation":"set + aside"},{"en":"set up","zh":"建立；设置","ex":"The university set up a new research center.","cn":"大学建立了新的研究中心。","cat":"高频动词搭配与固定表达","formation":"set + up"},{"en":"set off","zh":"引发；触发","ex":"The announcement set off a heated debate.","cn":"公告引发了激烈讨论。","cat":"高频动词搭配与固定表达","formation":"set + off"},{"en":"set the stage for","zh":"为……创造条件","ex":"Early reforms set the stage for further changes.","cn":"早期改革为进一步变革创造了条件。","cat":"高频动词搭配与固定表达","formation":"set + the + stage + for"},{"en":"put forward","zh":"提出","ex":"The paper puts forward a new explanation.","cn":"论文提出了一种新解释。","cat":"高频动词搭配与固定表达","formation":"put + forward"},{"en":"put pressure on","zh":"向……施加压力","ex":"Rising costs put pressure on small businesses.","cn":"成本上涨给小企业施加压力。","cat":"高频动词搭配与固定表达","formation":"put + pressure + on"},{"en":"put an end to","zh":"结束；终止","ex":"The agreement put an end to the dispute.","cn":"协议结束了争端。","cat":"高频动词搭配与固定表达","formation":"put + an + end + to"},{"en":"put into practice","zh":"付诸实践","ex":"The organization struggled to put its ideals into practice.","cn":"该组织难以将理念付诸实践。","cat":"高频动词搭配与固定表达","formation":"put + into + practice"},{"en":"come across","zh":"偶然遇到；偶然发现","ex":"Readers may come across unfamiliar terms.","cn":"读者可能遇到不熟悉的术语。","cat":"高频动词搭配与固定表达","formation":"come + across"},{"en":"come up with","zh":"想出；提出","ex":"The team came up with a practical solution.","cn":"团队想出了切实可行的解决方案。","cat":"高频动词搭配与固定表达","formation":"come + up + with"},{"en":"come to terms with","zh":"接受；适应","ex":"Communities must come to terms with demographic change.","cn":"社区必须适应人口结构变化。","cat":"高频动词搭配与固定表达","formation":"come + to + terms + with"},{"en":"come into effect","zh":"生效","ex":"The new regulation will come into effect next year.","cn":"新规将于明年生效。","cat":"高频动词搭配与固定表达","formation":"come + into + effect"},{"en":"come into play","zh":"开始发挥作用","ex":"Institutional factors come into play when markets fail.","cn":"市场失灵时制度因素开始发挥作用。","cat":"高频动词搭配与固定表达","formation":"come + into + play"},{"en":"come under scrutiny","zh":"受到审查","ex":"The company came under scrutiny over data privacy.","cn":"公司因数据隐私问题受到审查。","cat":"高频动词搭配与固定表达","formation":"come + under + scrutiny"},{"en":"look into","zh":"调查","ex":"The committee will look into the complaints.","cn":"委员会将调查这些投诉。","cat":"高频动词搭配与固定表达","formation":"look + into"},{"en":"look beyond","zh":"超越……看问题","ex":"Policymakers should look beyond short-term gains.","cn":"政策制定者应超越短期收益看问题。","cat":"高频动词搭配与固定表达","formation":"look + beyond"},{"en":"look up to","zh":"尊敬；仰慕","ex":"Many students look up to their teachers.","cn":"许多学生尊敬自己的老师。","cat":"高频动词搭配与固定表达","formation":"look + up + to"},{"en":"look down on","zh":"轻视","ex":"No profession should be looked down on.","cn":"任何职业都不应被轻视。","cat":"高频动词搭配与固定表达","formation":"look + down + on"},{"en":"look forward to","zh":"期待","ex":"Researchers look forward to further collaboration.","cn":"研究人员期待进一步合作。","cat":"高频动词搭配与固定表达","formation":"look + forward + to"},{"en":"look back on","zh":"回顾","ex":"Graduates often look back on their university years fondly.","cn":"毕业生常怀着美好回忆回顾大学时光。","cat":"高频动词搭配与固定表达","formation":"look + back + on"},{"en":"keep pace with","zh":"跟上……步伐","ex":"Education must keep pace with technological change.","cn":"教育必须跟上技术变革的步伐。","cat":"高频动词搭配与固定表达","formation":"keep + pace + with"},{"en":"keep track of","zh":"记录；追踪","ex":"The app helps learners keep track of their progress.","cn":"这个应用帮助学习者追踪学习进度。","cat":"高频动词搭配与固定表达","formation":"keep + track + of"},{"en":"keep an eye on","zh":"留意；关注","ex":"Regulators should keep an eye on emerging risks.","cn":"监管者应留意新出现的风险。","cat":"高频动词搭配与固定表达","formation":"keep + an + eye + on"},{"en":"keep in mind","zh":"牢记","ex":"Keep in mind that correlation does not prove causation.","cn":"要记住相关性不能证明因果性。","cat":"高频动词搭配与固定表达","formation":"keep + in + mind"},{"en":"keep up with","zh":"赶上；跟上","ex":"Workers struggle to keep up with rapid changes.","cn":"劳动者难以跟上快速变化。","cat":"高频动词搭配与固定表达","formation":"keep + up + with"},{"en":"keep away from","zh":"远离","ex":"Children should keep away from dangerous equipment.","cn":"儿童应远离危险设备。","cat":"高频动词搭配与固定表达","formation":"keep + away + from"},{"en":"fall behind","zh":"落后","ex":"Students without internet access may fall behind.","cn":"无法上网的学生可能落后。","cat":"高频动词搭配与固定表达","formation":"fall + behind"},{"en":"fall short of","zh":"未达到","ex":"The policy fell short of its stated goals.","cn":"政策未达到宣称的目标。","cat":"高频动词搭配与固定表达","formation":"fall + short + of"},{"en":"fall into","zh":"陷入；归入","ex":"The data fall into three main categories.","cn":"数据可归入三大类。","cat":"高频动词搭配与固定表达","formation":"fall + into"},{"en":"fall apart","zh":"瓦解；崩溃","ex":"The agreement fell apart after months of negotiation.","cn":"经过数月谈判，协议最终破裂。","cat":"高频动词搭配与固定表达","formation":"fall + apart"},{"en":"break down","zh":"分解；失灵；崩溃","ex":"The report breaks down spending by category.","cn":"报告按类别分解支出。","cat":"高频动词搭配与固定表达","formation":"break + down"},{"en":"break through","zh":"突破","ex":"The team broke through a technical barrier.","cn":"团队突破了一项技术障碍。","cat":"高频动词搭配与固定表达","formation":"break + through"},{"en":"break away from","zh":"摆脱；脱离","ex":"The company tried to break away from old practices.","cn":"公司试图摆脱旧有做法。","cat":"高频动词搭配与固定表达","formation":"break + away + from"},{"en":"break with","zh":"与……决裂；打破惯例","ex":"The theory breaks with traditional assumptions.","cn":"这一理论打破了传统假设。","cat":"高频动词搭配与固定表达","formation":"break + with"},{"en":"cut down on","zh":"减少","ex":"Cities encourage residents to cut down on plastic waste.","cn":"城市鼓励居民减少塑料垃圾。","cat":"高频动词搭配与固定表达","formation":"cut + down + on"},{"en":"cut back on","zh":"削减","ex":"Families cut back on spending during uncertainty.","cn":"不确定时期家庭削减支出。","cat":"高频动词搭配与固定表达","formation":"cut + back + on"},{"en":"cut off","zh":"切断；中断","ex":"The storm cut off access to the village.","cn":"暴风雨切断了通往村庄的道路。","cat":"高频动词搭配与固定表达","formation":"cut + off"},{"en":"cut across","zh":"跨越；涉及","ex":"The problem cuts across several academic disciplines.","cn":"这个问题涉及多个学科。","cat":"高频动词搭配与固定表达","formation":"cut + across"},{"en":"rule out","zh":"排除","ex":"The researchers could not rule out alternative explanations.","cn":"研究人员无法排除其他解释。","cat":"高频动词搭配与固定表达","formation":"rule + out"},{"en":"point out","zh":"指出","ex":"The reviewer pointed out a serious limitation.","cn":"审稿人指出一个严重局限。","cat":"高频动词搭配与固定表达","formation":"point + out"},{"en":"figure out","zh":"弄清楚；想明白","ex":"Scientists are trying to figure out why the pattern occurs.","cn":"科学家正试图弄清这一模式出现的原因。","cat":"高频动词搭配与固定表达","formation":"figure + out"},{"en":"find out","zh":"查明；发现","ex":"The survey aims to find out what students need.","cn":"调查旨在了解学生需要什么。","cat":"高频动词搭配与固定表达","formation":"find + out"},{"en":"sort out","zh":"解决；理清","ex":"The team must sort out conflicting evidence.","cn":"团队必须理清相互矛盾的证据。","cat":"高频动词搭配与固定表达","formation":"sort + out"},{"en":"work out","zh":"解决；算出；进展顺利","ex":"The researchers worked out a more efficient method.","cn":"研究人员想出了一种更高效的方法。","cat":"高频动词搭配与固定表达","formation":"work + out"},{"en":"phase out","zh":"逐步淘汰","ex":"The city plans to phase out older buses.","cn":"城市计划逐步淘汰老旧公交车。","cat":"高频动词搭配与固定表达","formation":"phase + out"},{"en":"phase in","zh":"逐步引入","ex":"The new rules will be phased in over two years.","cn":"新规将在两年内逐步实施。","cat":"高频动词搭配与固定表达","formation":"phase + in"},{"en":"scale up","zh":"扩大规模","ex":"The project needs funding to scale up.","cn":"项目需要资金来扩大规模。","cat":"高频动词搭配与固定表达","formation":"scale + up"},{"en":"scale down","zh":"缩小规模","ex":"The company scaled down its expansion plans.","cn":"公司缩减了扩张计划。","cat":"高频动词搭配与固定表达","formation":"scale + down"},{"en":"achievement","zh":"成就","ex":"Academic achievement depends on more than raw ability.","cn":"学业成就不仅取决于天赋。","cat":"后缀派生词","formation":"achieve + -ment"},{"en":"adjustment","zh":"调整；适应","ex":"The adjustment to a new environment takes time.","cn":"适应新环境需要时间。","cat":"后缀派生词","formation":"adjust + -ment"},{"en":"advancement","zh":"进步；晋升","ex":"Scientific advancement often involves repeated failure.","cn":"科学进步往往伴随着反复失败。","cat":"后缀派生词","formation":"advance + -ment"},{"en":"assessment","zh":"评估","ex":"Assessment should measure genuine understanding.","cn":"评估应衡量真正的理解程度。","cat":"后缀派生词","formation":"assess + -ment"},{"en":"commitment", const N=WORDS.length, STORAGE='kaoyan-english-word-formation-2026-v1';
const app=document.getElementById('app');
const range=()=>Array.from({length:N},(_,i)=>i);
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr;}
const makeDefault=()=>({version:1,mode:'ordered',favs:{},easy:{},sessions:{},view:'home',currentKey:'ordered'});
function load(){try{const raw=localStorage.getItem(STORAGE);if(!raw)return makeDefault();const r=JSON.parse(raw);if(!r||r.version!==1)return makeDefault();return {...makeDefault(),...r,view:'home',favs:r.favs||{},easy:r.easy||{},sessions:r.sessions||{}};}catch(e){return makeDefault();}}
let state=load(),revealed=new Set(),listType='favorites',searchQuery='',listCount=40,detailId=0,detailReturn='study',detailIds=[],detailCnRevealed=false,toastTimer=0,suppressClickUntil=0,fromSearch=false;
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify({...state,view:'home'}));}catch(e){console.warn('本地存储失败',e);}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function modeLabel(k){return ({ordered:'顺序刷词',random:'乱序刷词',favorites:'收藏复习',easy:'简单词复习'})[k]||'顺序刷词';}
function eligible(k,id){if(k==='favorites')return!!state.favs[id];if(k==='easy')return!!state.easy[id];return!state.easy[id];}
function buildOrder(k){let ids=range().filter(i=>eligible(k,i));return k==='random'?shuffle(ids):ids;}
function newSession(k){return{order:buildOrder(k),cursor:0,group:[],round:1,groupNo:0,completed:0,history:[],historyIndex:-1};}
// 兼容上一版的本地学习进度与备份。每条历史只存 7 个词 ID，不复制整个乱序列表。
function groupSnapshot(s){return{group:[...s.group],round:s.round,groupNo:s.groupNo,completed:s.completed};}
function ensureHistory(s){
 if(!Array.isArray(s.history))s.history=[];
 if(!Number.isInteger(s.historyIndex))s.historyIndex=s.history.length-1;
 if(!s.history.length&&Array.isArray(s.group)&&s.group.length){s.history.push(groupSnapshot(s));s.historyIndex=0;}
 if(s.history.length)s.historyIndex=Math.max(0,Math.min(s.historyIndex,s.history.length-1));
 else s.historyIndex=-1;
}
function session(k){
 if(!state.sessions[k]||!Array.isArray(state.sessions[k].order))state.sessions[k]=newSession(k);
 const s=state.sessions[k];ensureHistory(s);return s;
}
function restoreHistory(s,index){
 const item=s.history[index];if(!item)return false;
 s.historyIndex=index;s.group=[...item.group];s.round=item.round;s.groupNo=item.groupNo;s.completed=item.completed;
 persist();return true;
}
function rememberCurrentGroup(s){
 if(!s.group.length)return;
 // 只有在最新组向前推进时才生成新组；回看组使用历史快照而不是重新抽词。
 s.history.push(groupSnapshot(s));s.historyIndex=s.history.length-1;persist();
}
function syncCollection(k){if(k!=='favorites'&&k!=='easy')return;const s=state.sessions[k];if(!s)return;const ids=buildOrder(k),old=s.order.filter(Number.isInteger);if(ids.length!==old.length||ids.some((id,i)=>id!==old[i]))state.sessions[k]=newSession(k);}
function pullGroup(k,advance=true){let s=session(k);if(!advance&&s.group&&s.group.length)return s.group;
 if(advance&&s.group&&s.group.length)s.completed+=s.group.length;
 s.group=[];
 const valid=()=>s.order.some(id=>eligible(k,id));
 if(!valid()){s.cursor=0;persist();return[];}
 if(s.cursor>=s.order.length){s.round++;s.groupNo=0;s.completed=0;s.order=buildOrder(k);s.cursor=0;}
 while(s.cursor<s.order.length && s.group.length<7){const id=s.order[s.cursor++];if(eligible(k,id))s.group.push(id);}
 if(!s.group.length && valid()){
  s.round++;s.groupNo=0;s.completed=0;s.order=buildOrder(k);s.cursor=0;
  while(s.cursor<s.order.length&&s.group.length<7){const id=s.order[s.cursor++];if(eligible(k,id))s.group.push(id);}
 }
 if(s.group.length)s.groupNo++;
 persist();return s.group;
}
function currentSession(){return session(state.currentKey||state.mode);}
function notify(msg){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.append(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),2200);}
function setFav(id){if(state.favs[id])delete state.favs[id];else state.favs[id]=1;persist();notify(state.favs[id]?'已收藏，收藏页可查看':'已取消收藏');rerender();}
function setEasy(id){if(state.easy[id])delete state.easy[id];else state.easy[id]=1;persist();notify(state.easy[id]?'已标记简单，下次刷词自动跳过':'已移出简单，重新加入刷词');rerender();}
function go(view){state.view=view;searchQuery='';listCount=40;revealed=new Set();render();window.scrollTo({top:0});}
function startStudy(k){
 state.currentKey=k||state.mode;syncCollection(state.currentKey);
 const s=session(state.currentKey);
 if(!s.group.length){pullGroup(state.currentKey,true);rememberCurrentGroup(s);}
 state.view='study';revealed=new Set();persist();render();window.scrollTo({top:0});
}
function nextGroup(){
 const s=currentSession();ensureHistory(s);
 if(s.historyIndex<s.history.length-1){restoreHistory(s,s.historyIndex+1);}
 else {pullGroup(state.currentKey,true);rememberCurrentGroup(s);}
 revealed=new Set();render();window.scrollTo({top:0});
}
function prevGroup(){
 const s=currentSession();ensureHistory(s);
 if(s.historyIndex<=0)return;
 restoreHistory(s,s.historyIndex-1);
 revealed=new Set();render();window.scrollTo({top:0});
}
function openDetail(id,origin){detailId=id;detailCnRevealed=false;detailReturn=origin||state.view;detailIds=detailReturn==='study'?[...currentSession().group]:detailReturn==='list'?collectionIds():detailReturn==='search'?searchResults(250):[id];state.view='detail';render();window.scrollTo({top:0});}
function backDetail(){state.view=detailReturn==='search'?'search':detailReturn;render();window.scrollTo({top:0});}
function collectionIds(){return range().filter(i=>listType==='easy'?state.easy[i]:state.favs[i]);}
function searchResults(cap=100){const q=searchQuery.trim().toLocaleLowerCase();if(!q)return[];return range().filter(i=>{const w=WORDS[i];return w.en.toLocaleLowerCase().includes(q)||w.zh.includes(q)||w.ex.toLocaleLowerCase().includes(q)||w.cn.includes(q);}).slice(0,cap);}

function renderHome(){const s=session(state.mode),tot=N-count('easy'),pct=tot?Math.min(100,s.completed/tot*100):100;
return `${hdr('极速刷词','home','settings')}<main class="content">
<div class="hero panel"><div class="eyebrow">🔥 当前刷词</div><h2>《考研英语一 · 构词法与复合表达》</h2><div class="sub">768 条中英双语词条 · 每组 7 条 · 离线可用</div>

${show?`<div class="actions-line"><button class="mini-action gold ${isFav?'on':''}" data-action="fav" data-id="${id}">${isFav?'★ 已收藏':'☆ 收藏'}</button><button class="mini-action ${isEasy?'on':''}" data-action="easy" data-id="${id}">${isEasy?'✓ 已标简单':'✓ 标记简单'}</button></div>`:''}</article>`;}
function renderStudy(){const k=state.currentKey,s=currentSession(),tot=k==='favorites'?count('favorites'):k==='easy'?count('easy'):N-count('easy');let current=s.group||[];
let html=`${hdr('极速刷词','home','search')}<main class="content"><div class="study-stat"><div><span class="small-label">${modeLabel(k)} · 第 ${s.round} 轮</span><div><strong>${s.groupNo||1}</strong><span class="muted"> 组 · 7 条/组</span></div></div>${s.historyIndex>0?'<button type="button" class="prev-group-btn" data-action="prev" aria-label="返回上一组单词">↶ 上一组</button>':'<span class="prev-group-placeholder" aria-hidden="true"></span>'}<div class="muted">已推进 ${s.completed} / ${tot}</div></div><div class="group-description">${k==='easy'?'简单词复习不会改变「下次跳过」设置':k==='favorites'?'收藏词单独复习，保留收藏标记':'先自己回忆，再点卡片看意思；点箭头查看例句。'}</div>`;
if(!current.length){html+=`<div class="panel empty"><div class="empty-icon">✓</div><b>这里还没有可复习的词条</b><p>${k==='ordered'||k==='random'?'全部词条都被标记简单了。可前往简单词页面恢复。':'先在刷词页收藏或标记词条。'}</p></div><div style="margin-top:18px"><button class="cta secondary" data-action="go" data-view="home">返回主页</button></div>`;}
else{html+=current.map(card).join('')+`<div class="swipe-hint"><span>← 左滑收藏</span><span>右滑标简单 →</span></div><div class="spacer-bottom"></div><button class="cta floating-cta" data-action="next">下一组　→</button>`;}
return html+`</main>${nav('study')}`;}
function renderList(){let kind=listType,ids=collectionIds(),total=ids.length;const title=kind==='favorites'?'收藏词本':'简单词本';let show=ids.slice(0,listCount);return `${hdr(title,'home','search')}<main class="content"><div class="list-head"><div><h2>${kind==='favorites'?'☆':'✓'}　${title}</h2><small>${total} 条 · ${kind==='easy'?'已从常规刷词移除':'保留在正常刷词中'}</small></div><span class="pill">${total} 条</span></div>
${ids.length?`${show.map(id=>{const w=WORDS[id];return `<div class="list-item"><button class="item-main" data-action="detail" data-id="${id}"><strong>${esc(w.en)}</strong><small>${esc(w.zh)}</small></button><button class="small-button" data-action="${kind==='easy'?'easy':'fav'}" data-id="${id}">${kind==='easy'?'恢复':'取消收藏'}</button></div>`;}).join('')}${total>listCount?`<div style="margin-top:10px"><button class="cta secondary" data-action="more">加载更多（还剩 ${total-listCount} 条）</button></div>`:''}<div class="spacer-bottom"></div><button class="cta floating-cta" data-action="start" data-key="${kind}">${kind==='favorites'?'复习收藏':'复习简单词'}　→</button>`:`<div class="panel empty"><div class="empty-icon">${kind==='favorites'?'☆':'✓'}</div><b>${kind==='favorites'?'还没有收藏的词条':'还没有标记简单的词条'}</b><p>在刷词页面${kind==='favorites'?'向左滑动':'向右滑动'}词卡，即可加入这里。</p><button class="small-button" data-action="go" data-view="home">去刷词</button></div>`}
</main>${nav(kind)}`;}
function renderDetail(){const w=WORDS[detailId],fav=!!state.favs[detailId],easy=!!state.easy[detailId],idx=detailIds.indexOf(detailId);return `${hdr('词条详情',detailReturn==='study'?'study':detailReturn==='list'?'list':detailReturn,'')}
<main class="content"><section class="detail-hero"><div class="detail-mini">词条 ${detailId+1} / ${N}</div><h2>${esc(w.en)}</h2><p>${esc(w.zh)}</p><div class="formation-tags"><span class="morph-cat">${esc(w.cat)}</span><span class="morph-note">${esc(w.formation)}</span></div></section>
<section class="panel detail-example"><h3>英文例句</h3><div class="en-ex">${esc(w.ex)}</div><div class="line"></div><button type="button" class="translation-toggle" data-action="toggleCn" aria-expanded="${detailCnRevealed}" aria-controls="translation-content"><span>中文翻译</span><span class="translation-hint">${detailCnRevealed?'点击隐藏 ⌃':'点击显示 ⌄'}</span></button>${detailCnRevealed?`<div class="cn-ex" id="translation-content">${esc(w.cn)}</div>`:''}</section>
<div class="detail-tools"><button class="tool-button ${fav?'star-on':''}" data-action="fav" data-id="${detailId}">${fav?'★ 已收藏':'☆ 收藏词条'}</button><button class="tool-button ${easy?'active':''}" data-action="easy" data-id="${detailId}">${easy?'✓ 已标简单 · 点此恢复':'✓ 标记简单'}</button></div>
${detailIds.length>1?`<div class="detail-navigation"><button data-action="prevdetail" ${idx<=0?'disabled':''}>‹ 上一条</button><button data-action="nextdetail" ${idx<0||idx>=detailIds.length-1?'disabled':''}>下一条 ›</button></div>`:''}
<div class="page-note">「简单」词条不会再出现在普通刷词模式中，可随时恢复。</div></main>${nav(detailReturn==='list'?listType:'home')}`;}
function renderSearch(){const found=searchResults(100);return `${hdr('搜索词条','home','')}<main class="content"><input id="search-box" class="search-input" autofocus placeholder="搜索英文表达、中文释义或例句" value="${esc(searchQuery)}" autocomplete="off" spellcheck="false"><div id="search-results"><div class="search-title">${searchQuery?`找到 ${found.length}${found.length===100?'+' :''} 条匹配结果（最多显示100条）`:'输入关键词，从 768 条词库中查找'}</div>${found.map(id=>{let w=WORDS[id];return `<div class="list-item"><button class="item-main" data-action="detail" data-id="${id}" data-origin="search"><strong>${esc(w.en)}</strong><small>${esc(w.zh)}</small></button><button class="small-button" data-action="fav" data-id="${id}">${state.favs[id]?'★':'☆'}</button></div>`;}).join('')}</div></main>${nav('home')}`;}
function renderSettings(){return `${hdr('设置与备份','home','')}<main class="content"><section class="panel setting-card"><h3>学习记录</h3><p>已收藏 ${count('favorites')} 条；标记简单 ${count('easy')} 条。正常刷词会跳过简单词；收藏和简单词在各自页面仍然可查看、复习。</p><div class="settings-row"><button data-action="export">↓ 导出进度备份</button><button data-action="import">↑ 导入进度备份</button></div><input class="hidden-file" type="file" id="import-file" accept=".json,application/json"></section>
<section class="panel setting-card"><h3>重置操作</h3><p>重新开始会清空组数与顺序/乱序进度，但保留收藏和简单标记。完全清除会删除所有本机记录。</p><div class="settings-row"><button data-action="resetSession">重新开始轮次</button><button class="danger" data-action="resetAll">清除全部数据</button></div></section>
<section class="panel setting-card"><h3>使用说明</h3><div class="help-steps">① 每次一组 7 条，点击单词或释义区域切换显示/隐藏。<br>② 词卡向左滑收藏，向右滑标记为简单；也可显示释义后点操作按钮。<br>③ 右侧 › 进入词条详情，先看英文例句；中文翻译默认隐藏，点击「中文翻译」显示或再次隐藏。<br>④ 收藏、简单词有独立页面，简单词可点「恢复」。<br>⑤ 每组可点击顶部「上一组」返回刚背过的 7 条；再点「下一组」可回到后续原组，不会重新抽词。<br>⑥ 顺序与乱序分别记住学习进度，刷新后可继续。</div></section>
<section class="panel setting-card"><h3>数据保存在哪里？</h3><p>这是一份可以离线打开的单文件网页，768 条词汇和例句已内置。收藏、简单词和进度保存在当前浏览器的本地存储中，不会自动同步到其他手机、浏览器或设备。部分浏览器清除数据、切换文件位置或升级后可能丢失记录，建议定期导出 JSON 备份。</p></section></main>${nav('settings')}`;}
function render(){app.innerHTML=state.view==='study'?renderStudy():state.view==='list'?renderList():state.view==='detail'?renderDetail():state.view==='search'?renderSearch():state.view==='settings'?renderSettings():renderHome();}
function rerender(){const y=window.scrollY;render();window.scrollTo({top:y});}
function changeMode(mode){state.mode=mode;state.currentKey=mode;persist();render();}
function list(kind){listType=kind;go('list');}
function exportProgress(){const payload={app:'考研英语一极速刷词',exportedAt:new Date().toISOString(),wordCount:N,data:{...state,view:'home'}};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});let url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='考研英语_刷词进度备份_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);notify('已生成进度备份');}
function importProgress(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(parsed.wordCount!==N||!parsed.data||parsed.data.version!==1)throw Error('这不是当前版本的备份');if(!confirm('导入会覆盖当前收藏、简单词和学习进度，确认继续？'))return;let d=parsed.data;if(typeof d.favs!=='object'||typeof d.easy!=='object'||typeof d.sessions!=='object')throw Error('文件缺少记录数据');state={...makeDefault(),...d,view:'home',favs:d.favs,easy:d.easy,sessions:d.sessions,mode:['ordered','random'].includes(d.mode)?d.mode:'ordered',currentKey:'ordered'};persist();render();notify('进度导入成功');}catch(err){alert('导入失败：'+err.message);}};reader.readAsText(file,'utf-8');}
function resetSessions(){if(!confirm('确认重新开始轮次？收藏和简单标记都会保留。'))return;state.sessions={};state.currentKey=state.mode;persist();render();notify('轮次已重新开始');}
function resetAll(){if(!confirm('即将清空全部进度、收藏和简单词标记，确认吗？'))return;if(!confirm('再次确认：此操作不可撤销。建议先导出备份。'))return;state=makeDefault();persist();render();notify('已清除本地记录');}
app.addEventListener('click',e=>{if(Date.now()<suppressClickUntil)return;const t=e.target.closest('[data-action]');if(!t||t.disabled)return;const a=t.dataset.action,id=Number(t.dataset.id);switch(a){case 'go':go(t.dataset.view);break;case 'mode':changeMode(t.dataset.mode);break;case 'start':startStudy(t.dataset.key);break;case 'next':nextGroup();break;case 'prev':prevGroup();break;case 'reveal':revealed.has(id)?revealed.delete(id):revealed.add(id);rerender();break;case 'toggleCn':detailCnRevealed=!detailCnRevealed;rerender();break;case 'detail':openDetail(id,t.dataset.origin||state.view);break;case 'fav':setFav(id);break;case 'easy':setEasy(id);break;case 'list':list(t.dataset.kind);break;case 'more':listCount+=50;rerender();break;case 'prevdetail':{const i=detailIds.indexOf(detailId);if(i>0){detailId=detailIds[i-1];detailCnRevealed=false;render();window.scrollTo({top:0});}break;}case 'nextdetail':{const i=detailIds.indexOf(detailId);if(i>=0&&i<detailIds.length-1){detailId=detailIds[i+1];detailCnRevealed=false;render();window.scrollTo({top:0});}break;}case 'export':exportProgress();break;case 'import':document.getElementById('import-file')?.click();break;case 'resetSession':resetSessions();break;case 'resetAll':resetAll();break;}});
app.addEventListener('change',e=>{if(e.target.id==='import-file')importProgress(e.target.files[0]);});
app.addEventListener('input',e=>{if(e.target.id==='search-box'){searchQuery=e.target.value;const found=searchResults(100);document.getElementById('search-results').innerHTML=`<div class="search-title">${searchQuery?`匹配 ${found.length}${found.length===100?'+':''} 条（显示前100条）`:'输入关键词，从 768 条词库中查找'}</div>`+found.map(id=>{let w=WORDS[id];return `<div class="list-item"><button class="item-main" data-action="detail" data-id="${id}" data-origin="search"><strong>${esc(w.en)}</strong><small>${esc(w.zh)}</small></button><button class="small-button" data-action="fav" data-id="${id}">${state.favs[id]?'★':'☆'}</button></div>`;}).join('');}});
// 手势：词卡向左划收藏，向右划标简单。竖向滚动不受影响。
let touch=null;
app.addEventListener('touchstart',e=>{const el=e.target.closest('.study-card');if(!el||e.touches.length!==1){touch=null;return;}touch={id:Number(el.dataset.word),x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
app.addEventListener('touchend',e=>{if(!touch||!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;const id=touch.id;touch=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.3){suppressClickUntil=Date.now()+600;if(dx<0)setFav(id);else setEasy(id);}},{passive:true});
app.addEventListener('touchcancel',()=>touch=null,{passive:true});
render();
window.__VOCAB_DEBUG={count:()=>WORDS.length,state:()=>state,mode:changeMode,start:startStudy,next:nextGroup,prev:prevGroup,fav:setFav,easy:setEasy,detail:openDetail,reset:()=>{state=makeDefault();persist();render();},getWord:i=>WORDS[i]};
if(new URLSearchParams(location.search).has('smoke')){
 try{let log=[];if(WORDS.length!==1829)throw Error('wrong count');log.push('data=1829');changeMode('ordered');startStudy('ordered');if(currentSession().group.length!==7)throw Error('wrong group');log.push('group=7');let id=currentSession().group[0];setFav(id);if(!state.favs[id])throw Error('favorite');log.push('fav=ok');setEasy(id);if(!state.easy[id])throw Error('easy');log.push('easy=ok');nextGroup();if(currentSession().group.includes(id))throw Error('skip easy failed');log.push('next=ok');let w=WORDS[id];if(!w.ex||!w.cn)throw Error('examples');log.push('examples=ok');let output=document.createElement('pre');output.id='smoke-result';output.textContent=log.join('|');document.body.append(output); }catch(e){let output=document.createElement('pre');output.id='smoke-result';output.textContent='FAIL: '+e.stack;document.body.append(output);}
}
</script>
</body></html>
